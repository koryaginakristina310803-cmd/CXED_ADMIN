const subset=(a,b)=>{for(const x of a)if(!b.has(x))return false;return true};

const cpmatchK=(a,b)=>!!(a&&b&&(a===b||(a.length>=5&&b.length>=5&&(a.includes(b)||b.includes(a)||a.slice(0,7)===b.slice(0,7)))));
const MON={января:1,февраля:2,марта:3,апреля:4,мая:5,июня:6,июля:7,августа:8,сентября:9,октября:10,ноября:11,декабря:12};
function parseDate(v){
  if(v==null||v==='')return '';
  if(v instanceof Date&&!isNaN(v))return v.getFullYear()+'-'+pad(v.getMonth()+1)+'-'+pad(v.getDate());
  if(typeof v==='number'&&v>20000&&v<80000){const d=new Date(Math.round((v-25569)*864e5));return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())}
  const s=String(v).trim();let m;
  if(m=s.match(/^(\d{4})-(\d{2})-(\d{2})/))return m[1]+'-'+m[2]+'-'+m[3];
  if(m=s.match(/(\d{1,2})[.\/](\d{1,2})[.\/](\d{2,4})/)){let y=+m[3];if(y<100)y+=2000;return y+'-'+pad(+m[2])+'-'+pad(+m[1])}
  if(m=s.toLowerCase().match(/(\d{1,2})\s+([а-я]+)\s+(\d{4})/))if(MON[m[2]])return m[3]+'-'+pad(MON[m[2]])+'-'+pad(+m[1]);
  return '';
}

async function copyText(t,label){

const debounce=(f,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),ms)}};
const plural=(n,a,b,c)=>{n=Math.abs(n)%100;const k=n%10;return n>10&&n<20?c:k>1&&k<5?b:k===1?a:c};
const num=n=>(n??0).toLocaleString('ru-RU');

const b64=u8=>{let s='';const C=0x8000;for(let i=0;i<u8.length;i+=C)s+=String.fromCharCode.apply(null,u8.subarray(i,i+C));return btoa(s)};
const unb64=s=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};

/* ===== криптография (AES-GCM, PBKDF2) ===== */
const MAGIC=[0x53,0x58,0x44,0x31]; // SXD1
async function deriveKey(pass,salt,iter){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},true,['encrypt','decrypt']);
}
async function gz(u8){const cs=new CompressionStream('gzip');const w=cs.writable.getWriter();w.write(u8);w.close();return new Uint8Array(await new Response(cs.readable).arrayBuffer())}
async function gunz(u8){const ds=new DecompressionStream('gzip');const w=ds.writable.getWriter();w.write(u8);w.close();return new Uint8Array(await new Response(ds.readable).arrayBuffer())}
async function encryptBlob(obj,key,salt,iter){
  const raw=await gz(new TextEncoder().encode(JSON.stringify(obj)));
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,raw));
  const head=new Uint8Array(4+4+16+12);head.set(MAGIC,0);new DataView(head.buffer).setUint32(4,iter);head.set(salt,8);head.set(iv,24);
  const out=new Uint8Array(head.length+ct.length);out.set(head);out.set(ct,head.length);return out;
}
function parseHead(u8){
  if(u8.length<40||MAGIC.some((m,i)=>u8[i]!==m))throw new Error('Неверный формат файла данных');
  return{iter:new DataView(u8.buffer,u8.byteOffset).getUint32(4),salt:u8.slice(8,24),iv:u8.slice(24,36),ct:u8.slice(36)};
}
async function decryptBlob(u8,key){
  const{iv,ct}=parseHead(u8);
  const raw=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct));
  return JSON.parse(new TextDecoder().decode(await gunz(raw)));
}

/* ===== локальное хранилище (IndexedDB) ===== */
const IDB={
  db:null,

  set(k,v){return new Promise(res=>{try{const t=IDB.db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res(true);t.onerror=()=>res(false)}catch(e){res(false)}})}
};
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

/* ===== состояние пользователя ===== */
const blankState=()=>({v:1,marks:{},att:{},extraAtt:{},tracker:{cols:null,rows:{},order:[],ts:0},views:{},uploads:{},ideas:{},log:[],settings:{prefix:'',from:2022},updated:0});
let ST=blankState();
function touch(){ST.updated=nowTs();persistSoon();syncSoon()}
const persistSoon=debounce(()=>{IDB.set('state',ST)},400);
function logAct(txt){ST.log.unshift({t:nowTs(),x:txt});ST.log=ST.log.slice(0,200)}
function mergeState(a,b){ // a — локальное, b — удалённое; побеждает более новое по ts записи
  const out=blankState();
  const mergeMap=(x,y)=>{const o={...x};for(const k in y){if(!o[k]||(y[k].ts||0)>(o[k].ts||0))o[k]=y[k]}return o};
  out.marks=mergeMap(a.marks||{},b.marks||{});
  out.att=mergeMap(a.att||{},b.att||{});
  out.extraAtt=mergeMap(a.extraAtt||{},b.extraAtt||{});
  out.views=mergeMap(a.views||{},b.views||{});
  out.ideas=mergeMap(a.ideas||{},b.ideas||{});
  out.uploads=mergeMap(a.uploads||{},b.uploads||{});
  const ta=a.tracker||{},tb=b.tracker||{};
  out.tracker={cols:(tb.ts||0)>(ta.ts||0)?tb.cols:ta.cols,ts:Math.max(ta.ts||0,tb.ts||0),rows:mergeMap(ta.rows||{},tb.rows||{}),order:[]};
  const ord=[...(ta.order||[]),...(tb.order||[])];out.tracker.order=[...new Set(ord)].filter(id=>out.tracker.rows[id]&&!out.tracker.rows[id].del);
  if((tb.ord_ts||0)>(ta.ord_ts||0)){out.tracker.order=[...new Set([...(tb.order||[]),...ord])].filter(id=>out.tracker.rows[id]&&!out.tracker.rows[id].del);out.tracker.ord_ts=tb.ord_ts}else out.tracker.ord_ts=ta.ord_ts;
  out.log=[...(a.log||[]),...(b.log||[])].sort((x,y)=>y.t-x.t).filter((e,i,arr)=>!i||e.t!==arr[i-1].t||e.x!==arr[i-1].x).slice(0,200);
  out.settings={...(b.settings||{}),...(a.settings||{})};
  out.updated=Math.max(a.updated||0,b.updated||0);
  return out;
}

/* ===== синхронизация через GitHub (зашифрованный файл состояния) ===== */
const SYNC={
  cfg(){return LS.get('sxed_gh',null)},
  status:'off',lastOk:0,sha:null,busy:false,
  async api(path,opt={}){
    const c=this.cfg();const r=await fetch('https://api.github.com/repos/'+c.repo+'/contents/'+c.path+(opt.method==='PUT'?'':'?ref='+encodeURIComponent(c.branch||'main')),{...opt,headers:{'Authorization':'Bearer '+c.token,'Accept':opt.raw?'application/vnd.github.raw+json':'application/vnd.github+json',...(opt.headers||{})}});
    return r;
  },
  async pull(){
    const c=this.cfg();if(!c||!KEY)return null;
    const meta=await this.api('',{});
    if(meta.status===404){this.sha=null;return null}
    if(!meta.ok)throw new Error('GitHub '+meta.status);
    const j=await meta.json();this.sha=j.sha;
    let u8;
    if(j.content){u8=unb64(j.content.replace(/\n/g,''))}
    else{const r=await this.api('',{raw:true});u8=new Uint8Array(await r.arrayBuffer())}
    return await decryptBlob(u8,KEY);
  },
  async push(){
    const c=this.cfg();if(!c||!KEY)return;
    const u8=await encryptBlob(ST,KEY,SALT,ITER);
    const body={message:'Обновление состояния '+new Date().toISOString().slice(0,16),content:b64(u8),branch:c.branch||'main'};
    if(this.sha)body.sha=this.sha;
    const r=await this.api('',{method:'PUT',body:JSON.stringify(body)});
    if(r.status===409||r.status===422){return 'conflict'}
    if(!r.ok)throw new Error('GitHub '+r.status);
    const j=await r.json();this.sha=j.content.sha;return 'ok';
  },
  async sync(manual){
    if(!this.cfg()||this.busy)return;this.busy=true;this.setStatus('sync');
    try{
      for(let i=0;i<3;i++){
        const remote=await this.pull();
        if(remote){ST=mergeState(ST,remote);IDB.set('state',ST);}
        const r=await this.push();
        if(r!=='conflict')break;
      }
      this.lastOk=nowTs();this.setStatus('ok');if(manual)toast('Синхронизировано с GitHub');
      if(typeof onStateMerged==='function')onStateMerged();
    }catch(e){console.error(e);this.setStatus('err');if(manual)toast('Ошибка синхронизации: '+e.message,'bad',6000)}
    this.busy=false;
  },
  setStatus(s){this.status=s;const e=$('#syncchip');if(e){e.dataset.s=s;e.querySelector('.t').textContent=({off:'Не подключено',sync:'Синхронизация…',ok:'Синхронизировано',err:'Ошибка синхронизации'})[s]}}
};
const syncSoon=debounce(()=>{if(SYNC.cfg())SYNC.sync(false)},20000);

/* ===== чтение файлов выгрузок ===== */
function readFileBuf(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsArrayBuffer(f)})}
function parseMXL(buf){ // выгрузка списка договоров из 1С в формате .mxl (текстовый MOXCEL)
  const t=new TextDecoder('utf-8').decode(buf).replace(/^﻿/,'');
  const st=t.indexOf('{8,1,12');const body=st>=0?t.slice(st):t;
  const rx=/\{16,\d+,\s*\{1,(?:1,\s*\{"#","((?:[^"]|"")*)"\}|0)\s*\},0\},(\d+),(0,10,0,)?/g;
  const rows=[];let cur=[];let m;let pos=body.indexOf('{16,1,');if(pos<0)pos=0;rx.lastIndex=pos;
  while((m=rx.exec(body))){cur.push(m[1]!=null?m[1].replace(/""/g,'"'):'');if(m[3]){rows.push(cur);cur=[]}}
  if(cur.length)rows.push(cur);return rows;
}
async function readTable(file){ // -> {rows:[[...]], name}
  const buf=await readFileBuf(file);const ext=(file.name.split('.').pop()||'').toLowerCase();
  if(ext==='mxl')return{rows:parseMXL(buf),name:file.name,fmt:'mxl'};
  if(!window.XLSX)await loadXLSX();
  const wb=XLSX.read(buf,{type:'array',cellDates:true});
  return{wb,name:file.name,fmt:ext};
}
function sheetRows(wb,name){const ws=wb.Sheets[name];return XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null,blankrows:false})}
let _xl=null;
function loadXLSX(){if(window.XLSX)return Promise.resolve();return _xl||(_xl=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=res;s.onerror=()=>rej(new Error('Не удалось загрузить модуль Excel (нужен интернет)'));document.head.appendChild(s)}))}
function exportXLSX(name,sheets){ // sheets: {имя:[[...],[...]]}
  return loadXLSX().then(()=>{const wb=XLSX.utils.book_new();for(const n in sheets){const ws=XLSX.utils.aoa_to_sheet(sheets[n]);ws['!cols']=(sheets[n][0]||[]).map((_,j)=>({wch:Math.min(60,Math.max(10,...sheets[n].slice(0,200).map(r=>String(r[j]??'').length)))}));XLSX.utils.book_append_sheet(wb,ws,n.slice(0,31))}XLSX.writeFile(wb,name)});
}

/* ===== сопоставление выгрузок с описью ===== */
const GUESS={
  num:[/номер.*договор|№.*договор|^номер$|^№$|номер документа|^договор$|num/i],
  cp:[/контрагент|клиент|покупатель|организаци|партн[её]р|наименование контрагента|counterpart/i],

function revGaps(){

function parseAttName(fn){
  const base=fn.replace(/\.[a-z0-9]+$/i,'');
  const kind=/дополнительн\w*\s+соглашен|^дс\b/i.test(base)?'Допсоглашение':/специфик/i.test(base)?'Спецификация':/бланк.?заказ/i.test(base)?'Бланк-заказ':/заявк/i.test(base)?'Заявка':/приложен/i.test(base)?'Приложение':/заказ/i.test(base)?'Заказ':'Приложение';
  const head=base.split(/\s+к\s+договор/i)[0];
  const an=(head.match(/№\s*([^\s,;()]+)/)||[])[1]||'';
  const dt=(base.match(/от\s*(\d{1,2}\.\d{2}\.\d{4})/)||base.match(/(\d{2}\.\d{2}\.\d{4})/)||[])[1]||'';
  const cn=(base.match(/к\s+договор\w*\s*№\s*(.+?)(?:\s+[—–-]\s+|\s*\(вх|\s*\[|$)/i)||[])[1]||'';
  let cp=(base.match(/\s[—–]\s([^[(—–]+?)\s*(?:\(вх\.?\)|\(исх\.?\)|\[|$)/)||[])[1]||'';
  return{kind,anum:an,date:dt?fmtDisp2iso(dt):'',cnum:cn.trim(),ccp:cp.trim(),title:head.trim()||base,file:fn};
}

function importDocs(rows,fname){

        if(replace||!ST.tracker.order.length||await confirmBox('Колонки будут заменены колонками из вашего файла, текущие задачи сохранятся и добавятся в конец. Продолжить?','Продолжить')){
          if(replace){for(const id of ST.tracker.order){ST.tracker.rows[id]={...ST.tracker.rows[id],del:1,ts:nowTs()}}ST.tracker.order=[]}
          ST.tracker.cols=C;ST.tracker.ts=nowTs();
          const ids=[];data.forEach(r=>{const id='t'+uid();const o={id,ts:nowTs()};C.forEach((c,k)=>{let v=r[J[k]];if(v instanceof Date)v=parseDate(v);else if(c.t==='date')v=parseDate(v)||String(v??'');o[c.id]=v==null?'':String(v)});ST.tracker.rows[id]=o;ids.push(id)});

        }
      }catch(e){console.error(e);toast(e.message||'Не удалось прочитать файл','bad',6000)}
    }));
  });

let DATABIN=null;
async function loadBin(){
  try{const r=await fetch('data.bin',{cache:'no-cache'});if(!r.ok)throw 0;return new Uint8Array(await r.arrayBuffer())}catch(e){return null}
}
function loginScreen(msg){
  const app=document.getElementById('app');
  app.innerHTML=`<div class="login"><div class="lcard"><div class="logo big">${ic('folder',34)}</div><h1>СХЭД · Учёт</h1><p class="muted">Рабочее место администратора цифрового хранилища</p>
  ${DATABIN?`<form id="lf"><label>Пароль<input id="lp" type="password" class="inp" placeholder="Введите пароль" autofocus autocomplete="current-password"></label><label class="sw"><input type="checkbox" id="lr" checked><span>запомнить на этом устройстве</span></label><button class="btn pri wide" id="lb">${ic('lock',16)} Открыть</button><p class="err" id="le">${esc(msg||'')}</p></form>`:`<div class="callout warn"><b>Файл данных не найден</b><p>Рядом с приложением должен лежать файл <b>data.bin</b>. Если вы открыли приложение прямо с компьютера, выберите файл вручную.</p></div><label class="btn pri wide">Выбрать data.bin<input type="file" id="lfile" hidden></label>`}
  <p class="muted sm c">Данные зашифрованы: без пароля их не прочитать, даже если страница лежит в открытом доступе.</p></div></div>`;
  const f=$('#lf');
  if(f)f.onsubmit=async e=>{e.preventDefault();$('#lb').disabled=true;$('#le').textContent='';try{await unlock($('#lp').value,$('#lr').checked)}catch(err){$('#le').textContent=err.message||'Неверный пароль';$('#lb').disabled=false}};
  const fi=$('#lfile');if(fi)fi.onchange=async()=>{DATABIN=new Uint8Array(await fi.files[0].arrayBuffer());loginScreen()};
}
async function unlock(pass,remember){
  const{iter,salt}=parseHead(DATABIN);
  const key=await deriveKey(pass,salt,iter);
  let data;try{data=await decryptBlob(DATABIN,key)}catch(e){throw new Error('Неверный пароль')}
  if(remember){const raw=new Uint8Array(await crypto.subtle.exportKey('raw',key));LS.set('sxed_key',{salt:b64(salt),key:b64(raw)})}
  await start(data,key,salt,iter);
}
async function tryRemembered(){
  const r=LS.get('sxed_key',null);if(!r||!DATABIN)return false;
  try{const{iter,salt}=parseHead(DATABIN);if(b64(salt)!==r.salt)return false;
    const key=await crypto.subtle.importKey('raw',unb64(r.key),'AES-GCM',true,['encrypt','decrypt']);
    const data=await decryptBlob(DATABIN,key);await start(data,key,salt,iter);return true}catch(e){LS.del('sxed_key');return false}
}
async function start(data,key,salt,iter){
  DATA=data;KEY=key;SALT=salt;ITER=iter;
  const saved=await IDB.get('state');ST={...blankState(),...(saved||{})};ST.settings={...blankState().settings,...ST.settings};
  buildAll();shell();applyTheme();route();
  if(SYNC.cfg())SYNC.sync(false).then(()=>{buildAll();onStateMerged()});
  window.addEventListener('focus',()=>{if(SYNC.cfg()&&nowTs()-SYNC.lastOk>60000)SYNC.sync(false)});
}
async function boot(){
  applyTheme();
  try{await IDB.open()}catch(e){console.warn('IndexedDB недоступен',e)}
  document.getElementById('app').innerHTML='<div class="login"><div class="lcard"><div class="spin"></div><p class="muted">Загрузка…</p></div></div>';
  DATABIN=await loadBin();
  if(await tryRemembered())return;
  loginScreen();
}
window.addEventListener('DOMContentLoaded',boot);

</script></body></html>
