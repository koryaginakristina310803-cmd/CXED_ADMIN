const MAGIC=[0x53,0x58,0x44,0x31]; // SXD1
async function deriveKey(pass,salt,iter){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},true,['encrypt','decrypt']);
}

async function encryptBlob(obj,key,salt,iter){
  const raw=await gz(new TextEncoder().encode(JSON.stringify(obj)));
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,raw));
  const head=new Uint8Array(4+4+16+12);head.set(MAGIC,0);new DataView(head.buffer).setUint32(4,iter);head.set(salt,8);head.set(iv,24);
  const out=new Uint8Array(head.length+ct.length);out.set(head);out.set(ct,head.length);return out;
}
function parseHead(u8){
  if(u8.length<40||MAGIC.some((m,i)=>u8[i]!==m))throw new Error('Неверный формат файла данных');
  return{iter:new DataView(u8.buffer,u8.byteOffset).getUint32(4),salt:u8.slice(8,24),iv:u8.slice(24,36),ct:u8.slice(36)};
}
async function decryptBlob(u8,key){
  const{iv,ct}=parseHead(u8);

  return JSON.parse(new TextDecoder().decode(await gunz(raw)));
}

const SYNC={
  cfg(){return VIEW?null:LS.get('sxed_gh',null)},
  status:'off',lastOk:0,sha:null,busy:false,
  async api(path,opt={}){
    const c=this.cfg();const r=await fetch('https://api.github.com/repos/'+c.repo+'/contents/'+c.path+(opt.method==='PUT'?'':'?ref='+encodeURIComponent(c.branch||'main')),{...opt,headers:{'Authorization':'Bearer '+c.token,'Accept':opt.raw?'application/vnd.github.raw+json':'application/vnd.github+json',...(opt.headers||{})}});
    return r;
  },
  async pull(){
    const c=this.cfg();if(!c||!KEY)return null;
    const meta=await this.api('',{});
    if(meta.status===404){this.sha=null;return null}
    if(!meta.ok)throw new Error('GitHub '+meta.status);
    const j=await meta.json();this.sha=j.sha;
    let u8;
    if(j.content){u8=unb64(j.content.replace(/\n/g,''))}
    else{const r=await this.api('',{raw:true});u8=new Uint8Array(await r.arrayBuffer())}

    const c=this.cfg();if(!c||!KEY)return;

    if(this.sha)body.sha=this.sha;
    const r=await this.api('',{method:'PUT',body:JSON.stringify(body)});
    if(r.status===409||r.status===422){return 'conflict'}
    if(!r.ok)throw new Error('GitHub '+r.status);

  },

    if(!this.cfg()||this.busy)return;this.busy=true;this.setStatus('sync');

        const remote=await this.pull();

      }

};

  const out=[];

    const x=rows[r];if(!x)continue;
    const g=k=>map[k]!=null?x[map[k]]:null;

    if(c.k){if(!idx.byk.has(c.k))idx.byk.set(c.k,[]);idx.byk.get(c.k).push(c);idx.names.push([nn((c.name||'').replace(DRE,' ')),c])}

}

    const sts=new Set(m.map(c=>c.state));
    const closedOnly=m.every(c=>/закр/i.test(c.state));

  }
  if(cand.length)return{code:'numoth',m:cand.map(c=>c.i)};
  const same=(idx.all||[]).filter(c=>sameCp(x,c,tkx,ckx));
  if(same.length){
    const sd=same.filter(c=>!c.generic&&c.date&&c.date===x.date);
    if(sd.length)return{code:'cpdate',m:sd.map(c=>c.i)};
    if(same.every(c=>c.generic))return{code:'generic',m:same.map(c=>c.i)};

function applyMgr1c(opisC,recs){
  const from=ST.settings.from||2022;const sc=opisC.filter(c=>c.y!=null&&c.y>=from);
  const cnt={};for(const c of sc)if(c.mgr)cnt[c.mgr]=(cnt[c.mgr]||0)+1;
  const std=new Set(Object.keys(cnt).filter(m=>cnt[m]>=3));
  const single=[...std].filter(m=>!/[\/(]/.test(m));
  const first=s=>String(s).trim().split(/\s+/)[0].toLowerCase();
  const canon=full=>{const p=String(full).trim().split(/\s+/);const S=p[0],ini=(p[1]||'')[0]||'';
    const cands=single.filter(m=>first(m)===S.toLowerCase());
    if(cands.length===1)return cands[0];
    if(cands.length>1)return cands.find(m=>ini&&m.toLowerCase().includes(' '+ini.toLowerCase()+'.'))||cands.find(m=>m.toLowerCase()===S.toLowerCase())||cands[0];
    return S};

  const usedO=new Set(),usedN=new Set();const changed=[];
  const pass=(kf,why,ok=r=>!!nn(r.num))=>{
    const idx=new Map();O.forEach(r=>{if(usedO.has(r._i))return;const k=kf(r);if(!k||!ok(r))return;if(!idx.has(k))idx.set(k,[]);idx.get(k).push(r)});
    for(const n of N){
      if(usedN.has(n._i)||!ok(n))continue;const k=kf(n);const L=idx.get(k);if(!L||!L.length)continue;
      const o=L.shift();usedO.add(o._i);usedN.add(n._i);
      const diffs=[];
      if(why){const w=why(o,n);if(w)diffs.push(w)}
      if(why!=='cp'&&norm(o.cp)!==norm(n.cp)&&cpk(o.cp)!==cpk(n.cp))diffs.push(['Контрагент',o.cp,n.cp]);
      for(const [f,l] of OPF){if(norm(o[f])!==norm(n[f])&&(o[f]||n[f]))diffs.push([l,o[f]||'—',n[f]||'—'])}
      if(diffs.length)changed.push({o,n,diffs});
    }
  };
  pass(key3,null,()=>true);
  pass(key2,(o,n)=>['Дата',fmtD(o.date)||'—',fmtD(n.date)||'—']);
  pass(keyD,(o,n)=>nn(o.num)===nn(n.num)?null:['Номер',o.num||'—',n.num||'—'],r=>!!r.date);
  pass(keyN,(o,n)=>['Контрагент',o.cp,n.cp]);
  const removed=O.filter(r=>!usedO.has(r._i)),added=N.filter(r=>!usedN.has(r._i));
  return{added,removed,changed,same:O.length-removed.length-changed.length,nOld:O.length,nNew:N.length};
}
const diffSummary=d=>`+${d.added.length} / −${d.removed.length} / изменено ${d.changed.length}`;

/* ===== Открытие файлов прямо из архивов (File System Access API) =====
   Один раз выбираете папку, где лежат архивы (zip) или их распакованные папки.
   Дальше по кнопке «Открыть файл» приложение само находит документ и открывает его. */
const ARC={
  root:null,name:'',ok:false,
  zips:new Map(),     // имя файла -> {file, ents:[{n,low,base,m,cs,us,off}], byBase:Map}
  tree:null,          // индекс распакованных файлов: basename(low) -> [{path,handle}]
  supported:typeof window!=='undefined'&&!!window.showDirectoryPicker,
  nrm:s=>String(s||'').normalize('NFC').toLowerCase().replace(/ё/g,'е').replace(/\\/g,'/').replace(/\s+/g,' ').trim(),
  nsrc:s=>ARC.nrm(s).replace(/[_]+/g,' ').replace(/^схэд /,'').replace(/\.(zip|rar|7z)$/,''),
  years(s){const y=new Set();for(const m of String(s).matchAll(/(20\d\d)\s*[-–]\s*(20\d\d)/g)){for(let i=+m[1];i<=+m[2];i++)y.add(i)}for(const m of String(s).matchAll(/20\d\d/g))y.add(+m[0]);return y},
  srcMatch(fname,src){ // подходит ли имя архива/папки к «Архиву-источнику» документа
    if(!src)return true;const a=this.nsrc(fname),b=this.nsrc(src);if(a.startsWith(b)||b.startsWith(a))return true;
    const w1=a.split(' ')[0],w2=b.split(' ')[0];if(w1!==w2)return false;
    const ya=this.years(a),yb=this.years(b);if(!ya.size||!yb.size)return false;for(const y of yb)if(ya.has(y))return true;return false;
  },
  async init(){
    if(!this.supported)return;
    try{const h=await IDB.get('arcroot');if(h){this.root=h;this.name=h.name;await this.checkPerm(false)}}catch(e){}
  },
  async checkPerm(ask){
    if(!this.root)return false;
    try{
      let p=await this.root.queryPermission({mode:'read'});
      if(p!=='granted'&&ask)p=await this.root.requestPermission({mode:'read'});
      this.ok=p==='granted';
    }catch(e){this.ok=false}
    return this.ok;
  },
  async pick(){
    const h=await window.showDirectoryPicker({id:'sxed-archives',mode:'read'});
    this.root=h;this.name=h.name;this.ok=true;await this.reindex();
    await IDB.set('arcroot',h);return h;
  },
  async forget(){this.root=null;this.name='';this.ok=false;await this.reindex();await IDB.set('arcroot',null)},

  /* ---- распакованные папки ---- */
  async child(dir,name,isDir){ // точное имя, иначе — совпадение без учёта регистра/нормализации
    try{return isDir?await dir.getDirectoryHandle(name):await dir.getFileHandle(name)}catch(e){}
    const n=this.nrm(name);
    for await(const [k,v] of dir.entries()){if(this.nrm(k)===n&&(isDir?v.kind==='directory':v.kind==='file'))return v}
    return null;
  },
  async walk(dir,segs){let cur=dir;for(let i=0;i<segs.length;i++){const last=i===segs.length-1;const h=await this.child(cur,segs[i],!last);if(!h)return null;cur=h}return cur},
  async tryUnpacked(rel,src){
    const segs=rel.split('/').filter(Boolean);
    const key='base:'+src;
    if(this._base&&this._base[key]){const h=await this.walk(this._base[key],segs);if(h)return await h.getFile()}
    // ширина-поиск: ищем папку, внутри которой лежит путь документа (глубина до 4, не больше 400 папок)
    const queue=[[this.root,0]];let seen=0;
    while(queue.length&&seen<400){
      const [dir,dep]=queue.shift();seen++;
      const h=await this.walk(dir,segs);
      if(h){(this._base=this._base||{})[key]=dir;return await h.getFile()}
      if(dep>=4)continue;
      const kids=[];
      try{for await(const [k,v] of dir.entries()){if(v.kind==='directory')kids.push([k,v])}}catch(e){}
      // сначала папки, похожие на нужный архив
      kids.sort((a,b)=>(this.srcMatch(b[0],src)?1:0)-(this.srcMatch(a[0],src)?1:0));
      for(const [k,v] of kids)queue.push([v,dep+1]);
    }
    return null;
  },
  async buildTree(progress){
    if(this.tree)return this.tree;
    const T=new Map();let n=0;
    const rec=async(dir,path,depth)=>{
      for await(const [k,v] of dir.entries()){
        if(v.kind==='directory'){if(depth<8)await rec(v,path+k+'/',depth+1)}
        else{const b=this.nrm(k);if(!T.has(b))T.set(b,[]);T.get(b).push({path:path+k,handle:v});if(++n%500===0&&progress)progress(n)}
      }
    };
    await rec(this.root,'',0);this.tree=T;return T;
  },
  async findByName(names,rel){
    const T=await this.buildTree(n=>toast('Ищу файл в папке… проверено '+n,'info',900));
    const want=this.nrm(rel);
    for(const nm of names){
      const L=T.get(this.nrm(nm));if(!L||!L.length)continue;
      const best=L.find(x=>want.endsWith(this.nrm(x.path))||this.nrm(x.path).endsWith(want))||L[0];
      return await best.handle.getFile();
    }
    return null;
  },

  /* ---- ZIP без распаковки всего архива ---- */
  async zipIndex(fh){
    const key=fh.name;if(this.zips.has(key))return this.zips.get(key);
    const file=await fh.getFile();const size=file.size;
    const tail=new DataView(await file.slice(Math.max(0,size-70000),size).arrayBuffer());
    let e=-1;for(let i=tail.byteLength-22;i>=0;i--){if(tail.getUint32(i,true)===0x06054b50){e=i;break}}
    if(e<0)throw new Error('не zip');
    let cnt=tail.getUint16(e+10,true),cdSize=tail.getUint32(e+12,true),cdOff=tail.getUint32(e+16,true);
    if(cnt===0xFFFF||cdOff===0xFFFFFFFF||cdSize===0xFFFFFFFF){ // zip64
      let l=-1;for(let i=e-20;i>=0;i--){if(tail.getUint32(i,true)===0x07064b50){l=i;break}}
      if(l>=0){const o=Number(tail.getBigUint64(l+8,true));const z=new DataView(await file.slice(o,o+56).arrayBuffer());cnt=Number(z.getBigUint64(32,true));cdSize=Number(z.getBigUint64(40,true));cdOff=Number(z.getBigUint64(48,true))}
    }
    const cd=new DataView(await file.slice(cdOff,cdOff+cdSize).arrayBuffer());const u8=new Uint8Array(cd.buffer);
    const ents=[];const byBase=new Map();let p=0;const u=new TextDecoder('utf-8'),o866=new TextDecoder('ibm866');
    while(p+46<=cd.byteLength&&cd.getUint32(p,true)===0x02014b50){
      const flags=cd.getUint16(p+8,true),m=cd.getUint16(p+10,true);let cs=cd.getUint32(p+20,true),us=cd.getUint32(p+24,true);

/* куда писать пакет: сразу на диск (Chrome/Edge) или в память с последующим скачиванием */
async function zipSink(fileName,dir){
  if(dir){const fh=await dir.getFileHandle(fileName,{create:true});const w=await fh.createWritable();return{write:u=>w.write(u),close:()=>w.close(),disk:true}}
  if(window.showSaveFilePicker){
    const fh=await window.showSaveFilePicker({suggestedName:fileName,types:[{description:'ZIP-архив',accept:{'application/zip':['.zip']}}]});
    const w=await fh.createWritable();return{write:u=>w.write(u),close:()=>w.close(),disk:true};
  }
  const parts=[];return{write:async u=>{parts.push(u)},close:async()=>download(fileName,new Blob(parts,{type:'application/zip'})),disk:false};
}
/* собрать zip из списка {path, rel, src, alts} */
async function buildZip(fileName,items,extra,progress,dir){
  const sink=await zipSink(fileName,dir);const z=new ZipOut(sink);const miss=[];let ok=0;
  try{
    for(let i=0;i<items.length;i++){
      const it=items[i];if(progress)progress(i,items.length,it);
      let r=null;try{r=await ARC.fetchBlob(it.rel,it.src,it.alts)}catch(e){}
      if(r&&r.blob){await z.add(it.path,r.blob);ok++}else miss.push(it);
    }
    for(const [p,t] of Object.entries(extra||{}))await z.add(p,t);
    if(miss.length)await z.add('НЕ_НАЙДЕНО.txt','\ufeffФайлы, которых не оказалось в выбранной папке с архивами:\r\n\r\n'+miss.map(m=>m.rel).join('\r\n'));
    await z.finish();
  }catch(e){try{await sink.close()}catch(_){}throw e}
  return{ok,miss};
}

  if(attN-attDone)todo.push([`${num(attN-attDone)} приложений ещё не прикреплено`,'Допсоглашения и спецификации к входящим договорам.','info','#attach',null]);
  const topN=6;const showAll=V.overview.all;

  el.innerHTML=`
  <div class="pghead"><div><h1>Обзор</h1><p class="muted">Договоры с ${ST.settings.from||2022} года · данные на ${esc(DATA.built)}</p></div><div class="row"><button class="btn pri" data-go="#report">${ic('print',16)} Отчёт для главбуха</button></div></div>
  <div class="hero">
    <div class="card herocard">
      <div class="ringw">${ring(pct,132,pct>80?'var(--ok)':pct>50?'var(--warn)':'var(--bad)')}</div>
      <div><h2>Сведено полностью</h2><p class="big">${num(K.full)} из ${num(K.total)}</p><p class="muted">Ещё ${num(dirty)} ${plural(dirty,'договор','договора','договоров')} требуют действий: ${num(K.open)} открыто, ${num(K.done)} закрыто вами.</p></div>
    </div>
    <div class="kpis">
      ${kpi('Нет в 1С',num(K.c1bad),`ещё ${num(K.c1warn)} — проверить`,K.c1bad?'bad':'ok','#contracts',{c1:['cpnodoc','nocp','none']})}
      ${kpi('Нет в СХЭД',num(K.sxbad),`ещё ${num(K.sxwarn)} — частично/в архиве`,K.sxbad?'bad':'ok','#contracts',{sx:['no']})}
      ${kpi('Нет в СБИС',K.sbOn?num(K.sbbad):'—',K.sbOn?'по загруженной выгрузке':'выгрузка не загружена',K.sbOn&&K.sbbad?'bad':'mute',K.sbOn?'#contracts':'#uploads',K.sbOn?{sb:['nocp','cpnodoc','none','generic']}:null)}
      ${kpi('Без менеджера',num(K.mgrless),'не указан ответственный',K.mgrless?'warn':'ok','#contracts',{mgr:['']})}
    </div>
  </div>
  <div class="cols2">
    <section class="card"><h3>Что сделать в первую очередь</h3>
      <div class="todo">${(showAll?todo:todo.slice(0,topN)).map(t=>`<div class="ti ${t[2]}" data-go="${t[3]}" ${t[4]?`data-preset='${esc(JSON.stringify(t[4]))}'`:''}><div><b>${t[0]}</b><span>${t[1]}</span></div>${ic('chev')}</div>`).join('')||'<p class="muted">Всё в порядке — пропусков нет.</p>'}</div>
      ${todo.length>topN?`<p class="muted sm"><a id="ov-more">${showAll?'Свернуть':'Показать все ('+todo.length+')'}</a></p>`:''}
    </section>
    <section class="card"><h3>Нагрузка по менеджерам <small class="muted">открытых вопросов</small></h3>${ms.length?bars(ms.slice(0,8)):'<p class="muted">Открытых вопросов нет.</p>'}<p class="muted sm"><a href="#managers">Все менеджеры →</a></p></section>
  </div>
  ${fold('rev','Есть в источниках, но нет в описи',`${num(RG.total)} ${plural(RG.total,'договор','договора','договоров')}`,`<p class="muted sm">Чтобы не пропустить договор, которого опись не знает. Нажмите на источник — увидите список.</p><div class="kpis rv4">${[['c1','1С',RG.only1c.length],['ar','Архивы',RG.arch.length],['nso','Исходящие в СХЭД',RG.nso.length],['sb','СБИС',SBIS.length?RG.onlysb.length:null]].map(([w,l,n])=>`<button class="kpi ${n==null?'mute':n?'warn':'ok'}" data-rv="${w==='nso'?'ar':w}"><span class="kl">${l}</span><span class="kv">${n==null?'—':num(n)}</span><span class="ks">${n==null?'выгрузка не загружена':'нет в описи'}</span></button>`).join('')}</div>`,false)}
  ${fold('years','Договоры по годам','зелёное — сведено, жёлтое — проверить, красное — нет в источнике',bars(yb),false)}
  ${fold('src','Источники данных и архив','',`<div class="srcs">
      ${src('opis','Опись договоров',`лист «ТЕХНОСТАЙЛ» · ${num(CON.filter(c=>c.k==='o').length)} договоров`)}

      ${src('sxed','СХЭД — загруженные договоры',`${num(SXREC.length)} файлов`)}
      ${src('sbis','СБИС (ЭДО)','не загружено — загрузите выгрузку')}

    </div><p class="muted sm"><a href="#uploads">Загрузить новую выгрузку →</a></p>`,false)}
  ${fold('log','Последние действия','',ST.log.length?`<div class="log">${ST.log.slice(0,8).map(l=>`<div><span class="muted">${new Date(l.t).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</span> ${esc(l.x)}</div>`).join('')}</div>`:'<p class="muted">Пока пусто. Отметки, загрузки и правки трекера будут появляться здесь.</p>',false)}`;
  $$('details.fold',el).forEach(d=>d.ontoggle=()=>LS.set('sxed_ov_'+d.dataset.f,d.open));
  const mo=$('#ov-more',el);if(mo)mo.onclick=()=>{V.overview.all=!V.overview.all;V.overview(el)};

};

/* ===== Договоры ===== */
const CF0=()=>({q:'',y:[],mgr:[],kind:[],dir:[],c1:[],sx:[],sb:[],work:[],gap:[],all:false,sort:'date',dir_:-1,page:0,sel:new Set()});
const QUICK=[['all','Все'],['gap','С пробелами'],['sxno','Нет в СХЭД'],['sxarch','Лежат в архиве'],['c1no','Нет в 1С'],['c1chk','В 1С проверить'],['nomark','Без отметки']];
const QPRE={all:{},gap:{gap:['gap']},sxno:{sx:['no']},sxarch:{sx:['arch']},c1no:{c1:['cpnodoc','nocp','none']},c1chk:{c1:['generic','datediff','numoth','cpdate','closed','dup']},nomark:{gap:['gap'],work:['none']}};
const qkOn=(F,k)=>{const p=QPRE[k];const base=CF0();const keys=['y','mgr','kind','dir','c1','sx','sb','work','gap'];return keys.every(x=>JSON.stringify(F[x]||[])===JSON.stringify(p[x]||base[x]))&&!F.q};
V.contracts=function(el){
  const F=V.contracts.F=V.contracts.F||CF0();
  if(PRESET.contracts){Object.assign(F,CF0(),PRESET.contracts);delete PRESET.contracts}
  const yearsAll=[...new Set(CON.map(c=>c.y).filter(Boolean))].sort((a,b)=>b-a);
  const mgrs=Object.entries(CON.reduce((m,c)=>{const k=c.mgr||'';m[k]=(m[k]||0)+1;return m},{})).sort((a,b)=>b[1]-a[1]);
  const opt=(m)=>Object.keys(m).map(k=>({v:k,l:m[k][0]}));
  el.innerHTML=`<div class="pghead"><div><h1>Договоры</h1><p class="muted">Единый реестр: опись, 1С, СХЭД, СБИС и архивы — по каждому договору видно, где он есть, а где потерялся.</p></div>
  <div class="row">${VIEW?'':`<button class="btn" id="cv-save">${ic('bookmark',16)} Сохранить подборку</button>`}<button class="btn" id="cv-x">${ic('dl',16)} Экспорт в Excel</button></div></div>
  <div class="card filters" id="cv-f"><div class="fsearch">${ic('search',17)}<input id="cv-q" placeholder="Контрагент, номер договора, ИНН, менеджер…" value="${esc(F.q)}"></div>
  <div class="chips qk" id="cv-qk">${QUICK.map(([k,l])=>`<button class="qchip ${qkOn(F,k)?'on':''}" data-q="${k}">${l}</button>`).join('')}</div>
  <div class="fgrid" id="cv-fg"></div>
  <div class="frow"><button class="btn sm" id="cv-more">Ещё фильтры<span id="cv-mn"></span></button><div class="chips" id="cv-views"></div><label class="sw"><input type="checkbox" id="cv-all" ${F.all?'checked':''}><span>показывать договоры старше ${ST.settings.from||2022} г.</span></label><a class="clr" id="cv-clr">Сбросить</a></div>
  <div class="fgrid fmore" id="cv-fg2" hidden></div></div>
  <div class="card tblw" id="cv-r"></div>`;
  const fg=$('#cv-fg',el),fg2=$('#cv-fg2',el);const PRIM=new Set(['y','mgr','gap']);
  const add=(id,label,options,key)=>{const m=msel(id,label,options,F[key],v=>{F[key]=v;F.page=0;paint();moreN()});(PRIM.has(key)?fg:fg2).appendChild(m)};
  const moreN=()=>{const n=['kind','dir','c1','sx','sb','work'].filter(k=>F[k].length).length;$('#cv-mn',el).innerHTML=n?` <b>${n}</b>`:'';if(n)fg2.hidden=false};
  add('f-y','Год',yearsAll.map(y=>({v:y,l:String(y),n:CON.filter(c=>c.y===y).length})),'y');
  add('f-m','Менеджер',mgrs.map(([k,n])=>({v:k,l:k||'Не указан',n})),'mgr');
  add('f-k','Откуда договор',[{v:'o',l:'Есть в описи'},{v:'a',l:'Только в архивах (нет в описи)'}],'kind');
  add('f-d','Направление',[{v:'in',l:'Входящий'},{v:'out',l:'Исходящий'}],'dir');
  add('f-c1','1С',Object.keys(L1C).filter(k=>!['unk'].includes(k)).map(k=>({v:k,l:L1C[k][0]})),'c1');
  add('f-sx','СХЭД',Object.keys(LSX).filter(k=>k!=='unk').map(k=>({v:k,l:LSX[k][0]})),'sx');
  add('f-sb','СБИС',[{v:'ok',l:'Есть в СБИС'},{v:'miss',l:'Нет в СБИС'},{v:'unk',l:'СБИС не загружен'}],'sb');
  add('f-w','Моя отметка',[{v:'none',l:'Без отметки'},...Object.keys(WORK).map(k=>({v:k,l:WORK[k][0]}))],'work');
  add('f-g','Пробелы',[{v:'gap',l:'Есть пробелы'},{v:'full',l:'Всё сведено'}],'gap');
  $('#cv-more',el).onclick=()=>{fg2.hidden=!fg2.hidden};moreN();
  $('#cv-qk',el).onclick=e=>{const b=e.target.closest('[data-q]');if(!b)return;Object.assign(F,CF0(),QPRE[b.dataset.q]);V.contracts(el)};
  const drawViews=()=>{const vs=Object.entries(ST.views).filter(([k,v])=>!v.del&&v.scope==='contracts');$('#cv-views',el).innerHTML=vs.length?'<span class="muted">Подборки:</span>'+vs.map(([k,v])=>`<span class="chip"><a data-v="${k}">${esc(v.name)}</a><i data-vx="${k}">×</i></span>`).join(''):''};
  drawViews();
  $('#cv-views',el).onclick=e=>{const a=e.target.closest('[data-v]'),x=e.target.closest('[data-vx]');if(a){Object.assign(F,CF0(),ST.views[a.dataset.v].f);V.contracts(el)}if(x){ST.views[x.dataset.vx]={...ST.views[x.dataset.vx],del:1,ts:nowTs()};touch();drawViews()}};
  $('#cv-q',el).oninput=debounce(e=>{F.q=e.target.value;F.page=0;paint()},200);
  $('#cv-all',el).onchange=e=>{F.all=e.target.checked;F.page=0;paint()};
  $('#cv-clr',el).onclick=()=>{Object.assign(F,CF0());V.contracts(el)};
  const svb=$('#cv-save',el);if(svb)svb.onclick=()=>{openModal(`<h3>Сохранить подборку</h3><p class="muted">Текущие фильтры сохранятся, чтобы быстро возвращаться к ним.</p><input id="vn" class="inp" placeholder="Название, например «Нет в СХЭД — Вершинин»"><div class="row end"><button class="btn pri" id="vs">Сохранить</button></div>`,m=>{m.querySelector('#vs').onclick=()=>{const n=m.querySelector('#vn').value.trim();if(!n)return;const id=uid();const f={...F};delete f.sel;delete f.page;ST.views[id]={name:n,scope:'contracts',f,ts:nowTs()};touch();closeModal();drawViews();toast('Подборка сохранена')}})};
  function filtered(){
    const q=F.q.trim().toLowerCase();const from=ST.settings.from||2022;
    let r=CON.filter(c=>{
      if(!F.all&&c.k==='o'&&c.y!=null&&c.y<from)return false;
      if(F.y.length&&!F.y.includes(String(c.y)))return false;
      if(F.mgr.length&&!F.mgr.includes(c.mgr||''))return false;
      if(F.kind.length&&!F.kind.includes(c.k))return false;
      if(F.dir.length&&!F.dir.includes(c.dir||''))return false;
      if(F.c1.length&&!F.c1.includes(c.c1))return false;
      if(F.sx.length&&!F.sx.includes(c.sx))return false;
      if(F.sb.length&&!F.sb.some(v=>v==='unk'?c.sb==='unk':v==='ok'?['ok','closed','dup','datediff','cpdate','numoth'].includes(c.sb):(c.sb!=='unk'&&!['ok','closed','dup','datediff','cpdate','numoth'].includes(c.sb))))return false;
      if(F.work.length){const m=markOf(c);const w=m&&m.s?m.s:'none';if(!F.work.includes(w))return false}
      if(F.gap.length){const g=gapsOf(c).length>0;if(F.gap.includes('gap')&&!g&&!F.gap.includes('full'))return false;if(F.gap.includes('full')&&g&&!F.gap.includes('gap'))return false}
      if(q){const h=(c.cp+' '+c.num+' '+(c.inn||'')+' '+(c.mgr||'')+' '+fmtD(c.date)).toLowerCase();if(!q.split(/\s+/).every(w=>h.includes(w)))return false}
      return true});
    const dir=F.dir_;const key=F.sort;
    const val={y:c=>c.y,cp:c=>(c.cp||'').toLowerCase(),num:c=>nn(c.num),date:c=>c.date,mgr:c=>(c.mgr||'яяя').toLowerCase(),c1:c=>c.c1,sx:c=>c.sx,sb:c=>c.sb,gaps:c=>gapsOf(c).length}[key]||(c=>c.date);
    r.sort((a,b)=>{const x=val(a),y=val(b);return(x>y?1:x<y?-1:0)*dir});
    return r;
  }
  V.contracts.filtered=filtered;
  function paint(){
    const rows=filtered();const size=50;const tot=rows.length;if(F.page*size>=tot)F.page=0;const pg=rows.slice(F.page*size,F.page*size+size);
    const th=(k,l)=>`<th data-s="${k}" class="${F.sort===k?'sorted':''}">${l}${F.sort===k?(F.dir_>0?' ▲':' ▼'):''}</th>`;
    const gapN=rows.filter(c=>gapsOf(c).length).length;
    $('#cv-r',el).innerHTML=`<div class="tbar"><span><b>${num(tot)}</b> ${plural(tot,'договор','договора','договоров')}${gapN?` · <span class="bad-t">${num(gapN)} с пробелами</span>`:''}</span><span class="bulk">${F.sel.size&&!VIEW?`Выбрано ${F.sel.size}: <select id="bk"><option value="">Поставить отметку…</option>${Object.keys(WORK).map(k=>`<option value="${k}">${WORK[k][0]}</option>`).join('')}<option value="-">Снять отметку</option></select>`:''}</span></div>
    <div class="tscroll"><table class="tbl"><thead><tr><th class="cb"><input type="checkbox" id="ca" ${pg.length&&pg.every(c=>F.sel.has(c.key))?'checked':''}></th>${th('y','Год')}${th('cp','Контрагент')}${th('num','№ договора')}${th('date','Дата')}${th('mgr','Менеджер')}${th('c1','1С')}${th('sx','СХЭД')}${th('sb','СБИС')}<th>Архив</th><th>Отметка</th></tr></thead><tbody>${pg.map(c=>{const m=markOf(c);return `<tr data-k="${esc(c.key)}"><td class="cb"><input type="checkbox" data-sel="${esc(c.key)}" ${F.sel.has(c.key)?'checked':''}></td><td>${c.y??'—'}</td><td class="cpn"><b>${esc(c.cp)}</b>${c.k==='a'?`<small>${c.dir==='in'?'входящий':c.dir==='out'?'исходящий':''} · нет в описи</small>`:c.inn?`<small>ИНН ${esc(c.inn)}</small>`:''}</td><td class="mono">${esc(c.num||'—')}</td><td>${fmtD(c.date)}</td><td>${c.mgr?esc(mgrLabel(c)):'<span class="muted">—</span>'}</td><td>${c.k==='o'?pill(L1C,c.c1):'<span class="muted">—</span>'}</td><td>${c.k==='o'?pill(LSX,c.sx):'<span class="muted">—</span>'}</td><td>${c.k==='o'?pill(LSB,c.sb):'<span class="muted">—</span>'}</td><td>${c.docs&&c.docs.length?tag(c.docs.length+' в архиве','info'):'<span class="muted">—</span>'}</td><td>${m&&m.s?pill(WORK,m.s):''}${m&&m.c?`<span class="cmt" title="${esc(m.c)}">💬</span>`:''}</td></tr>`}).join('')||'<tr><td colspan="11" class="empty">Ничего не найдено. Измените фильтры.</td></tr>'}</tbody></table></div>${pagerHTML(tot,F.page,size)}`;
    const r=$('#cv-r',el);
    $$('th[data-s]',r).forEach(t=>t.onclick=()=>{const k=t.dataset.s;if(F.sort===k)F.dir_*=-1;else{F.sort=k;F.dir_=1}paint()});
    $$('tbody tr[data-k]',r).forEach(t=>t.onclick=e=>{if(e.target.closest('input'))return;openContract(t.dataset.k)});
    $$('[data-sel]',r).forEach(c=>c.onchange=()=>{if(c.checked)F.sel.add(c.dataset.sel);else F.sel.delete(c.dataset.sel);paint()});
    const ca=$('#ca',r);if(ca)ca.onchange=()=>{pg.forEach(c=>ca.checked?F.sel.add(c.key):F.sel.delete(c.key));paint()};
    const bk=$('#bk',r);if(bk)bk.onchange=()=>{const v=bk.value;if(!v)return;for(const k of F.sel){if(v==='-')delete ST.marks[k];else ST.marks[k]={...(ST.marks[k]||{}),s:v,ts:nowTs()}}logAct(`Отметка «${v==='-'?'снята':WORK[v][0]}» у ${F.sel.size} договоров`);F.sel.clear();touch();computeKpi();paint();toast('Отметки сохранены')};
    bindPager(r,p=>{F.page=p;paint();window.scrollTo({top:0,behavior:'smooth'})});
  }
  $('#cv-x',el).onclick=()=>{const rows=filtered();exportXLSX('Договоры_'+today()+'.xlsx',{'Договоры':[['Год','Контрагент','ИНН','№ договора','Дата','Менеджер','1С','СХЭД','СБИС','Документов в архиве','Что сделать','Отметка','Комментарий'],...rows.map(c=>{const m=markOf(c);return[c.y,c.cp,c.inn,c.num,fmtD(c.date),mgrLabel(c),c.k==='o'?L1C[c.c1]?.[0]:'',c.k==='o'?LSX[c.sx]?.[0]:'',c.k==='o'?LSB[c.sb]?.[0]:'',(c.docs||[]).length,todoText(c),m?.s?WORK[m.s][0]:'',m?.c||'']})]}).then(()=>toast('Файл сформирован'))};

/* ===== Отчёт по менеджерам и договорам (Excel для руководителей) ===== */
const MR_DEF=[['c1','Нет в 1С'],['sx','Нет в СХЭД'],['sb','Нет в СБИС'],['or','Нет бумажного оригинала']];
const MRO=()=>V.managers.RO=V.managers.RO||{c1:true,sx:true,sb:true,or:true,open:true};
function mrDefects(c,o){
  const g=gapsOf(c),d={};
  if(o.c1){const x=g.find(z=>z.s==='c1');if(x)d.c1=x.t}
  if(o.sx){const x=g.find(z=>z.s==='sx');if(x)d.sx=c.sx==='part'&&(c.sxmiss||[]).length?x.t+': '+c.sxmiss.join('; '):x.t}
  if(o.sb&&KPI.sbOn){const x=g.find(z=>z.s==='sb');if(x)d.sb=x.t}
  if(o.or){const cl=origClass(c),q=ST.orig[c.key];if(['scan','ours','theirs','none'].includes(cl)&&!(q&&(q.s==='got'||q.s==='na')))d.or=ORIG_L[cl][0]}
  return d;
}
function mrRows(o,only){
  const out=[];
  for(const c of CON){
    if(!inScope(c))continue;const m=mgrOf(c);if(only&&!only.includes(m))continue;
    const d=mrDefects(c,o);if(!Object.keys(d).length)continue;
    if(o.open&&isResolved(c))continue;
    const mk=markOf(c),q=ST.orig[c.key];
    out.push({c,m,d,age:issueAge(c)||0,mk,q});
  }
  return out.sort((a,b)=>b.age-a.age||a.c.y-b.c.y||a.c.cp.localeCompare(b.c.cp,'ru'));
}
const MR_H=['Год','Контрагент','ИНН','№ договора','Дата','Что не так','1С','СХЭД','СБИС','Оригинал','Файлы в архивах','Что сделать','Запрос оригинала','Отметка','Комментарий','Дней висит'];
function mrLine(r){
  const {c,d,mk,q}=r;
  const why=[d.c1&&'1С',d.sx&&'СХЭД',d.sb&&'СБИС',d.or&&'оригинал'].filter(Boolean).join(', ');
  return [c.y,c.cp,c.inn||'',c.num,fmtD(c.date),why,d.c1||'',d.sx||'',d.sb||'',d.or||'',(c.docs&&c.docs.length)?'Есть ('+c.docs.length+')':'Нет',todoText(c),q?.s?ORQ[q.s][0]+(q.s==='asked'&&q.d?' '+fmtD(q.d):''):'',mk?.s?WORK[mk.s][0]:'',mk?.c||'',r.age];

function mrSheetName(m,used){
  let n=(m.replace(/[\\\/\?\*\[\]:]/g,'').trim()||'—').slice(0,28),k=n,i=2;
  while(used.has(k.toLowerCase()))k=n.slice(0,26)+' '+(i++);

}
const mrMain=m=>m!=='Не указан'&&(KPI.byMgr[m]?.n||0)>=3;
async function mrReport(o,only){
  await loadXLSX();
  const rows=mrRows(o,only);if(!rows.length){toast('По выбранным условиям недостатков нет');return}
  const single=only&&only.length===1;
  const lim=slaLimit(),useAge=rows.some(r=>r.age>0),sel=MR_DEF.filter(([k])=>o[k]&&(k!=='sb'||KPI.sbOn)).map(x=>x[1]).join(', ');
  const main=managers().filter(m=>mrMain(m)&&rows.some(r=>r.m===m));
  const noMgr=rows.filter(r=>r.m==='Не указан'),odd=rows.filter(r=>r.m!=='Не указан'&&!mrMain(r.m));
  const grp=main.map(m=>[m,rows.filter(r=>r.m===m)]);
  if(single){if(!mrMain(only[0])&&only[0]!=='Не указан')grp.push([only[0],rows])}
  else{if(noMgr.length)grp.push(['Не указан менеджер',noMgr]);if(odd.length)grp.push(['Запись вместо менеджера',odd])}
  const sh=['Менеджер','Всего договоров','С недостатками'];
  const cols=[['c1','Нет в 1С',r=>r.d.c1],['sx','Нет в СХЭД',r=>r.d.sx],['sb','Нет в СБИС',r=>r.d.sb],['or','Нет оригинала',r=>r.d.or]].filter(([k])=>o[k]&&(k!=='sb'||KPI.sbOn));
  const sum=[[...sh,...cols.map(c=>c[1]),...(useAge?['Висят дольше '+lim+' дн.','Дольше всего, дн.']:[]),'Без недостатков, %']];
  const T=Array(cols.length+4).fill(0);
  for(const [m,R] of grp){
    const tot=m==='Не указан менеджер'?(KPI.byMgr['Не указан']?.n||R.length):m==='Запись вместо менеджера'?Object.keys(KPI.byMgr).filter(x=>x!=='Не указан'&&!mrMain(x)).reduce((a,x)=>a+KPI.byMgr[x].n,0):(KPI.byMgr[m]?.n||R.length);
    const v=[tot,R.length,...cols.map(([k])=>R.filter(r=>r.d[k]).length)];
    if(useAge)v.push(R.filter(r=>r.age>lim).length,Math.max(...R.map(r=>r.age)));
    v.forEach((x,i)=>{T[i]=(useAge&&i===v.length-1)?Math.max(T[i],x):T[i]+x});
    sum.push([m,...v,tot?Math.round((tot-R.length)/tot*100):100]);
  }
  const tv=T.slice(0,sum[0].length-2);
  sum.push(['ИТОГО',...tv,tv[0]?Math.round((tv[0]-tv[1])/tv[0]*100):100]);
  const head=[['Отчёт по менеджерам и договорам — ТЕХНОСТАЙЛ'],['На '+fmtD(today())+' · договоры с '+(ST.settings.from||2022)+' года · учтено: '+sel+(o.open?' · без закрытых и «не нужно»':'')],[]];
  const H=useAge?MR_H:MR_H.slice(0,-1);const line=r=>useAge?mrLine(r):mrLine(r).slice(0,-1);
  const wb=XLSX.utils.book_new();
  const add=(name,aoa,hdrRow,widths)=>{

    ws['!cols']=widths;
    ws['!autofilter']={ref:XLSX.utils.encode_range({s:{r:hdrRow,c:0},e:{r:aoa.length-1,c:aoa[hdrRow].length-1}})};
    XLSX.utils.book_append_sheet(wb,ws,name);
  };
  const W=[{wch:6},{wch:36},{wch:13},{wch:20},{wch:11},{wch:22},{wch:24},{wch:34},{wch:22},{wch:24},{wch:14},{wch:50},{wch:20},{wch:12},{wch:30},{wch:9}].slice(0,H.length);
  if(!single){
    add('Сводка',[...head,...sum],3,[{wch:28},...Array(sum[0].length-1).fill({wch:16})]);
    add('Все договоры',[...head,['Менеджер',...H],...rows.map(r=>[mgrLabel(r.c)||r.m,...line(r)])],3,[{wch:22},...W]);
  }
  const used=new Set(['сводка','все договоры']);
  for(const [m,R] of grp){
    const odd2=m==='Запись вместо менеджера';
    const hh=odd2?['В поле «Менеджер» указано',...H]:H,ww=odd2?[{wch:30},...W]:W;
    add(mrSheetName(m,used),[['Менеджер: '+m+' — договоров с недостатками: '+R.length],head[1],[],hh,...R.map(r=>odd2?[r.m,...line(r)]:line(r))],3,ww);
  }
  const nm=single?'Менеджер_'+only[0].replace(/[^\wА-яЁё]+/g,'_'):'По_менеджерам';
  XLSX.writeFile(wb,nm+'_'+today()+'.xlsx');
  logAct('Отчёт для руководителей: '+(single?only[0]:grp.length+' листов')+', договоров '+rows.length);
  toast('Файл сформирован: '+rows.length+' '+plural(rows.length,'договор','договора','договоров'));
}

/* ===== письмо руководителю ===== */
const plus7=()=>{const d=new Date(today()+'T00:00:00');d.setDate(d.getDate()+7);return fmtD(d.toISOString().slice(0,10))};
function mrLetter(o,only){
  const rows=mrRows(o,only);if(!rows.length){toast('По выбранным условиям недостатков нет');return}
  const lab=[['c1','нет в 1С'],['sx','нет в СХЭД'],['sb','нет в СБИС'],['or','нет оригинала']].filter(([k])=>o[k]&&(k!=='sb'||KPI.sbOn));
  const grp=m=>{const R=rows.filter(r=>r.m===m);return `${m} — ${R.length} (${lab.map(([k,l])=>{const n=R.filter(r=>r.d[k]).length;return n?l+' '+n:''}).filter(Boolean).join(', ')})`};
  let t;

    const m=only[0],R=rows.filter(r=>r.m===m);
    t=`Добрый день!\nПо состоянию на ${fmtD(today())} у сотрудника ${m} не сведено ${R.length} ${plural(R.length,'договор','договора','договоров')}:\n`+lab.map(([k,l])=>{const n=R.filter(r=>r.d[k]).length;return n?`• ${l} — ${n}`:''}).filter(Boolean).join('\n')+`\n\nСписок договоров — в приложенном файле. Просим связаться с сотрудником и передать документы / дать информацию до ${plus7()}.`;
  }else{
    const ms=managers().filter(m=>mrMain(m)&&rows.some(r=>r.m===m));
    const rest=rows.filter(r=>!mrMain(r.m)).length;
    t=`Добрый день!\nПо состоянию на ${fmtD(today())} по договорам с ${ST.settings.from||2022} года у сотрудников не сведено ${rows.length} ${plural(rows.length,'договор','договора','договоров')}:\n\n`+ms.map(m=>'• '+grp(m)).join('\n')+(rest?`\n• без менеджера или с нестандартной записью — ${rest}`:'')+`\n\nПодробный список по каждому сотруднику — в приложенном файле (отдельный лист на каждого). Просим связаться с сотрудниками и передать документы / дать информацию до ${plus7()}.`;
  }
  copyText(t,'текст письма руководителю');

/* ===== Контроль: Опись ↔ СХЭД — что загрузить первым и что есть в СХЭД, но нет в описи ===== */
function sxdFirstRows(){
  const out=[];
  for(const c of CON){
    if(c.k!=='o'||!inScope(c)||(c.sx!=='no'&&c.sx!=='arch'))continue;
    if(isResolved(c))continue;
    const f=contractFiles(c);const n=f.items.length;
    out.push({c,files:n,pri:n?(c.sx==='arch'?1:2):3});
  }
  return out.sort((a,b)=>a.pri-b.pri||(b.c.y||0)-(a.c.y||0)||a.c.cp.localeCompare(b.c.cp,'ru'));
}
function sxdExtraRows(){
  const matched=new Set();for(const c of CON)if(c.k==='o')for(const i of (c.msx||[]))matched.add(i);
  const from=ST.settings.from||2022;
  const byInn=new Map(),opis=CON.filter(c=>c.k==='o');
  for(const c of opis){if(c.inn){if(!byInn.has(c.inn))byInn.set(c.inn,[]);byInn.get(c.inn).push(c)}}
  const out=[];
  SXREC.forEach((x,i)=>{
    if(matched.has(i))return;if(x.type&&!/^договор/i.test(x.type))return;
    const y=x.y!=null&&x.y!==''?+x.y:(x.date?+String(x.date).slice(0,4):null);if(y!=null&&y<from)return;
    const sameCp=c=>(x.inn&&c.inn&&x.inn===c.inn)||tokmatch(x.tk||toks(x.cp),tkOf(c))||cpmatchK(x.ck||cpk(x.cp),ckOf(c));
    const near=opis.filter(sameCp);
    out.push({x,i,y,near});
  });
  return out.sort((a,b)=>(b.y||0)-(a.y||0)||a.x.cp.localeCompare(b.x.cp,'ru'));
}

/* разбор имени файла */
function parseAttName(fn){
  const base=fn.replace(/\.[a-z0-9]+$/i,'');
  const kind=/дополнительн\w*\s+соглашен|^дс\b/i.test(base)?'Допсоглашение':/специфик/i.test(base)?'Спецификация':/бланк.?заказ/i.test(base)?'Бланк-заказ':/заявк/i.test(base)?'Заявка':/приложен/i.test(base)?'Приложение':/заказ/i.test(base)?'Заказ':'Приложение';
  const head=base.split(/\s+к\s+договор/i)[0];
  const an=(head.match(/№\s*([^\s,;()]+)/)||[])[1]||'';
  const dt=(base.match(/от\s*(\d{1,2}\.\d{2}\.\d{4})/)||base.match(/(\d{2}\.\d{2}\.\d{4})/)||[])[1]||'';
  const cn=(base.match(/к\s+договор\w*\s*№\s*(.+?)(?:\s+[—–-]\s+|\s*\(вх|\s*\[|$)/i)||[])[1]||'';
  let cp=(base.match(/\s[—–]\s([^[(—–]+?)\s*(?:\(вх\.?\)|\(исх\.?\)|\[|$)/)||[])[1]||'';
  return{kind,anum:an,date:dt?fmtDisp2iso(dt):'',cnum:cn.trim(),ccp:cp.trim(),title:head.trim()||base,file:fn};
}
const fmtDisp2iso=d=>{const m=d.match(/(\d{1,2})\.(\d{2})\.(\d{4})/);return m?m[3]+'-'+m[2]+'-'+pad(+m[1]):''};

/* сохранённая страница СХЭД (ds.nordfox.ru/tree): список «Все документы» внизу */
async function importSxedHtml(file){
  try{
    toast('Читаю страницу…','info',1500);
    const html=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsText(file,'utf-8')});
    const doc=new DOMParser().parseFromString(html,'text/html');
    const innBy=new Map();
    doc.querySelectorAll('span').forEach(sp=>{const t=sp.textContent||'';if(t.startsWith('📁')){const cp=t.replace('📁','').trim();const n=sp.nextElementSibling;const m=n&&/ИНН\s*(\d{10,12})/.exec(n.textContent||'');if(m)innBy.set(cp,m[1])}});
    const lis=[...doc.querySelectorAll('li')].filter(li=>li.querySelector('a[href*="/documents/"]'));
    const cnt=/Показано:\s*(\d+)\s*из\s*(\d+)/.exec(doc.body.textContent||'');
    const out=[];
    for(const li of lis){
      const ds=li.querySelectorAll('a[href*="/documents/"] div');
      const title=(li.querySelector('.font-medium')||{}).textContent?.trim()||'';
      const cp=(li.querySelector('.text-xs.text-gray-500.truncate')||{}).textContent?.trim()||'';
      if(!title)continue;
      const attrs={};li.querySelectorAll('span > span.text-gray-400').forEach(s=>{const k=s.textContent.replace(/:\s*$/,'').trim().toLowerCase();attrs[k]=(s.parentElement.textContent||'').replace(s.textContent,'').trim()});
      const rest=(cp&&title.startsWith(cp)?title.slice(cp.length):title).trim();
      const m=/^Договор\s+(ИСХ|ВХ)\s*(?:№\s*)?(.*?)\s*от\s+(\d{4}-\d\d-\d\d)\s*$/i.exec(rest)||/^(.*?)\s+(ИСХ|ВХ)\s*(?:№\s*)?(.*?)\s*от\s+(\d{4}-\d\d-\d\d)\s*$/i.exec(rest);
      let num='',date=null,dir='';
      if(m){const g=m.length===4?[m[1],m[2],m[3]]:[m[2],m[3],m[4]];dir=g[0];num=g[1].trim();date=g[2]}
      const state=(li.querySelector('span.rounded.text-xs')||{}).textContent?.trim()||'';
      const a=li.querySelector('a[href*="/documents/"]');
      out.push({i:out.length,num,name:title,cp,state,date,generic:num?0:1,inn:innBy.get(cp)||'',type:'Договор',y:date?+date.slice(0,4):null,ctype:attrs['тип договора']||'',subj:attrs['предмет договора (кратко)']||'',dir:attrs['направление']||(dir==='ВХ'?'входящий':dir==='ИСХ'?'исходящий':''),role:attrs['роль общества']||'',warn:/Требует внимания/.test(li.innerHTML)?1:0,link:a?a.href:''});
    }
    if(!out.length)throw new Error('В файле не нашла список договоров. Сохраните страницу «Дерево» ds.nordfox.ru целиком (Ctrl+S → «Веб-страница, полностью»).');
    openModal(`<h3>СХЭД: список договоров со страницы</h3><p>Найдено договоров: <b>${num(out.length)}</b>${cnt?` (на странице всего документов: ${cnt[2]}, остальные — не договоры)`:''}. С ИНН: ${num(out.filter(x=>x.inn).length)}. Входящих ${num(out.filter(x=>x.dir==='входящий').length)}, исходящих ${num(out.filter(x=>x.dir==='исходящий').length)}.</p>
    <div class="row end"><button class="btn" id="sh-c">Отмена</button><button class="btn pri" id="sh-ok">Загрузить</button></div>`,m=>{
      m.querySelector('#sh-c').onclick=closeModal;
      m.querySelector('#sh-ok').onclick=()=>{const before={...KPI};ST.uploads.sxed={ts:nowTs(),name:file.name,n:out.length,rows:out};ST.uploads={...ST.uploads};logAct(`Загружено: СХЭД — ${out.length} договоров со страницы (${file.name})`);touch();buildAll();closeModal();toast(`Загружено ${num(out.length)} договоров. Сверка пересчитана.`,'ok',5000);uploadSummary('sxed',before)};
    });
  }catch(e){console.error(e);toast(e.message||'Не удалось прочитать страницу','bad',8000)}
}

/* универсальный список: поиск, фильтры, сортировка, страницы, Excel */
function listView(host,cfg){
  const S=LVS[cfg.id]=LVS[cfg.id]||{q:'',f:{},sort:cfg.sort||null,dir:cfg.dir||1,page:0};
  const sel=cfg.filters||[];
  host.innerHTML=`<div class="lvbar"><div class="fsearch lvq">${ic('search',16)}<input class="lvs" placeholder="${esc(cfg.ph||'Поиск по контрагенту, номеру…')}" value="${esc(S.q)}"></div>${sel.map(f=>`<select class="inp lvf" data-k="${f.k}"><option value="">${esc(f.l)}: все</option>${f.opts.map(([v,l])=>`<option value="${esc(v)}" ${String(S.f[f.k]??'')===String(v)?'selected':''}>${esc(l)}</option>`).join('')}</select>`).join('')}${cfg.noExport?'':`<button class="btn lvx">${ic('dl',15)} Excel</button>`}${cfg.bar||''}</div><div class="lvinfo muted sm"></div><div class="tscroll lvt"></div><div class="lvp"></div>`;
  const rows=()=>{
    const q=S.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
    let r=cfg.rows().filter(x=>{
      for(const f of sel){const v=S.f[f.k];if(v!==undefined&&v!==''&&!f.f(x,v))return false}
      if(q.length){const h=cfg.search(x).toLowerCase();if(!q.every(w=>h.includes(w)))return false}
      return true});
    if(S.sort){const c=cfg.cols.find(c=>c.k===S.sort);if(c&&c.v){r=r.map(x=>[c.v(x),x]).sort((a,b)=>{let p=a[0],q=b[0];if(p==null||p==='')p=S.dir>0?'￿':'';if(q==null||q==='')q=S.dir>0?'￿':'';return(p>q?1:p<q?-1:0)*S.dir}).map(x=>x[1])}}
    return r;
  };
  const paint=()=>{
    const all=rows();const size=cfg.size||50;if(S.page*size>=all.length)S.page=0;const pg=all.slice(S.page*size,S.page*size+size);
    $('.lvinfo',host).innerHTML=cfg.info?cfg.info(all):`<b>${num(all.length)}</b> ${plural(all.length,'запись','записи','записей')}`;
    $('.lvt',host).innerHTML=`<table class="tbl"><thead><tr>${cfg.cols.map(c=>`<th ${c.v?`data-s="${c.k}"`:''} class="${S.sort===c.k?'sorted':''} ${c.cls||''}">${c.l}${S.sort===c.k?(S.dir>0?' ▲':' ▼'):''}</th>`).join('')}</tr></thead><tbody>${pg.map((r,i)=>`<tr data-i="${i}" class="${cfg.rowCls?cfg.rowCls(r):''}">${cfg.cols.map(c=>`<td class="${c.cls||''}">${c.h(r)}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${cfg.cols.length}" class="empty">${cfg.empty||'Ничего не найдено.'}</td></tr>`}</tbody></table>`;
    $('.lvp',host).innerHTML=pagerHTML(all.length,S.page,size);bindPager($('.lvp',host),p=>{S.page=p;paint()});
    $$('th[data-s]',host).forEach(t=>t.onclick=()=>{const k=t.dataset.s;if(S.sort===k)S.dir*=-1;else{S.sort=k;S.dir=1}paint()});
    $$('tbody tr[data-i]',host).forEach(t=>t.onclick=e=>{if(e.target.closest('input,select,button,a,[data-opd]'))return;if(cfg.onRow)cfg.onRow(pg[+t.dataset.i],t)});
    if(cfg.after)cfg.after(host,pg,paint);
    host._rows=all;
  };
  $('.lvs',host).oninput=debounce(e=>{S.q=e.target.value;S.page=0;paint()},200);
  $$('.lvf',host).forEach(s=>s.onchange=()=>{S.f[s.dataset.k]=s.value;S.page=0;paint()});
  const x=$('.lvx',host);if(x)x.onclick=()=>{const all=rows();exportXLSX((cfg.file||'Список')+'_'+today()+'.xlsx',{[cfg.sheet||'Список']:[cfg.cols.filter(c=>!c.noX).map(c=>stripHtml(c.l)),...all.map(r=>cfg.cols.filter(c=>!c.noX).map(c=>c.x?c.x(r):stripHtml(c.h(r))))]}).then(()=>toast('Файл сформирован'))};
  paint();return{paint,rows};
}
const cpCell=c=>`<b>${esc(c.cp)}</b>${c.inn?`<small>ИНН ${esc(c.inn)}</small>`:''}`;
const mgrFilter=rows=>({k:'mgr',l:'Менеджер',opts:[...new Set(rows().map(r=>(r.c||r).mgr||''))].sort((a,b)=>a.localeCompare(b,'ru')).map(m=>[m||'__none',m||'Не указан']),f:(r,v)=>((r.c||r).mgr||'')===(v==='__none'?'':v)});
const CTABS=[['orig','Бумажные оригиналы'],['edo','ЭДО или бумага'],['dups','Дубли'],['attr','Атрибуты СХЭД'],['sla','Срок вопросов'],['ver','Версии описи']];
const CINFO={sxd:['Опись ↔ СХЭД','Что из описи ещё не загружено в СХЭД (и что уже лежит в архивах) и что есть в СХЭД, но нет в описи.'],orig:['Бумажные оригиналы','Договоры, по которым у нас нет подписанного бумажного оригинала.'],edo:['ЭДО или бумага','Вид подписи в описи должен совпадать с оригиналом и с тем, что есть в СБИС.'],dups:['Дубли','Один документ загружен дважды, копии «(2)», дубли в списке СХЭД.'],attr:['Атрибуты СХЭД','Где контрагент, номер или дата, распознанные в СХЭД, не совпали с описью.'],sla:['Срок вопросов','Сколько дней договор висит без сведения и кто тянет дольше всех.'],ver:['Версии описи','Что добавилось, исчезло и изменилось при загрузке новой описи.']};

const dateOrDash=d=>d?fmtD(d):'<span class="muted">—</span>';

  ${tileRow([['Только скан',by.scan||0,'нужно получить оригинал',by.scan?'warn':'ok'],['Не подписан нами',by.ours||0,'подписать и вернуть',by.ours?'bad':'ok'],['Не подписан контрагентом',by.theirs||0,'ждём от контрагента',by.theirs?'bad':'ok'],['Оригинала нет',by.none||0,'',by.none?'bad':'ok'],['Запросили',asked.length,over.length?`из них ${over.length} дольше ${days} дн.`:'просрочек нет',over.length?'bad':'info']])}

    filters:[{k:'cls',l:'Что не так',opts:Object.keys(ORIG_L).filter(k=>k!=='ok').map(k=>[k,ORIG_L[k][0]]),f:(r,v)=>r.cls===v},mgrFilter(rowsFn),{k:'q',l:'Запрос',opts:[['none','Не запрашивали'],['asked','Запросили'],['over','Просрочен'],['got','Получен']],f:(r,v)=>{const s=r.q?.s||'none';return v==='over'?(s==='asked'&&daysFrom(r.q.d)>days):s===v}}],
    cols:[{k:'y',l:'Год',h:r=>r.c.y??'—',v:r=>r.c.y},{k:'cp',l:'Контрагент',h:r=>`<span class="cpn">${cpCell(r.c)}</span>`,v:r=>r.c.cp.toLowerCase(),x:r=>r.c.cp},{k:'num',l:'№ договора',h:r=>`<span class="mono">${esc(r.c.num||'—')}</span>`,v:r=>nn(r.c.num),x:r=>r.c.num},{k:'date',l:'Дата',h:r=>fmtD(r.c.date),v:r=>r.c.date,x:r=>fmtD(r.c.date)},{k:'mgr',l:'Менеджер',h:r=>esc(r.c.mgr||'—'),v:r=>r.c.mgr||'яя',x:r=>r.c.mgr},
      {k:'cls',l:'В описи',h:r=>`${pill(ORIG_L,r.cls)}${r.c.orig?`<small>«${esc(r.c.orig)}»</small>`:''}`,v:r=>r.cls,x:r=>ORIG_L[r.cls][0]+(r.c.orig?' («'+r.c.orig+'»)':'')},

/* ===== Готовые пакеты файлов для загрузки в СХЭД ===== */
const safeName=s=>String(s||'').replace(/[\\\/:*?"<>|]+/g,'_').replace(/\s+/g,' ').trim().replace(/[. ]+$/,'').slice(0,120);
const COPYRX=/\s\(\d+\)(\.[a-z0-9]+)$/i;
/* папки с договорами в архивах: в одной папке лежат договор и все его приложения (спецификации, допсоглашения, протоколы) */
let _fi=null;
const dirOf=p=>String(p).replace(/\/[^\/]*$/,'');
function folderIndex(){
  if(_fi)return _fi;
  const byDir=new Map();
  DOCS.forEach((d,i)=>{const p=String(d[9]||'');if(!/Договоры и документы к ним/.test(p))return;const k=dirOf(p);let a=byDir.get(k);if(!a)byDir.set(k,a=[]);a.push(i)});
  const list=[];
  for(const [dir,ids] of byDir){
    const base=dir.split('/').pop();const m=base.match(/^(.*?)\s+[—–-]\s+№\s*(.*?)(?:\s+от\s+(\d\d\.\d\d\.\d{4}))?(?:\s*\(.*\))?$/);
    if(!m)continue;list.push({dir,ids,cp:m[1],num:nn(m[2]),ck:cpk(m[1]),tk:toks(m[1])});
  }
  return _fi={byDir,list};
}
function folderDirs(c){
  const F=folderIndex();const dirs=new Set((c.docs||[]).map(i=>dirOf(DOCS[i][9])));
  const n=nn(c.num);
  if(n)for(const f of F.list){if(f.num!==n)continue;if(tokmatch(tkOf(c),f.tk)||cpmatchK(ckOf(c),f.ck))dirs.add(f.dir)}
  return [...dirs].filter(d=>F.byDir.has(d));
}
/* файлы одного договора: основные документы из архивов + приложения к входящим */
function contractFiles(c,opt={}){
  const items=[];const seen=new Set();
  let idx=(c.docs||[]).slice();
  if(c.k==='o'&&c.sx==='part'&&!opt.all)idx=idx.filter(i=>!String(DOCS[i][1]).startsWith('Договор')); // в СХЭД договор уже есть — нужны только приложения
  const paths=new Set(idx.map(i=>DOCS[i][9]));
  const folder=(c.y??'без года')+'/'+safeName(`${c.cp} — № ${c.num||'без номера'}${c.date?' от '+fmtD(c.date):''}`);
  for(const i of idx){
    const d=DOCS[i];if(seen.has(i))continue;seen.add(i);
    if(opt.skipCopies!==false&&COPYRX.test(d[9])&&paths.has(d[9].replace(COPYRX,'$1')))continue;
    items.push({path:folder+'/'+safeName(d[9].split('/').pop()),rel:d[9],src:d[11],alts:[d[10]],kind:d[1]});
  }
  // приложения, лежащие в архиве рядом с договором (спецификации, допсоглашения, протоколы и др.)
  try{
    const have=new Set(items.map(x=>x.rel));
    for(const dir of folderDirs(c)){
      const ids=folderIndex().byDir.get(dir);const ps=new Set(ids.map(i=>DOCS[i][9]));
      for(const i of ids){
        const d=DOCS[i];if(seen.has(i)||have.has(d[9]))continue;
        if(String(d[1]).startsWith('Договор')&&String(d[1])!=='Договор (не поставка)'&&!(c.docs||[]).includes(i))continue; // чужой договор в той же папке
        if(String(d[1]).startsWith('Договор'))continue;
        if(opt.skipCopies!==false&&COPYRX.test(d[9])&&ps.has(d[9].replace(COPYRX,'$1')))continue;
        seen.add(i);have.add(d[9]);
        items.push({path:folder+'/'+safeName(d[9].split('/').pop()),rel:d[9],src:d[11],alts:[d[10]],kind:d[1]});
      }
    }
  }catch(e){console.error(e)}
  // приложения к входящим договорам этого контрагента и номера
  try{
    for(const g of allAtt()){
      if(nn(g.num)!==nn(c.num)||!cpmatchK(cpk(g.cp),cpk(c.cp)))continue;
      if(g.sver&&g.sver!=='Нет в СХЭД')continue;
      for(const a of g.atts){if(!a.part||!a.path||items.some(x=>x.rel===a.path))continue;items.push({path:folder+'/'+safeName(a.path.split('/').pop()),rel:a.path,src:'Приложения_к_входящим_договорам_часть'+a.part,alts:[a.file].filter(Boolean),kind:'Приложение'})}
    }
  }catch(e){}
  return{folder,items};
}
function packSet(O){
  const out=[];
  for(const c of CON){
    if(O.mode==='open'){
      if(c.k!=='o'||!isOpen(c))continue;
      if(O.mgr&&mgrOf(c)!==O.mgr)continue;
    }else{
      if(c.k==='o'){if(!inScope(c)||(c.sx!=='arch'&&c.sx!=='part'&&!(O.no&&c.sx==='no')))continue}
      else{if(!O.extra||!(c.docs&&c.docs.length))continue}
    }
    const f=contractFiles(c,{...O,all:O.mode==='open'});

function loadScript(src){return new Promise((res,rej)=>{if([...document.scripts].some(s=>s.src===src))return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Не удалось загрузить модуль PDF (нужен интернет)'));document.head.appendChild(s)})}
async function nodeToPdf(node,fileName){
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  const canvas=await html2canvas(node,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false});
  const{jsPDF}=window.jspdf;const pdf=new jsPDF({unit:'pt',format:'a4'});
  const pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight(),m=20;const iw=pw-2*m,ih=ph-2*m;
  let ratio=iw/canvas.width;
  if(canvas.height*ratio<=ih*1.25)ratio=Math.min(ratio,ih/canvas.height); // чуть длиннее листа — вписываем на одну страницу
  const pageH=Math.floor(ih/ratio);
  for(let y=0,p=0;y<canvas.height;y+=pageH,p++){
    const h=Math.min(pageH,canvas.height-y);const sl=document.createElement('canvas');sl.width=canvas.width;sl.height=h;sl.getContext('2d').drawImage(canvas,0,y,canvas.width,h,0,0,canvas.width,h);
    if(p)pdf.addPage();pdf.addImage(sl.toDataURL('image/jpeg',0.93),'JPEG',m+(iw-canvas.width*ratio)/2,m,canvas.width*ratio,h*ratio);
  }
  pdf.save(fileName);
}

function trImport(done){
  openModal(`<h3>Импорт трекера из Excel</h3><p class="muted sm">Загрузите ваш файл — колонки станут колонками трекера, строки — задачами. Колонки, где повторяются несколько значений (Статус, Приоритет…), автоматически станут списками.</p><div id="ti-b"></div><label class="sw"><input type="checkbox" id="ti-rep"><span>заменить текущие задачи (иначе — добавить к ним)</span></label>`,m=>{
    m.querySelector('#ti-b').appendChild(dropzone('Excel или CSV с трекером','.xlsx,.xls,.csv',async f=>{
      try{const t=await readTable(f);let name=t.wb.SheetNames[0];if(t.wb.SheetNames.length>1)name=await new Promise(res=>{m.querySelector('#ti-b').innerHTML=`<p>Выберите лист:</p><div class="col">${t.wb.SheetNames.map(n=>`<button class="btn" data-n="${esc(n)}">${esc(n)}</button>`).join('')}</div>`;m.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>res(b.dataset.n))});
        const rows=sheetRows(t.wb,name);let h=0,best=0;for(let i=0;i<Math.min(10,rows.length);i++){const n=(rows[i]||[]).filter(x=>x!=null&&String(x).trim()).length;if(n>best){best=n;h=i}}
        const H=rows[h].map((x,j)=>String(x??'').trim()||('Колонка '+(j+1)));const data=rows.slice(h+1).filter(r=>r&&r.some(x=>x!=null&&String(x).trim()));
        const cols=H.map((n,j)=>{const vals=data.map(r=>r[j]).filter(v=>v!=null&&String(v).trim()!=='');const uniq=[...new Set(vals.map(String))];const isDate=vals.length&&vals.filter(v=>v instanceof Date||(typeof v==='number'&&v>30000&&v<60000)||/^\d{2}\.\d{2}\.\d{4}$/.test(String(v))).length/vals.length>.7;const long=vals.some(v=>String(v).length>60);const named=/статус|приоритет|состоян|тип\b|этап|категор/i.test(n);const sel=!isDate&&uniq.length>0&&uniq.every(u=>u.length<=30)&&((uniq.length<=10&&vals.length>=4)||(named&&uniq.length<=15));return{id:'c'+j+'_'+uid(),n,t:isDate?'date':sel?'select':long?'long':'text',opts:sel?uniq:undefined,w:long?300:150}});
        const keep=cols.map((c,j)=>data.some(r=>r[j]!=null&&String(r[j]).trim()));
        const C=cols.filter((c,j)=>keep[j]);const J=cols.map((c,j)=>j).filter(j=>keep[j]);
        const replace=m.querySelector('#ti-rep').checked;
        if(replace||!ST.tracker.order.length||await confirmBox('Колонки будут заменены колонками из вашего файла, текущие задачи сохранятся и добавятся в конец. Продолжить?','Продолжить')){
          if(replace){for(const id of ST.tracker.order){ST.tracker.rows[id]={...ST.tracker.rows[id],del:1,ts:nowTs()}}ST.tracker.order=[]}
          ST.tracker.cols=C;ST.tracker.ts=nowTs();
          const ids=[];data.forEach(r=>{const id='t'+uid();const o={id,ts:nowTs()};C.forEach((c,k)=>{let v=r[J[k]];if(v instanceof Date)v=parseDate(v);else if(c.t==='date')v=parseDate(v)||String(v??'');o[c.id]=v==null?'':String(v)});ST.tracker.rows[id]=o;ids.push(id)});
          ST.tracker.order=[...ids,...ST.tracker.order];ST.tracker.ord_ts=nowTs();logAct(`Импортирован трекер: ${data.length} задач`);touch();closeModal();toast(`Импортировано задач: ${data.length}`);done();
        }
      }catch(e){console.error(e);toast(e.message||'Не удалось прочитать файл','bad',6000)}
    }));
  });
}

function daysTo(iso){return Math.round((new Date(iso+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5)}

 {id:'report',t:'Ежемесячный отчёт для главбуха (PDF)',d:'Одна страница: что сведено, что осталось, динамика за месяц, топ менеджеров с открытыми вопросами. Кнопка «Отчёт для главбуха (PDF)» — на обзоре.'},

V.ideas=function(el){

  el.innerHTML=`<div class="pghead"><div><h1>Идеи и предложения</h1><p class="muted">Что ещё можно добавить в приложение. Нажмите «В трекер», чтобы идея попала в ваш список доработок, или скройте то, что не нужно.</p></div></div>
  <div class="ideas">${[...IDEAS.filter(i=>IMPL[i.id]),...IDEAS.filter(i=>!IMPL[i.id])].filter(i=>st(i.id)!=='no'||IMPL[i.id]).map(i=>{const s=i.stat?i.stat():'';const im=IMPL[i.id];return `<div class="card idea ${im?'impl':st(i.id)==='added'?'added':''}"><div class="ih"><h3>${i.t}</h3>${im?tag('сделано','ok'):st(i.id)==='added'?tag('в трекере','ok'):''}</div><p>${i.d}</p>${s?`<p class="istat">${esc(s)}</p>`:''}<div class="row">${im?`<button class="btn pri" data-go="${im}">Открыть</button>`:`<button class="btn ${st(i.id)==='added'?'':'pri'}" data-add="${i.id}" ${st(i.id)==='added'?'disabled':''}>${st(i.id)==='added'?'Добавлено':'В трекер'}</button><button class="btn" data-no="${i.id}">Скрыть</button>`}</div></div>`}).join('')}</div>
  ${IDEAS.some(i=>!IMPL[i.id]&&st(i.id)==='no')?`<p class="muted sm"><a id="id-show">Показать скрытые (${IDEAS.filter(i=>!IMPL[i.id]&&st(i.id)==='no').length})</a></p>`:''}
  <div class="card"><h3>Нужна другая функция?</h3><p class="muted">Добавьте её в «Трекер доработок» — я смогу посмотреть список и взять в работу. Любые свои идеи записывайте туда же.</p><button class="btn" data-go="#tracker">Открыть трекер</button></div>`;
  $$('[data-add]',el).forEach(b=>b.onclick=()=>{const i=IDEAS.find(x=>x.id===b.dataset.add);const cols=trCols();const id='t'+uid();const o={id,ts:nowTs()};
    const tc=cols.find(c=>c.id==='title')||cols.find(c=>c.t==='text'||c.t==='long');const dc=cols.find(c=>c.id==='desc')||cols.filter(c=>c.t==='long')[0];const sc=cols.find(c=>c.id==='status')||cols.find(c=>/статус/i.test(c.n));
    if(tc)o[tc.id]=i.t;if(dc&&dc!==tc)o[dc.id]=i.d;if(sc)o[sc.id]=(sc.opts||[]).includes('Идея')?'Идея':(sc.opts||[])[0]||'';
    ST.tracker.rows[id]=o;ST.tracker.order.unshift(id);ST.tracker.ord_ts=nowTs();ST.ideas[i.id]={s:'added',ts:nowTs()};logAct('Идея добавлена в трекер: '+i.t);touch();toast('Добавлено в трекер');V.ideas(el)});
  $$('[data-no]',el).forEach(b=>b.onclick=()=>{ST.ideas[b.dataset.no]={s:'no',ts:nowTs()};touch();V.ideas(el)});
  const sh=$('#id-show',el);if(sh)sh.onclick=()=>{IDEAS.forEach(i=>{if(st(i.id)==='no')ST.ideas[i.id]={s:'new',ts:nowTs()}});touch();V.ideas(el)};
};

/* отметить выполненные идеи в трекере (один раз) */
function migrateIdeas(){
  if(VIEW)return;
  try{
    const cols=trCols();const stc=cols.find(c=>c.id==='status')||cols.find(c=>/статус|состоян/i.test(c.n));if(!stc)return;
    const done=(stc.opts||[]).find(o=>/готов|выполн|сделан|закрыт/i.test(o))||'Готово';
    let ch=0,fl=0;
    for(const i of IDEAS){
      if(!IMPL[i.id]||ST.ideas[i.id]?.impl)continue;
      for(const r of trRows()){
        if(String(bf(r,'title')||'').trim().toLowerCase()!==i.t.toLowerCase())continue;
        ST.tracker.rows[r.id]={...r,[stc.id]:done,ts:nowTs()};ch++;
      }
      ST.ideas[i.id]={...(ST.ideas[i.id]||{}),s:ST.ideas[i.id]?.s||'added',impl:today(),ts:nowTs()};fl=1;
    }
    if(ch){logAct(`Идеи реализованы, в трекере отмечено «${done}»: ${ch}`);}
    if(ch||fl)touch();
  }catch(e){console.error(e)}
}

let DATABIN=null;
async function loadBin(){
  try{const r=await fetch(PKG?'access/'+PKG+'.bin':'data.bin',{cache:'no-cache'});if(!r.ok)throw 0;return new Uint8Array(await r.arrayBuffer())}catch(e){return null}
}
function loginScreen(msg){
  const app=document.getElementById('app');
  app.innerHTML=`<div class="login"><div class="lcard"><div class="logo big">${ic('folder',34)}</div><h1>СХЭД · Учёт</h1><p class="muted">${PKG?'Доступ только для просмотра':'Рабочее место администратора цифрового хранилища'}</p>
  ${DATABIN?`<form id="lf"><label>Пароль<input id="lp" type="password" class="inp" placeholder="Введите пароль" autofocus autocomplete="current-password"></label><label class="sw"><input type="checkbox" id="lr" checked><span>запомнить на этом устройстве</span></label><button class="btn pri wide" id="lb">${ic('lock',16)} Открыть</button><p class="err" id="le">${esc(msg||'')}</p></form>`:`<div class="callout warn"><b>Файл данных не найден</b><p>Рядом с приложением должен лежать файл <b>data.bin</b>. Если вы открыли приложение прямо с компьютера, выберите файл вручную.</p></div><label class="btn pri wide">Выбрать data.bin<input type="file" id="lfile" hidden></label>`}
  <p class="muted sm c">Данные зашифрованы: без пароля их не прочитать, даже если страница лежит в открытом доступе.</p></div></div>`;
  const f=$('#lf');
  if(f)f.onsubmit=async e=>{e.preventDefault();$('#lb').disabled=true;$('#le').textContent='';try{await unlock($('#lp').value,$('#lr').checked)}catch(err){$('#le').textContent=err.message||'Неверный пароль';$('#lb').disabled=false}};
  const fi=$('#lfile');if(fi)fi.onchange=async()=>{DATABIN=new Uint8Array(await fi.files[0].arrayBuffer());loginScreen()};
}
async function unlock(pass,remember){
  const{iter,salt}=parseHead(DATABIN);
  const key=await deriveKey(pass,salt,iter);
  let data;try{data=await decryptBlob(DATABIN,key)}catch(e){throw new Error('Неверный пароль')}
  if(remember){const raw=new Uint8Array(await crypto.subtle.exportKey('raw',key));LS.set(KEYN,{salt:b64(salt),key:b64(raw)})}
  await start(data,key,salt,iter);
}
async function tryRemembered(){
  const r=LS.get(KEYN,null);if(!r||!DATABIN)return false;
  try{const{iter,salt}=parseHead(DATABIN);if(b64(salt)!==r.salt)return false;
    const key=await crypto.subtle.importKey('raw',unb64(r.key),'AES-GCM',true,['encrypt','decrypt']);
    const data=await decryptBlob(DATABIN,key);await start(data,key,salt,iter);return true}catch(e){LS.del(KEYN);return false}
}
async function start(data,key,salt,iter){
  DATA=data;KEY=key;SALT=salt;ITER=iter;
  if(data.view){ // режим просмотра: без сохранения и синхронизации
    VIEW=data.view;ST=blankState();ST.marks=data.marks||{};ST.orig=data.orig||{};ST.seen=data.seen||{};ST.settings={...ST.settings,...(data.settings||{})};
    buildAll();shell();applyTheme();ARC.init();route();return;
  }
  const saved=await IDB.get('state');ST={...blankState(),...(saved||{})};ST.settings={...blankState().settings,...ST.settings};
  buildAll();migrateIdeas();shell();applyTheme();ARC.init();route();
  if(SYNC.cfg())SYNC.sync(false).then(()=>{buildAll();onStateMerged()});
  window.addEventListener('focus',()=>{if(SYNC.cfg()&&nowTs()-SYNC.lastOk>60000)SYNC.sync(false)});
}
async function boot(){
  applyTheme();
  try{await IDB.open()}catch(e){console.warn('IndexedDB недоступен',e)}
  document.getElementById('app').innerHTML='<div class="login"><div class="lcard"><div class="spin"></div><p class="muted">Загрузка…</p></div></div>';
  DATABIN=await loadBin();
  if(await tryRemembered())return;
  loginScreen();
}
window.addEventListener('DOMContentLoaded',boot);

</script></body></html>
