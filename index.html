<script>
'use strict';
const V={};let VIEWEL=null;let VIEW=null; // VIEW: режим «только просмотр» (доступ для менеджера/главбуха)
/* ===== утилиты ===== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtD=i=>i?(String(i).split('-').reverse().join('.')):'';
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const nowTs=()=>Date.now();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const HM={A:'А',B:'В',C:'С',E:'Е',H:'Н',K:'К',M:'М',O:'О',P:'Р',T:'Т',X:'Х',Y:'У'};
const nn=s=>String(s??'').toUpperCase().replace(/[ABCEHKMOPTXY]/g,c=>HM[c]).replace(/[^0-9A-ZА-ЯЁ]/g,'').replace(/Ё/g,'Е');
const LEGRX=/(^|[^0-9A-ZА-ЯЁ])(ООО|АО|ПАО|ЗАО|ИП|ГК|СК|СЗ|ЛТД|ХП|ФИЛИАЛ)(?![0-9A-ZА-ЯЁ])/g;
const cpk=s=>nn(String(s??'').toUpperCase().replace(/Ё/g,'Е').replace(LEGRX,'$1').replace(/[«»"']/g,''));
const LEG=new Set(['ООО','АО','ПАО','ЗАО','ИП','ГК','СК','СЗ','ТСН','ТСЖ','ПКФ','МК','ПК','ХК','ТД','ФИЛИАЛ','ЛТД','ХП','НПО','НПП','ОП','ПКО']);
const toks=s=>{s=String(s??'').toUpperCase().replace(/Ё/g,'Е').replace(/\((.*?)\)/g,' $1 ').replace(/[ABCEHKMOPTXY]/g,c=>HM[c]);return new Set((s.match(/[0-9A-ZА-Я]+/g)||[]).filter(w=>!LEG.has(w)&&!/^\d{8,}$/.test(w)))};
const subset=(a,b)=>{for(const x of a)if(!b.has(x))return false;return true};
const tokmatch=(a,b)=>{if(!a.size||!b.size)return false;const[sm,bg]=a.size<=b.size?[a,b]:[b,a];return subset(sm,bg)&&[...sm].join('').length>=4};
const cpmatchK=(a,b)=>!!(a&&b&&(a===b||(a.length>=5&&b.length>=5&&(a.includes(b)||b.includes(a)||a.slice(0,7)===b.slice(0,7)))));
const MON={января:1,февраля:2,марта:3,апреля:4,мая:5,июня:6,июля:7,августа:8,сентября:9,октября:10,ноября:11,декабря:12};
function parseDate(v){
  if(v==null||v==='')return '';
  if(v instanceof Date&&!isNaN(v))return v.getFullYear()+'-'+pad(v.getMonth()+1)+'-'+pad(v.getDate());
  if(typeof v==='number'&&v>20000&&v<80000){const d=new Date(Math.round((v-25569)*864e5));return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())}
  const s=String(v).trim();let m;
  if(m=s.match(/^(\d{4})-(\d{2})-(\d{2})/))return m[1]+'-'+m[2]+'-'+m[3];
  if(m=s.match(/(\d{1,2})[.\/](\d{1,2})[.\/](\d{2,4})/)){let y=+m[3];if(y<100)y+=2000;return y+'-'+pad(+m[2])+'-'+pad(+m[1])}
  if(m=s.toLowerCase().match(/(\d{1,2})\s+([а-я]+)\s+(\d{4})/))if(MON[m[2]])return m[3]+'-'+pad(MON[m[2]])+'-'+pad(+m[1]);
  return '';
}
const yearOf=iso=>iso?+iso.slice(0,4):null;
function toast(msg,kind='ok',ms=3200){
  let t=$('#toasts');if(!t){t=document.createElement('div');t.id='toasts';document.body.appendChild(t)}
  const e=document.createElement('div');e.className='toast '+kind;e.textContent=msg;t.appendChild(e);
  setTimeout(()=>{e.classList.add('out');setTimeout(()=>e.remove(),300)},ms);
}
async function copyText(t,label){
  try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove()}
  toast(label?('Скопировано: '+label):'Скопировано');
}
const debounce=(f,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),ms)}};
const plural=(n,a,b,c)=>{n=Math.abs(n)%100;const k=n%10;return n>10&&n<20?c:k>1&&k<5?b:k===1?a:c};
const num=n=>(n??0).toLocaleString('ru-RU');
function download(name,blob){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(u)},500)}
const b64=u8=>{let s='';const C=0x8000;for(let i=0;i<u8.length;i+=C)s+=String.fromCharCode.apply(null,u8.subarray(i,i+C));return btoa(s)};
const unb64=s=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};

/* ===== криптография (AES-GCM, PBKDF2) ===== */
const MAGIC=[0x53,0x58,0x44,0x31]; // SXD1
async function deriveKey(pass,salt,iter){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},true,['encrypt','decrypt']);
}
async function gz(u8){const cs=new CompressionStream('gzip');const w=cs.writable.getWriter();w.write(u8);w.close();return new Uint8Array(await new Response(cs.readable).arrayBuffer())}
async function gunz(u8){const ds=new DecompressionStream('gzip');const w=ds.writable.getWriter();w.write(u8);w.close();return new Uint8Array(await new Response(ds.readable).arrayBuffer())}
async function encryptBlob(obj,key,salt,iter){
  const raw=await gz(new TextEncoder().encode(JSON.stringify(obj)));
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,raw));
  const head=new Uint8Array(4+4+16+12);head.set(MAGIC,0);new DataView(head.buffer).setUint32(4,iter);head.set(salt,8);head.set(iv,24);
  const out=new Uint8Array(head.length+ct.length);out.set(head);out.set(ct,head.length);return out;
}
function parseHead(u8){
  if(u8.length<40||MAGIC.some((m,i)=>u8[i]!==m))throw new Error('Неверный формат файла данных');
  return{iter:new DataView(u8.buffer,u8.byteOffset).getUint32(4),salt:u8.slice(8,24),iv:u8.slice(24,36),ct:u8.slice(36)};
}
async function decryptBlob(u8,key){
  const{iv,ct}=parseHead(u8);
  const raw=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct));
  return JSON.parse(new TextDecoder().decode(await gunz(raw)));
}

/* ===== локальное хранилище (IndexedDB) ===== */
const IDB={
  db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('sxed-app',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{IDB.db=r.result;res()};r.onerror=()=>rej(r.error)})},
  get(k){return new Promise(res=>{try{const q=IDB.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(undefined)}catch(e){res(undefined)}})},
  set(k,v){return new Promise(res=>{try{const t=IDB.db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res(true);t.onerror=()=>res(false)}catch(e){res(false)}})}
};
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

/* ===== состояние пользователя ===== */
const blankState=()=>({v:1,marks:{},att:{},extraAtt:{},tracker:{cols:null,rows:{},order:[],ts:0},views:{},uploads:{},ideas:{},intake:{},debts:{},orig:{},snaps:{},access:{},dupok:{},seen:{},odiff:{},mgrfix:{},log:[],settings:{prefix:'',from:2022},updated:0});
let ST=blankState();
function touch(){if(VIEW)return;ST.updated=nowTs();persistSoon();syncSoon()}
const persistSoon=debounce(()=>{IDB.set('state',ST)},400);
function logAct(txt){ST.log.unshift({t:nowTs(),x:txt});ST.log=ST.log.slice(0,200)}
function mergeState(a,b){ // a — локальное, b — удалённое; побеждает более новое по ts записи
  const out=blankState();
  const mergeMap=(x,y)=>{const o={...x};for(const k in y){if(!o[k]||(y[k].ts||0)>(o[k].ts||0))o[k]=y[k]}return o};
  out.marks=mergeMap(a.marks||{},b.marks||{});
  out.att=mergeMap(a.att||{},b.att||{});
  out.extraAtt=mergeMap(a.extraAtt||{},b.extraAtt||{});
  out.views=mergeMap(a.views||{},b.views||{});
  out.ideas=mergeMap(a.ideas||{},b.ideas||{});
  out.uploads=mergeMap(a.uploads||{},b.uploads||{});
  for(const k of ['intake','debts','orig','snaps','access','dupok','seen','odiff','mgrfix'])out[k]=mergeMap(a[k]||{},b[k]||{});
  const ta=a.tracker||{},tb=b.tracker||{};
  out.tracker={cols:(tb.ts||0)>(ta.ts||0)?tb.cols:ta.cols,ts:Math.max(ta.ts||0,tb.ts||0),rows:mergeMap(ta.rows||{},tb.rows||{}),order:[]};
  const ord=[...(ta.order||[]),...(tb.order||[])];out.tracker.order=[...new Set(ord)].filter(id=>out.tracker.rows[id]&&!out.tracker.rows[id].del);
  if((tb.ord_ts||0)>(ta.ord_ts||0)){out.tracker.order=[...new Set([...(tb.order||[]),...ord])].filter(id=>out.tracker.rows[id]&&!out.tracker.rows[id].del);out.tracker.ord_ts=tb.ord_ts}else out.tracker.ord_ts=ta.ord_ts;
  out.cmpPrev={...(b.cmpPrev||{}),...(a.cmpPrev||{})};for(const k in (b.cmpPrev||{}))if(a.cmpPrev&&a.cmpPrev[k]&&(b.cmpPrev[k].at||0)>(a.cmpPrev[k].at||0))out.cmpPrev[k]=b.cmpPrev[k];
  out.log=[...(a.log||[]),...(b.log||[])].sort((x,y)=>y.t-x.t).filter((e,i,arr)=>!i||e.t!==arr[i-1].t||e.x!==arr[i-1].x).slice(0,200);
  out.settings={...(b.settings||{}),...(a.settings||{})};
  out.updated=Math.max(a.updated||0,b.updated||0);
  return out;
}

/* ===== синхронизация через GitHub (зашифрованный файл состояния) ===== */
const SYNC={
  cfg(){return VIEW?null:LS.get('sxed_gh',null)},
  status:'off',lastOk:0,sha:null,busy:false,
  async api(path,opt={}){
    const c=this.cfg();const r=await fetch('https://api.github.com/repos/'+c.repo+'/contents/'+c.path+(opt.method==='PUT'?'':'?ref='+encodeURIComponent(c.branch||'main')),{...opt,headers:{'Authorization':'Bearer '+c.token,'Accept':opt.raw?'application/vnd.github.raw+json':'application/vnd.github+json',...(opt.headers||{})}});
    return r;
  },
  async pull(){
    const c=this.cfg();if(!c||!KEY)return null;
    const meta=await this.api('',{});
    if(meta.status===404){this.sha=null;return null}
    if(!meta.ok)throw new Error('GitHub '+meta.status);
    const j=await meta.json();this.sha=j.sha;
    let u8;
    if(j.content){u8=unb64(j.content.replace(/\n/g,''))}
    else{const r=await this.api('',{raw:true});u8=new Uint8Array(await r.arrayBuffer())}
    return await decryptBlob(u8,KEY);
  },
  async push(){
    const c=this.cfg();if(!c||!KEY)return;
    const u8=await encryptBlob(ST,KEY,SALT,ITER);
    const body={message:'Обновление состояния '+new Date().toISOString().slice(0,16),content:b64(u8),branch:c.branch||'main'};
    if(this.sha)body.sha=this.sha;
    const r=await this.api('',{method:'PUT',body:JSON.stringify(body)});
    if(r.status===409||r.status===422){return 'conflict'}
    if(!r.ok)throw new Error('GitHub '+r.status);
    const j=await r.json();this.sha=j.content.sha;return 'ok';
  },
  async sync(manual){
    if(!this.cfg()||this.busy)return;this.busy=true;this.setStatus('sync');
    try{
      for(let i=0;i<3;i++){
        const remote=await this.pull();
        if(remote){ST=mergeState(ST,remote);IDB.set('state',ST);}
        const r=await this.push();
        if(r!=='conflict')break;
      }
      this.lastOk=nowTs();this.setStatus('ok');if(manual)toast('Синхронизировано с GitHub');
      if(typeof onStateMerged==='function')onStateMerged();
    }catch(e){console.error(e);this.setStatus('err');if(manual)toast('Ошибка синхронизации: '+e.message,'bad',6000)}
    this.busy=false;
  },
  setStatus(s){this.status=s;const e=$('#syncchip');if(e){e.dataset.s=s;e.querySelector('.t').textContent=({off:'Не подключено',sync:'Синхронизация…',ok:'Синхронизировано',err:'Ошибка синхронизации'})[s]}}
};
const syncSoon=debounce(()=>{if(SYNC.cfg())SYNC.sync(false)},20000);

let KEY=null,SALT=null,ITER=200000,DATA=null;

/* ===== чтение файлов выгрузок ===== */
function readFileBuf(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsArrayBuffer(f)})}
function parseMXL(buf){ // выгрузка списка договоров из 1С в формате .mxl (текстовый MOXCEL)
  const t=new TextDecoder('utf-8').decode(buf).replace(/^﻿/,'');
  const st=t.indexOf('{8,1,12');const body=st>=0?t.slice(st):t;
  const rx=/\{16,\d+,\s*\{1,(?:1,\s*\{"#","((?:[^"]|"")*)"\}|0)\s*\},0\},(\d+),(0,\d+,0,)?/g;
  const rows=[];let cur=[];let m;let pos=body.indexOf('{16,1,');if(pos<0)pos=0;rx.lastIndex=pos;
  while((m=rx.exec(body))){cur.push(m[1]!=null?m[1].replace(/""/g,'"'):'');if(m[3]){rows.push(cur);cur=[]}}
  if(cur.length)rows.push(cur);return rows;
}
async function readTable(file){ // -> {rows:[[...]], name}
  const buf=await readFileBuf(file);const ext=(file.name.split('.').pop()||'').toLowerCase();
  if(ext==='mxl')return{rows:parseMXL(buf),name:file.name,fmt:'mxl'};
  if(!window.XLSX)await loadXLSX();
  const wb=XLSX.read(buf,{type:'array',cellDates:true});
  return{wb,name:file.name,fmt:ext};
}

const GUESS={

  cp:[/контрагент|клиент|покупатель|организаци|партн[её]р|наименование контрагента|counterpart/i],

function guessCols(header){
  const map={};const used=new Set();
  for(const f of Object.keys(GUESS)){
    for(let j=0;j<header.length;j++){

      if(h&&GUESS[f].some(rx=>rx.test(h))){map[f]=j;used.add(j);break}

}
function normRecords(rows,map,hdrRow){ // -> записи источника
  const out=[];
  for(let r=hdrRow+1;r<rows.length;r++){
    const x=rows[r];if(!x)continue;
    const g=k=>map[k]!=null?x[map[k]]:null;
    const numRaw=String(g('num')??'').trim(),name=String(g('name')??'').trim(),cp=String(g('cp')??'').trim();
    if(!numRaw&&!name&&!cp)continue;
    let date=parseDate(g('date'));
    let num=numRaw,generic=!numRaw||/^\s*Основ/i.test(numRaw);
    if(!date&&name){const m=name.match(/от\s*(\d{1,2}\.\d{2}\.\d{2,4})/);if(m)date=parseDate(m[1])}
    if(generic&&name){const m=name.match(/(?:№|\bNo\.?)\s*(.+?)\s+от\s+\d|(?:№|\bNo\.?)\s*(\S+)/i);if(m){const v=(m[1]||m[2]).trim().replace(/^[ .,;()]+|[ .,;()]+$/g,'');if(v&&/\d/.test(v)){num=v;generic=false}}}
    const inn=String(g('inn')??'').match(/\d{10,12}/)?.[0]||(cp.match(/(?<!\d)(\d{10}|\d{12})(?!\d)/)||[])[0]||'';
    out.push({i:out.length,num,name,cp,state:String(g('state')??'').trim(),date,generic:generic?1:0,inn,type:String(g('type')??'').trim(),mgr:(v=>BADMGR.test(v)?'':v)(String(g('mgr')??'').trim()),org:String(g('org')??'').trim()});
  }

}
const DRE=/\d{1,2}\.\d{2}\.\d{2,4}|\d{1,2}\s+[а-яА-Я]+\s+\d{4}/g;
function buildIndex(recs){
  const idx={byk:new Map(),byck:new Map(),names:[]};
  for(const c of recs){
    c.k=c.generic?'':nn(c.num);c.ck=cpk(c.cp);c.tk=toks(c.cp);
    if(c.k){if(!idx.byk.has(c.k))idx.byk.set(c.k,[]);idx.byk.get(c.k).push(c);idx.names.push([nn((c.name||'').replace(DRE,' ')),c])}
    if(!idx.byck.has(c.ck))idx.byck.set(c.ck,[]);idx.byck.get(c.ck).push(c);
  }
  idx.all=recs;return idx;
}
function sameCp(x,c,tkx,ckx){return (x.inn&&c.inn&&x.inn===c.inn)||tokmatch(tkx,c.tk)||cpmatchK(ckx,c.ck)}
function matchOne(x,idx,tkx,ckx,kx){
  // кандидаты по номеру
  let cand=kx?[...(idx.byk.get(kx)||[])]:[];
  if(kx&&kx.length>=5){for(const[nm,c]of idx.names)if(nm.includes(kx)&&!cand.includes(c))cand.push(c)}
  const m=cand.filter(c=>sameCp(x,c,tkx,ckx));
  if(m.length){
    const sts=new Set(m.map(c=>c.state));
    const closedOnly=m.every(c=>/закр/i.test(c.state));
    const anyClosed=m.some(c=>/закр/i.test(c.state));
    const dated=m.filter(c=>c.date);
    if(x.date&&dated.length&&!dated.some(c=>c.date===x.date)&&m.length===dated.length)return{code:'datediff',m:m.map(c=>c.i)};
    return{code:closedOnly?'closed':anyClosed?'dup':'ok',m:m.map(c=>c.i)};
  }
  if(cand.length)return{code:'numoth',m:cand.map(c=>c.i)};
  const same=(idx.all||[]).filter(c=>sameCp(x,c,tkx,ckx));
  if(same.length){
    const sd=same.filter(c=>!c.generic&&c.date&&c.date===x.date);
    if(sd.length)return{code:'cpdate',m:sd.map(c=>c.i)};
    if(same.every(c=>c.generic))return{code:'generic',m:same.map(c=>c.i)};
    return{code:'cpnodoc',m:[]};
  }

}
function matchSource(contracts,recs){
  const idx=buildIndex(recs);const res=new Map();
  for(const x of contracts){
    const kx=nn(x.num);const tk=toks(x.cp),ck=cpk(x.cp);
    res.set(x.key,matchOne(x,idx,tk,ck,kx));
  }
  return res;
}

/* менеджеры из выгрузки 1С */
function applyMgr1c(opisC,recs){
  const from=ST.settings.from||2022;const sc=opisC.filter(c=>c.y!=null&&c.y>=from);
  const cnt={};for(const c of sc)if(c.mgr)cnt[c.mgr]=(cnt[c.mgr]||0)+1;
  const std=new Set(Object.keys(cnt).filter(m=>cnt[m]>=3));
  const single=[...std].filter(m=>!/[\/(]/.test(m));
  const first=s=>String(s).trim().split(/\s+/)[0].toLowerCase();
  const canon=full=>{const p=String(full).trim().split(/\s+/);const S=p[0],ini=(p[1]||'')[0]||'';
    const cands=single.filter(m=>first(m)===S.toLowerCase());
    if(cands.length===1)return cands[0];
    if(cands.length>1)return cands.find(m=>ini&&m.toLowerCase().includes(' '+ini.toLowerCase()+'.'))||cands.find(m=>m.toLowerCase()===S.toLowerCase())||cands[0];
    return S};
  const bad=m=>!m||/^администратор/i.test(m.trim())||BADMGR.test(String(m).trim());
  const res=matchSource(sc,recs);
  const PAREN=['собода'];
  const G={total:sc.length,found:0,filled:[],diff:[],none:[],same:0,note:[]};
  for(const c of sc){
    c.mgrOpis=c.mgr||'';
    const x=res.get(c.key);
    if(!['ok','closed','dup','datediff','cpdate','generic'].includes(x.code)){c.mgrWhy=x.code==='nocp'?'контрагента нет в 1С':x.code==='numoth'?'номер у другого контрагента':'договора нет в 1С';G.none.push(c);continue}
    const L=x.m.map(i=>recs[i]).filter(r=>r&&!bad(r.mgr));
    if(!L.length){c.mgrWhy='в 1С менеджер не указан или «Администратор»';G.none.push(c);continue}
    G.found++;
    const pool=(L.some(r=>!r.generic)?L.filter(r=>!r.generic):L);
    const act=pool.filter(r=>!/закр/i.test(r.state||''));const use=act.length?act:pool;
    const t={};for(const r of use){const m=canon(r.mgr);t[m]=(t[m]||0)+1}
    const ent=Object.entries(t).sort((a,b)=>b[1]-a[1]);const real=ent.filter(e=>!PAREN.includes(e[0].toLowerCase()));
    if(!real.length){const nt=ent[0][0];c.mgrNote=nt;c.mgr1c=nt;G.note.push(c);if(c.mgr&&std.has(c.mgr))G.same++;continue}
    const m1=real[0][0];if(ent.length>real.length)c.mgrNote=ent.find(e=>PAREN.includes(e[0].toLowerCase()))[0];
    if(!c.mgr||!std.has(c.mgr)){c.mgr=m1;c.mgrSrc='1С';c.mgr1c=m1;G.filled.push(c)}
    else if(first(c.mgr)===first(m1)||c.mgr.toLowerCase().includes(first(m1)))G.same++;
    else{c.mgrDiff=m1;G.diff.push(c)}
  }
  MG1C=G;
}

  const p={};

    for(const c of CON){if(c.k!=='o'||!inScope(c)||!(flagOn(c.spec)||flagOn(c.add)))continue;const r=mkRec('op','spec',{kind:'Опись: '+[c.spec,c.add].filter(flagOn).join(' / '),cp:c.cp,inn:c.inn,num:c.num,date:c.date,ref:c.key});const e=ent(r);e.n.op++;e.recs.push(r)}

    else if(cands.length){cls='cp';peer=cands[0]}

      const bycd=x.date?opis.filter(c=>c.date===x.date&&cpEq(xc,c)):[];
      if(bycd.length){cls='num';peer=bycd[0]}else cls=opis.some(c=>cpEq(xc,c))?'nodoc':'nocp';
    }
    if(!cls&&/нескольк[ои]\s+верси/i.test(note))cls='multi';
    if(cls)rows.push({i,x,cls,peer,note});else okN++;
  });
  return _attr={rows,okN,total:SXREC.length};
}

function trackIssues(){
  if(typeof VIEW!=='undefined'&&VIEW)return;
  const t=today();let ch=0;
  for(const c of CON){
    if(!inScope(c))continue;const open=isOpen(c);const s=ST.seen[c.key];
    if(open&&(!s||s.r)){ST.seen[c.key]={d:t,r:'',ts:nowTs()};ch++}
    else if(!open&&s&&!s.r){ST.seen[c.key]={...s,r:t,ts:nowTs()};ch++}
  }
  if(ch)touch();
}
function issueAge(c){
  if((ST.settings.slaMode||'seen')==='contract')return c.date?Math.max(0,daysFrom(c.date)):null;
  const s=ST.seen[c.key];return s&&s.d&&!s.r?Math.max(0,daysFrom(s.d)):0;
}
const slaLimit=()=>ST.settings.sla||30;
function slaRows(){
  const out=[];
  for(const c of CON){if(!isOpen(c))continue;const a=issueAge(c);out.push({c,age:a==null?0:a,over:a!=null&&a>slaLimit()})}
  return out;
}
function slaByMgr(rows){
  const M={};
  for(const r of rows){const m=mgrOf(r.c);const o=M[m]=M[m]||{m,open:0,over:0,sum:0,max:0};o.open++;o.sum+=r.age;if(r.over)o.over++;if(r.age>o.max)o.max=r.age}
  return Object.values(M).map(o=>({...o,avg:o.open?Math.round(o.sum/o.open):0})).sort((a,b)=>b.over-a.over||b.avg-a.avg||b.open-a.open);
}

/* ---------- 6. сравнение версий описи ---------- */
const OPF=[['mgr','Менеджер'],['sig','Вид подписи'],['orig','Оригинал'],['spec','Спецификации'],['add','Допсоглашения'],['inn','ИНН']];
function opisDiff(oldR,newR){
  const key3=r=>(nn(r.num)||'#'+String(r.num||'').trim().toLowerCase())+'|'+cpk(r.cp)+'|'+(r.date||''),key2=r=>nn(r.num)+'|'+cpk(r.cp),keyD=r=>cpk(r.cp)+'|'+(r.date||''),keyN=r=>nn(r.num)+'|'+(r.date||'');
  const norm=s=>String(s||'').trim().toLowerCase();
  const O=oldR.map((r,i)=>({...r,_i:i})),N=newR.map((r,i)=>({...r,_i:i}));
  const usedO=new Set(),usedN=new Set();const changed=[];
  const pass=(kf,why,ok=r=>!!nn(r.num))=>{
    const idx=new Map();O.forEach(r=>{if(usedO.has(r._i))return;const k=kf(r);if(!k||!ok(r))return;if(!idx.has(k))idx.set(k,[]);idx.get(k).push(r)});
    for(const n of N){
      if(usedN.has(n._i)||!ok(n))continue;const k=kf(n);const L=idx.get(k);if(!L||!L.length)continue;
      const o=L.shift();usedO.add(o._i);usedN.add(n._i);
      const diffs=[];
      if(why){const w=why(o,n);if(w)diffs.push(w)}
      if(why!=='cp'&&norm(o.cp)!==norm(n.cp)&&cpk(o.cp)!==cpk(n.cp))diffs.push(['Контрагент',o.cp,n.cp]);
      for(const [f,l] of OPF){if(norm(o[f])!==norm(n[f])&&(o[f]||n[f]))diffs.push([l,o[f]||'—',n[f]||'—'])}
      if(diffs.length)changed.push({o,n,diffs});
    }
  };
  pass(key3,null,()=>true);
  pass(key2,(o,n)=>['Дата',fmtD(o.date)||'—',fmtD(n.date)||'—']);
  pass(keyD,(o,n)=>nn(o.num)===nn(n.num)?null:['Номер',o.num||'—',n.num||'—'],r=>!!r.date);
  pass(keyN,(o,n)=>['Контрагент',o.cp,n.cp]);
  const removed=O.filter(r=>!usedO.has(r._i)),added=N.filter(r=>!usedN.has(r._i));
  return{added,removed,changed,same:O.length-removed.length-changed.length,nOld:O.length,nNew:N.length};
}
const diffSummary=d=>`+${d.added.length} / −${d.removed.length} / изменено ${d.changed.length}`;

/* ===== Открытие файлов прямо из архивов (File System Access API) =====
   Один раз выбираете папку, где лежат архивы (zip) или их распакованные папки.
   Дальше по кнопке «Открыть файл» приложение само находит документ и открывает его. */
const ARC={
  root:null,name:'',ok:false,
  zips:new Map(),     // имя файла -> {file, ents:[{n,low,base,m,cs,us,off}], byBase:Map}
  tree:null,          // индекс распакованных файлов: basename(low) -> [{path,handle}]
  supported:typeof window!=='undefined'&&!!window.showDirectoryPicker,
  nrm:s=>String(s||'').normalize('NFC').toLowerCase().replace(/ё/g,'е').replace(/\\/g,'/').replace(/\s+/g,' ').trim(),
  nsrc:s=>ARC.nrm(s).replace(/[_]+/g,' ').replace(/^схэд /,'').replace(/\.(zip|rar|7z)$/,''),
  years(s){const y=new Set();for(const m of String(s).matchAll(/(20\d\d)\s*[-–]\s*(20\d\d)/g)){for(let i=+m[1];i<=+m[2];i++)y.add(i)}for(const m of String(s).matchAll(/20\d\d/g))y.add(+m[0]);return y},
  srcMatch(fname,src){ // подходит ли имя архива/папки к «Архиву-источнику» документа
    if(!src)return true;const a=this.nsrc(fname),b=this.nsrc(src);if(a.startsWith(b)||b.startsWith(a))return true;
    const w1=a.split(' ')[0],w2=b.split(' ')[0];if(w1!==w2)return false;
    const ya=this.years(a),yb=this.years(b);if(!ya.size||!yb.size)return false;for(const y of yb)if(ya.has(y))return true;return false;
  },
  async init(){
    if(!this.supported)return;
    try{const h=await IDB.get('arcroot');if(h){this.root=h;this.name=h.name;await this.checkPerm(false)}}catch(e){}
  },
  async checkPerm(ask){
    if(!this.root)return false;
    try{
      let p=await this.root.queryPermission({mode:'read'});
      if(p!=='granted'&&ask)p=await this.root.requestPermission({mode:'read'});
      this.ok=p==='granted';
    }catch(e){this.ok=false}
    return this.ok;
  },
  async pick(){
    const h=await window.showDirectoryPicker({id:'sxed-archives',mode:'read'});
    this.root=h;this.name=h.name;this.ok=true;await this.reindex();
    await IDB.set('arcroot',h);return h;
  },
  async forget(){this.root=null;this.name='';this.ok=false;await this.reindex();await IDB.set('arcroot',null)},

  /* ---- распакованные папки ---- */
  async child(dir,name,isDir){ // точное имя, иначе — совпадение без учёта регистра/нормализации
    try{return isDir?await dir.getDirectoryHandle(name):await dir.getFileHandle(name)}catch(e){}
    const n=this.nrm(name);
    for await(const [k,v] of dir.entries()){if(this.nrm(k)===n&&(isDir?v.kind==='directory':v.kind==='file'))return v}
    return null;
  },
  async walk(dir,segs){let cur=dir;for(let i=0;i<segs.length;i++){const last=i===segs.length-1;const h=await this.child(cur,segs[i],!last);if(!h)return null;cur=h}return cur},
  async tryUnpacked(rel,src){
    const segs=rel.split('/').filter(Boolean);
    const key='base:'+src;

/* ===== запись zip-пакета (без сжатия: файлы уже PDF) ===== */
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

class ZipOut{
  constructor(sink){this.sink=sink;this.off=0;this.cd=[];this.names=new Set()}
  uniq(p){if(!this.names.has(p.toLowerCase())){this.names.add(p.toLowerCase());return p}const i=p.lastIndexOf('.');const b=i>p.lastIndexOf('/')?p.slice(0,i):p,e=i>p.lastIndexOf('/')?p.slice(i):'';for(let n=2;;n++){const q=b+' ('+n+')'+e;if(!this.names.has(q.toLowerCase())){this.names.add(q.toLowerCase());return q}}}
  async add(path,data){ // data: Blob | Uint8Array | string
    path=this.uniq(path.replace(/\\/g,'/').replace(/^\/+/,'').replace(/[<>:"|?*]/g,'_'));
    const u8=typeof data==='string'?new TextEncoder().encode(data):data instanceof Uint8Array?data:new Uint8Array(await data.arrayBuffer());
    if(this.off+u8.length>3.9e9)throw new Error('Пакет получился больше 4 ГБ — выберите меньше договоров (по менеджеру или по году).');
    if(this.cd.length>=65000)throw new Error('В пакете слишком много файлов — разбейте его по менеджерам или годам.');
    const nb=new TextEncoder().encode(path),crc=crc32(u8);const d=new Date();
    const dt=((d.getFullYear()-1980)<<9|(d.getMonth()+1)<<5|d.getDate())&0xFFFF,tm=(d.getHours()<<11|d.getMinutes()<<5|(d.getSeconds()>>1))&0xFFFF;
    const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x800,true);h.setUint16(8,0,true);h.setUint16(10,tm,true);h.setUint16(12,dt,true);h.setUint32(14,crc,true);h.setUint32(18,u8.length,true);h.setUint32(22,u8.length,true);h.setUint16(26,nb.length,true);h.setUint16(28,0,true);
    const off=this.off;await this.sink.write(new Uint8Array(h.buffer));await this.sink.write(nb);await this.sink.write(u8);this.off+=30+nb.length+u8.length;
    this.cd.push({nb,crc,size:u8.length,off,tm,dt});
  }
  async finish(){
    const start=this.off;let size=0;
    for(const e of this.cd){const h=new DataView(new ArrayBuffer(46));h.setUint32(0,0x02014b50,true);h.setUint16(4,20,true);h.setUint16(6,20,true);h.setUint16(8,0x800,true);h.setUint16(10,0,true);h.setUint16(12,e.tm,true);h.setUint16(14,e.dt,true);h.setUint32(16,e.crc,true);h.setUint32(20,e.size,true);h.setUint32(24,e.size,true);h.setUint16(28,e.nb.length,true);h.setUint32(42,e.off,true);await this.sink.write(new Uint8Array(h.buffer));await this.sink.write(e.nb);size+=46+e.nb.length}
    const t=new DataView(new ArrayBuffer(22));t.setUint32(0,0x06054b50,true);t.setUint16(8,this.cd.length,true);t.setUint16(10,this.cd.length,true);t.setUint32(12,size,true);t.setUint32(16,start,true);await this.sink.write(new Uint8Array(t.buffer));

  }
}
/* куда писать пакет: сразу на диск (Chrome/Edge) или в память с последующим скачиванием */
async function zipSink(fileName,dir){
  if(dir){const fh=await dir.getFileHandle(fileName,{create:true});const w=await fh.createWritable();return{write:u=>w.write(u),close:()=>w.close(),disk:true}}
  if(window.showSaveFilePicker){
    const fh=await window.showSaveFilePicker({suggestedName:fileName,types:[{description:'ZIP-архив',accept:{'application/zip':['.zip']}}]});
    const w=await fh.createWritable();return{write:u=>w.write(u),close:()=>w.close(),disk:true};
  }
  const parts=[];return{write:async u=>{parts.push(u)},close:async()=>download(fileName,new Blob(parts,{type:'application/zip'})),disk:false};
}
/* собрать zip из списка {path, rel, src, alts} */
async function buildZip(fileName,items,extra,progress,dir){
  const sink=await zipSink(fileName,dir);const z=new ZipOut(sink);const miss=[];let ok=0;
  try{
    for(let i=0;i<items.length;i++){
      const it=items[i];if(progress)progress(i,items.length,it);
      let r=null;try{r=await ARC.fetchBlob(it.rel,it.src,it.alts)}catch(e){}
      if(r&&r.blob){await z.add(it.path,r.blob);ok++}else miss.push(it);
    }
    for(const [p,t] of Object.entries(extra||{}))await z.add(p,t);
    if(miss.length)await z.add('НЕ_НАЙДЕНО.txt','\ufeffФайлы, которых не оказалось в выбранной папке с архивами:\r\n\r\n'+miss.map(m=>m.rel).join('\r\n'));
    await z.finish();
  }catch(e){try{await sink.close()}catch(_){}throw e}
  return{ok,miss};
}

/* ===== Красивые Excel-файлы (собственный писатель .xlsx со стилями, без внешних библиотек) =====
   exportXLSX(имя, {лист: строки | {rows,hdr,widths,tone,freeze,tab,note}}, {readme:[...], title})
   - шапка таблицы цветная, закреплена, включён фильтр, ширины подобраны, статусы окрашены

const XS={okc:17,warnc:18,badc:19,infoc:20,mutec:21,def:0,title:1,sub:2,hdr:3,body:4,zebra:5,num:6,numz:7,ok:8,warn:9,bad:10,info:11,mute:12,sect:13,total:14,lab:15,note:16};
const XL_TAB={ok:'2F8F5B',warn:'B77A14',bad:'C0463E',info:'3F69A8',main:'2C7A6B',mute:'93A0AF'};
function xlStyles(){

  const xf=(font,fill,bd,h,v,wrap)=>`<xf numFmtId="0" fontId="${font}" fillId="${F(fill)}" borderId="${bd}" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment ${h?`horizontal="${h}" `:''}vertical="${v||'top'}"${wrap?' wrapText="1"':''}/></xf>`;
  const xfs=[
    xf(0,'none',0,'', 'top',0),            // 0 def
    xf(1,'none',0,'', 'center',0),         // 1 title
    xf(2,'none',0,'', 'center',0),         // 2 sub
    xf(3,'acc',1,'center','center',1),     // 3 hdr
    xf(0,'none',1,'', 'top',1),            // 4 body
    xf(0,'zeb',1,'', 'top',1),             // 5 zebra
    xf(0,'none',1,'center','top',1),       // 6 num
    xf(0,'zeb',1,'center','top',1),        // 7 numz
    xf(4,'ok',1,'left','top',1),         // 8 ok
    xf(5,'warn',1,'left','top',1),       // 9 warn
    xf(6,'bad',1,'left','top',1),        // 10 bad
    xf(7,'info',1,'left','top',1),       // 11 info
    xf(8,'mute',1,'left','top',1),       // 12 mute
    xf(9,'sect',1,'', 'center',0),         // 13 sect
    xf(10,'mute',2,'', 'center',0),        // 14 total
    xf(10,'none',1,'', 'top',1),           // 15 lab
    xf(0,'none',0,'', 'top',1),            // 16 note (текст без рамки с переносом)
    xf(4,'ok',1,'center','top',1),xf(5,'warn',1,'center','top',1),xf(6,'bad',1,'center','top',1),xf(7,'info',1,'center','top',1),xf(8,'mute',1,'center','top',1) // 17-21 те же, по центру (числа)
  ];
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">`+
  `<fonts count="${fonts.length}">${fonts.map(([c,b,i,s])=>`<font>${b?'<b/>':''}${i?'<i/>':''}<sz val="${s}"/><color rgb="FF${c}"/><name val="Calibri"/><family val="2"/></font>`).join('')}</fonts>`+
  `<fills count="${2+fills.length}"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>${fills.map(c=>`<fill><patternFill patternType="solid"><fgColor rgb="FF${c}"/><bgColor indexed="64"/></patternFill></fill>`).join('')}</fills>`+
  `<borders count="3"><border><left/><right/><top/><bottom/><diagonal/></border>${border('DDD8CC')}<border><left style="thin"><color rgb="FFDDD8CC"/></left><right style="thin"><color rgb="FFDDD8CC"/></right><top style="medium"><color rgb="FF1F5F53"/></top><bottom style="thin"><color rgb="FFDDD8CC"/></bottom><diagonal/></border></borders>`+
  `<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="${xfs.length}">${xfs.join('')}</cellXfs>`+
  `<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
}
/* цвет статусной ячейки по тексту */
const XL_STATCOL=/^(1С|СХЭД|СБИС|Опись|Архив|Оригинал|Статус|Сверка|Состояние|Менеджер: расхожд|Отметка|Запрос)/i;
function xlTone(v,hdr){
  if(typeof v!=='string'||!v||v.length>34||!XL_STATCOL.test(hdr||''))return null;
  const t=v.trim().toLowerCase();
  if(/^(✓|есть|да\b|совпада|найден|оригинал есть|получен|готово|сделано|в порядке|в схэд$)/.test(t))return 'ok';
  if(/^(✗|нет\b|не найден|отсутств|не загруж|не получен)/.test(t))return 'bad';
  if(/^(⚠|расхожд|проверить|частично|не совпад|ожидает|запрошен|в работе|в архиве|только|не хватает|в 1с друг|в сбис друг|номер у|закрыт в|дубль)/.test(t))return 'warn';
  if(/^(не нужно|закрыт|пропущ|вне периода|не сверено|сбис не загружен|—|-$)/.test(t))return 'mute';
  return null;
}
function xlSheetXml(rows,o){
  const hdr=o.hdr>=0?o.hdr:-1;
  const ncol=Math.max(1,...rows.map(r=>r.length));
  /* ширины */
  let widths=o.widths&&o.widths.length?o.widths.map(w=>typeof w==='object'?w.wch:w):null;
  if(!widths){
    widths=[];
    for(let j=0;j<ncol;j++){
      let w=8;const from=hdr>=0?hdr:0;
      for(let i=from;i<Math.min(rows.length,from+300);i++){const v=rows[i][j];if(v==null)continue;const s=String(v);const L=Math.max(...s.split('\n').map(x=>x.length));w=Math.max(w,i===hdr?Math.min(L+3,26):L+2)}
      widths.push(Math.min(58,w));
    }
  }
  let x=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">`;
  x+=`<sheetPr><tabColor rgb="FF${o.tab||XL_TAB.main}"/><pageSetUpPr fitToPage="1"/></sheetPr>`;
  x+=`<sheetViews><sheetView workbookViewId="0" showGridLines="0"${o.first?' tabSelected="1"':''}>`;
  if(hdr>=0&&o.freeze!==false)x+=`<pane ySplit="${hdr+1}"${o.freezeCols?` xSplit="${o.freezeCols}"`:''} topLeftCell="${XL_COL(o.freezeCols||0)}${hdr+2}" activePane="${o.freezeCols?'bottomRight':'bottomLeft'}" state="frozen"/>`;
  x+=`</sheetView></sheetViews><sheetFormatPr defaultRowHeight="15"/>`;
  x+=`<cols>${widths.map((w,j)=>`<col min="${j+1}" max="${j+1}" width="${w}" customWidth="1"/>`).join('')}</cols><sheetData>`;
  const hd=hdr>=0?rows[hdr]:[];
  let zi=0;
  rows.forEach((r,i)=>{
    const R=i+1;let ht='';
    const filled=r.filter(v=>v!=null&&v!=='').length;
    let kind='body';
    if(i===hdr)kind='hdr';
    else if(hdr>=0&&i<hdr)kind=i===0?'title':'sub';
    else if(hdr<0&&o.plain)kind='note';
    else if(hdr>=0&&i>hdr&&/^ИТОГО/i.test(String(r[0])))kind='total';
    else if(hdr>=0&&i>hdr&&filled===1&&r.length>1&&ncol>2&&typeof r[0]==='string'&&r.slice(1).every(v=>v==null||v===''))kind='sect';
    if(kind==='hdr')ht=' ht="32" customHeight="1"';
    else if(kind==='title')ht=' ht="26" customHeight="1"';
    else if(kind==='sect'||kind==='total')ht=' ht="21" customHeight="1"';
    if(kind==='body'&&filled===0){x+=`<row r="${R}"${ht}/>`;return}
    if(kind==='body')zi++;
    x+=`<row r="${R}"${ht}>`;
    for(let j=0;j<ncol;j++){
      const v=r[j];const ref=XL_COL(j)+R;
      let s=XS.def;
      if(kind==='hdr')s=XS.hdr;
      else if(kind==='title')s=XS.title;
      else if(kind==='sub')s=XS.sub;
      else if(kind==='sect')s=XS.sect;
      else if(kind==='total')s=XS.total;
      else if(kind==='note')s=XS.note;
      else{
        const z=zi%2===0;let t=null;
        if(o.tone)t=o.tone(v,i,j,r);if(t===undefined||t===null)t=xlTone(v,hd[j]);
        if(t)s=XS[t+(typeof v==='number'?'c':'')];
        else if(typeof v==='number')s=z?XS.numz:XS.num;
        else s=z?XS.zebra:XS.body;
        if(o.labCol===j&&!t)s=XS.lab;
      }
      if(v==null||v===''){
        if(kind==='title'||kind==='sub'||kind==='note')continue;
        x+=`<c r="${ref}" s="${s}"/>`;
      }else if(typeof v==='number'&&isFinite(v)){x+=`<c r="${ref}" s="${s}"><v>${v}</v></c>`}
      else x+=`<c r="${ref}" s="${s}" t="inlineStr"><is><t xml:space="preserve">${XL_ESC(v)}</t></is></c>`;
    }
    x+=`</row>`;
  });
  x+=`</sheetData>`;
  if(hdr>=0&&o.filter!==false&&rows.length>hdr+1)x+=`<autoFilter ref="A${hdr+1}:${XL_COL(ncol-1)}${rows.length}"/>`;
  (o.merge||[]).forEach(()=>{});
  x+=`<pageMargins left="0.4" right="0.4" top="0.5" bottom="0.5" header="0.3" footer="0.3"/><pageSetup paperSize="9" orientation="landscape" fitToWidth="1" fitToHeight="0"/>`;
  x+=`<headerFooter><oddFooter>&amp;L${XL_ESC(o.footer||'СХЭД · Учёт — ТЕХНОСТАЙЛ')}&amp;RСтр. &amp;P из &amp;N</oddFooter></headerFooter></worksheet>`;
  return x;
}
/* sheets: {имя: aoa | {rows,hdr,...}} → Uint8Array (.xlsx) */
async function xlsxBuild(sheets,opts){
  opts=opts||{};
  const list=[];const used=new Set();
  const nm=n=>{let b=String(n).replace(/[\\\/\?\*\[\]:]/g,'').trim().slice(0,31)||'Лист',k=b,i=2;while(used.has(k.toLowerCase()))k=b.slice(0,28)+' '+(i++);used.add(k.toLowerCase());return k};
  if(opts.readme&&opts.readme.length){
    const rows=[[opts.title||'Как читать этот файл'],[opts.sub||('Сформировано '+fmtD(today())+' · СХЭД · Учёт, ТЕХНОСТАЙЛ')],[]];
    const tones={};
    opts.readme.forEach(l=>{
      if(typeof l==='string')rows.push(['',l]);
      else if(Array.isArray(l)){rows.push([l[0],l[1]]);if(l[2])tones[rows.length-1]=l[2]}
    });
    list.push({name:nm('Как читать'),rows,o:{hdr:-1,plain:true,widths:[24,100],tab:XL_TAB.info,first:true,
      tone:(v,i,j)=>j===0&&tones[i]?tones[i]:null,labCol:0}});
    /* строки readme без заголовка таблицы: оформляем вручную */
    list[0].o.hdr=-1;
  }
  for(const n of Object.keys(sheets)){
    const d=sheets[n];const rows=(Array.isArray(d)?d:d.rows).map(r=>r.map(v=>v instanceof Date?fmtD(v.toISOString().slice(0,10)):v));
    const o=Array.isArray(d)?{}:Object.assign({},d);
    if(o.hdr==null){ /* заголовок — первая строка с ≥2 заполненными ячейками */
      let h=rows.findIndex(r=>r.filter(v=>v!=null&&v!=='').length>=2);o.hdr=h<0?-1:h;
    }
    delete o.rows;
    list.push({name:nm(n),rows,o});
  }
  if(list.length&&!list.some(l=>l.o.first))list[0].o.first=true;
  /* readme: ручная раскладка, т.к. там нет шапки таблицы */
  const parts=[];
  const readmeXml=(rows,o)=>{ // title/sub/подписи
    let x=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetPr><tabColor rgb="FF${XL_TAB.info}"/><pageSetUpPr fitToPage="1"/></sheetPr><sheetViews><sheetView workbookViewId="0" showGridLines="0" tabSelected="1"/></sheetViews><sheetFormatPr defaultRowHeight="15"/><cols><col min="1" max="1" width="26" customWidth="1"/><col min="2" max="2" width="105" customWidth="1"/></cols><sheetData>`;
    rows.forEach((r,i)=>{
      const R=i+1;const ht=i===0?' ht="28" customHeight="1"':'';x+=`<row r="${R}"${ht}>`;
      const cell=(j,v,s)=>{if(v==null||v==='')return;x+=`<c r="${XL_COL(j)}${R}" s="${s}" t="inlineStr"><is><t xml:space="preserve">${XL_ESC(v)}</t></is></c>`};
      if(i===0)cell(0,r[0],XS.title);
      else if(i===1)cell(0,r[0],XS.sub);
      else if(r.length){const t=o.tone(r[0],i,0);if(r[0])cell(0,r[0],t?XS[t]:XS.lab);cell(1,r[1],XS.note)}
      x+=`</row>`;
    });
    return x+`</sheetData><pageMargins left="0.5" right="0.5" top="0.6" bottom="0.6" header="0.3" footer="0.3"/><pageSetup paperSize="9" orientation="landscape" fitToWidth="1" fitToHeight="0"/></worksheet>`;
  };
  list.forEach((l,i)=>parts.push(i===0&&opts.readme&&opts.readme.length?readmeXml(l.rows,l.o):xlSheetXml(l.rows,l.o)));
  const chunks=[];const z=new ZipOut({write:async u=>{chunks.push(u)},close:async()=>{}});
  const NS='http://schemas.openxmlformats.org/';
  await z.add('[Content_Types].xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${list.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`);
  await z.add('_rels/.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${NS}officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`);
  await z.add('xl/workbook.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="${NS}spreadsheetml/2006/main" xmlns:r="${NS}officeDocument/2006/relationships"><bookViews><workbookView activeTab="0"/></bookViews><sheets>${list.map((l,i)=>`<sheet name="${XL_ESC(l.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`);
  await z.add('xl/_rels/workbook.xml.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${list.map((_,i)=>`<Relationship Id="rId${i+1}" Type="${NS}officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${list.length+1}" Type="${NS}officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`);

}

function regFound(it,s){

      if(s==='op')out.push(`Опись, строка ${c.row||'—'} · оригинал: ${c.orig||'—'} · спецификации: ${c.spec||'—'} · допсоглашения: ${c.add||'—'}`);
      if(s==='c1')(c.m1c||[]).forEach(i=>{const x=by(C1,i);if(x)out.push(`${x.num||'без номера'} · ${x.cp} · ${x.date?fmtD(x.date):'без даты'} · ${x.state||''}`)});
      if(s==='sx')(c.msx||[]).forEach(i=>{const x=SXREC[i];if(x)out.push(`${x.num||'без номера'} · ${x.cp} · ${x.date?fmtD(x.date):'без даты'}${x.name?' · '+x.name:''}`)});
      if(s==='ar')(c.docs||[]).forEach(i=>{const d=DOCS[i];if(d)out.push(`${d[9]||d[10]||d[1]}`)});
      if(s==='sb')(c.msb||[]).forEach(i=>{const x=by(SBIS,i);if(x)out.push(`${x.num||'без номера'} · ${x.cp} · ${x.date?fmtD(x.date):'без даты'}`)});
      if(!out.length){const lab=s==='c1'?L1C[c.c1]:s==='sx'?LSX[c.sx]:s==='sb'?LSB[c.sb]:null;if(lab&&it.p[s])out.push(lab[0])}
    }
    return out;
  }
  for(const r of (it.recs||[]).filter(r=>r.src===s)){
    let t=`${r.kind||''} ${r.num?'№ '+r.num:''} ${r.date?'от '+fmtD(r.date):''}`.trim();

}

/* ===== Отчёт по менеджерам и договорам (Excel для руководителей) ===== */
const MR_DEF=[['c1','Нет в 1С'],['sx','Нет в СХЭД'],['sb','Нет в СБИС'],['or','Нет бумажного оригинала'],['mg','Менеджер в 1С другой / не указан']];
const MRO=()=>V.managers.RO=V.managers.RO||{c1:true,sx:true,sb:true,or:true,mg:false,open:true,aud:'mgr'};
/* aud='mgr' — для менеджеров и руководителей: только Опись и 1С (СХЭД, СБИС и архивы не упоминаются); 'all' — для себя */
const mrAll=o=>o.aud==='all';
const mrKeys=o=>MR_DEF.filter(([k])=>mrAll(o)?(k!=='sb'||KPI.sbOn):!['sx','sb'].includes(k));
const mrOn=(o,k)=>!!o[k]&&mrKeys(o).some(x=>x[0]===k);
function mrDefects(c,o){
  const g=gapsOf(c),d={};
  if(mrOn(o,'c1')){const x=g.find(z=>z.s==='c1');if(x)d.c1=x.t}
  if(mrOn(o,'sx')){const x=g.find(z=>z.s==='sx');if(x)d.sx=c.sx==='part'&&(c.sxmiss||[]).length?x.t+': '+c.sxmiss.join('; '):x.t}
  if(mrOn(o,'sb')&&KPI.sbOn){const x=g.find(z=>z.s==='sb');if(x)d.sb=x.t}
  if(mrOn(o,'mg')&&c.k==='o'){const f=c.mgrFix!==undefined;if(!f){if(c.mgrDiff)d.mg='Опись: '+(c.mgrOpis||'—')+' · 1С: '+c.mgrDiff;else if(!c.mgrOpis&&c.mgrSrc!=='1С')d.mg='Менеджер в Описи не указан'+(c.mgrNote?' · в 1С: '+c.mgrNote:'')}}
  if(mrOn(o,'or')){const cl=origClass(c),q=ST.orig[c.key];if(['scan','ours','theirs','none'].includes(cl)&&!(q&&(q.s==='got'||q.s==='na')))d.or=ORIG_L[cl][0]}
  return d;
}
function mrRows(o,only){
  const out=[];
  for(const c of CON){
    if(!inScope(c))continue;const m=mgrOf(c);if(only&&!only.includes(m))continue;
    const d=mrDefects(c,o);if(!Object.keys(d).length)continue;
    if(o.open&&isResolved(c))continue;
    const mk=markOf(c),q=ST.orig[c.key];
    out.push({c,m,d,age:issueAge(c)||0,mk,q});
  }
  return out.sort((a,b)=>b.age-a.age||a.c.y-b.c.y||a.c.cp.localeCompare(b.c.cp,'ru'));
}
const MR_H=['Год','Контрагент','ИНН','№ договора','Дата','Что не так','1С','СХЭД','СБИС','Оригинал','Менеджер: расхождение','Файлы в архивах','Что сделать','Запрос оригинала','Отметка','Комментарий','Дней висит'];
function mrTodo(r,o){
  const {c,d}=r;if(mrAll(o)){const t=todoText(c);return d.mg?(t?t+' | ':'')+'Менеджер: сверить Опись и 1С':t}
  const t=[];if(d.c1){const D=c1Diff(c);t.push('1С: '+(c.todo1c||TODO1C[c.c1]||d.c1)+(D.what?' ['+D.what+']':''))}if(d.mg)t.push('Менеджер: уточнить, кто ведёт договор, и поправить в Описи или в 1С');return t.join(' | ');
}
/* какие колонки оставить: без СХЭД/СБИС/файлов архивов для менеджеров; «Менеджер» только если выбран такой недостаток */
const mrKeep=(o,useAge)=>{const x=[0,1,2,3,4,5,6,9,12,13,14,15];if(mrAll(o))x.push(7,8,11);if(o.mg&&mrOn(o,'mg'))x.push(10);if(useAge)x.push(16);return x.sort((a,b)=>a-b)};
function mrLine(r,o){
  const {c,d,mk,q}=r;
  const why=[d.c1&&'1С',d.sx&&'СХЭД',d.sb&&'СБИС',d.or&&'оригинал',d.mg&&'менеджер'].filter(Boolean).join(', ');
  return [c.y,c.cp,c.inn||'',c.num,fmtD(c.date),why,d.c1||'',d.sx||'',d.sb||'',d.or||'',d.mg||'',(c.docs&&c.docs.length)?'Есть ('+c.docs.length+')':'Нет',mrTodo(r,o),q?.s?ORQ[q.s][0]+(q.s==='asked'&&q.d?' '+fmtD(q.d):''):'',mk?.s?WORK[mk.s][0]:'',mk?.c||'',r.age];
}
function mrSheetName(m,used){
  let n=(m.replace(/[\\\/\?\*\[\]:]/g,'').trim()||'—').slice(0,28),k=n,i=2;
  while(used.has(k.toLowerCase()))k=n.slice(0,26)+' '+(i++);
  used.add(k.toLowerCase());return k;
}
const mrMain=m=>m!=='Не указан'&&(KPI.byMgr[m]?.n||0)>=3;
async function mrReport(o,only){
  const rows=mrRows(o,only);if(!rows.length){toast('По выбранным условиям недостатков нет');return}
  const single=only&&only.length===1;
  const lim=slaLimit(),useAge=rows.some(r=>r.age>0),sel=mrKeys(o).filter(([k])=>mrOn(o,k)).map(x=>x[1]).join(', ');
  const main=managers().filter(m=>mrMain(m)&&rows.some(r=>r.m===m));
  const noMgr=rows.filter(r=>r.m==='Не указан'),odd=rows.filter(r=>r.m!=='Не указан'&&!mrMain(r.m));
  const grp=main.map(m=>[m,rows.filter(r=>r.m===m)]);
  if(single){if(!mrMain(only[0])&&only[0]!=='Не указан')grp.push([only[0],rows])}
  else{if(noMgr.length)grp.push(['Не указан менеджер',noMgr]);if(odd.length)grp.push(['Запись вместо менеджера',odd])}
  const sh=['Менеджер','Всего договоров','С недостатками'];
  const cols=[['c1','Нет в 1С'],['sx','Нет в СХЭД'],['sb','Нет в СБИС'],['or','Нет оригинала'],['mg','Менеджер: Опись ≠ 1С']].filter(([k])=>mrOn(o,k));
  const sum=[[...sh,...cols.map(c=>c[1]),...(useAge?['Висят дольше '+lim+' дн.','Дольше всего, дн.']:[]),'Без недостатков, %']];
  const T=Array(cols.length+4).fill(0);
  for(const [m,R] of grp){
    const tot=m==='Не указан менеджер'?(KPI.byMgr['Не указан']?.n||R.length):m==='Запись вместо менеджера'?Object.keys(KPI.byMgr).filter(x=>x!=='Не указан'&&!mrMain(x)).reduce((a,x)=>a+KPI.byMgr[x].n,0):(KPI.byMgr[m]?.n||R.length);
    const v=[tot,R.length,...cols.map(([k])=>R.filter(r=>r.d[k]).length)];
    if(useAge)v.push(R.filter(r=>r.age>lim).length,Math.max(...R.map(r=>r.age)));
    v.forEach((x,i)=>{T[i]=(useAge&&i===v.length-1)?Math.max(T[i],x):T[i]+x});
    sum.push([m,...v,tot?Math.round((tot-R.length)/tot*100):100]);
  }
  const tv=T.slice(0,sum[0].length-2);
  sum.push(['ИТОГО',...tv,tv[0]?Math.round((tv[0]-tv[1])/tv[0]*100):100]);
  const head=[['Отчёт по менеджерам и договорам — ТЕХНОСТАЙЛ'],['На '+fmtD(today())+' · договоры с '+(ST.settings.from||2022)+' года · учтено: '+sel+(o.open?' · без закрытых и «не нужно»':'')],[]];
  const KP=mrKeep(o,useAge),H=KP.map(i=>MR_H[i]);const line=r=>{const L=mrLine(r,o);return KP.map(i=>L[i])};
  const SH={};
  const stc=new Set(['1С','СХЭД','СБИС','Оригинал','Менеджер: расхождение']);
  const add=(name,aoa,hdrRow,widths)=>{
    const hh=aoa[hdrRow];
    SH[name]={rows:aoa,hdr:hdrRow,widths,tone:(v,i,j)=>{if(i>hdrRow&&v&&typeof v==='string'&&stc.has(hh[j]))return /проверить|расхожд|част|не хватает/i.test(v)?'warn':'bad';return null}};
  };
  const W=[{wch:6},{wch:36},{wch:13},{wch:20},{wch:11},{wch:22},{wch:24},{wch:34},{wch:22},{wch:24},{wch:30},{wch:14},{wch:50},{wch:20},{wch:12},{wch:30},{wch:9}].filter((_,i)=>KP.includes(i));
  if(!single){
    add('Сводка',[...head,...sum],3,[{wch:28},...Array(sum[0].length-1).fill({wch:16})]);
    add('Все договоры',[...head,['Менеджер',...H],...rows.map(r=>[mgrLabel(r.c)||r.m,...line(r)])],3,[{wch:22},...W]);
  }
  const SIX=mgrSugIdx();const sgT=c=>{const x=mgrSuggest(c,SIX);return x?x.m+(x.conf==='high'?'':' (проверить)'):'—'};
  const used=new Set(['сводка','все договоры']);
  for(const [m,R] of grp){
    const odd2=m==='Запись вместо менеджера',noM=m==='Не указан менеджер';
    const hh=odd2?['В поле «Менеджер» указано',...H]:noM?['Возможный менеджер (предположение)',...H]:H,ww=odd2?[{wch:30},...W]:noM?[{wch:26},...W]:W;
    add(mrSheetName(m,used),[['Менеджер: '+m+' — договоров с недостатками: '+R.length],head[1],[],hh,...R.map(r=>odd2?[r.m,...line(r)]:noM?[sgT(r.c),...line(r)]:line(r))],3,ww);
  }
  const nm=single?'Менеджер_'+only[0].replace(/[^\wА-яЁё]+/g,'_'):'По_менеджерам';
  await exportXLSX(nm+'_'+today()+'.xlsx',SH,{title:'Как читать — отчёт по менеджерам и договорам',readme:[
    ['Что это','Какие договоры не сведены и у кого. Подробный список на каждого менеджера — на его листе.'],
    ['Сводка','Сколько договоров у каждого менеджера, сколько из них с недостатками и каких именно.'],
    ['Красный','Договора нет там, где он должен быть — нужно догрузить или завести.','bad'],
    ['Жёлтый','Данные есть, но не совпадают — нужно проверить.','warn'],
    ['Что сделать','Конкретное действие по договору. Исправьте и сообщите бухгалтеру — в следующем отчёте строка исчезнет.'],
    ['Фильтр','В шапке каждой таблицы включён фильтр: можно отобрать свои договоры, год или недостаток.']]});
  logAct('Отчёт для руководителей: '+(single?only[0]:grp.length+' листов')+', договоров '+rows.length);
  toast('Файл сформирован: '+rows.length+' '+plural(rows.length,'договор','договора','договоров'));
}

const c1Rec=x=>'№ '+(x.num||'без номера')+(x.date?' от '+fmtD(x.date):'')+' · '+x.cp+(x.state?' ('+x.state+')':'');
function c1Diff(c){
  const recs=(c.m1c||[]).map(i=>C1.find(x=>x.i===i)||C1[i]).filter(Boolean);
  const op='№ '+(c.num||'—')+(c.date?' от '+fmtD(c.date):'')+' · '+c.cp;
  const L=recs.slice(0,4).map(c1Rec).join('\n')+(recs.length>4?'\n…и ещё '+(recs.length-4):'');
  const dts=[...new Set(recs.map(x=>x.date?fmtD(x.date):'без даты'))].join(', ');
  const nums=[...new Set(recs.map(x=>x.num||'без номера'))].join(', ');
  const cps=[...new Set(recs.map(x=>x.cp))].join('; ');
  let what='';
  switch(c.c1){
    case'datediff':what='Дата: в Описи '+fmtD(c.date)+', в 1С '+dts;break;
    case'cpdate':what='Номер: в Описи «'+(c.num||'—')+'», в 1С «'+nums+'»';break;
    case'numoth':what='Номер «'+(c.num||'—')+'» в 1С записан за другим контрагентом: в Описи '+c.cp+', в 1С '+cps;break;
    case'generic':what='В 1С у контрагента только «Основной договор»; договора № '+(c.num||'—')+(c.date?' от '+fmtD(c.date):'')+' нет';break;
    case'closed':what='В 1С договор есть, но в состоянии «Закрыт»';break;
    case'dup':what='В 1С несколько записей этого договора — оставить одну';break;

    case'nocp':what='Контрагента «'+c.cp+'» в 1С нет';break;
    case'none':what='Договора нет в 1С';break;
    default:what='';

  return{opis:op,c1:L||'—',what};

}
function sxdExtraRows(){

function parseAttName(fn){
  const base=fn.replace(/\.[a-z0-9]+$/i,'');
  const kind=/дополнительн\w*\s+соглашен|^дс\b/i.test(base)?'Допсоглашение':/специфик/i.test(base)?'Спецификация':/бланк.?заказ/i.test(base)?'Бланк-заказ':/заявк/i.test(base)?'Заявка':/приложен/i.test(base)?'Приложение':/заказ/i.test(base)?'Заказ':'Приложение';
  const head=base.split(/\s+к\s+договор/i)[0];
  const an=(head.match(/№\s*([^\s,;()]+)/)||[])[1]||'';
  const dt=(base.match(/от\s*(\d{1,2}\.\d{2}\.\d{4})/)||base.match(/(\d{2}\.\d{2}\.\d{4})/)||[])[1]||'';
  const cn=(base.match(/к\s+договор\w*\s*№\s*(.+?)(?:\s+[—–-]\s+|\s*\(вх|\s*\[|$)/i)||[])[1]||'';
  let cp=(base.match(/\s[—–]\s([^[(—–]+?)\s*(?:\(вх\.?\)|\(исх\.?\)|\[|$)/)||[])[1]||'';
  return{kind,anum:an,date:dt?fmtDisp2iso(dt):'',cnum:cn.trim(),ccp:cp.trim(),title:head.trim()||base,file:fn};
}
const fmtDisp2iso=d=>{const m=d.match(/(\d{1,2})\.(\d{2})\.(\d{4})/);return m?m[3]+'-'+m[2]+'-'+pad(+m[1]):''};

/* сохранённая страница СХЭД (ds.nordfox.ru/tree): список «Все документы» внизу */
async function importSxedHtml(file,opts){
  try{
    toast('Читаю страницу…','info',1500);
    const html=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsText(file,'utf-8')});
    const doc=new DOMParser().parseFromString(html,'text/html');
    const innBy=new Map();
    doc.querySelectorAll('span').forEach(sp=>{const t=sp.textContent||'';if(t.startsWith('📁')){const cp=t.replace('📁','').trim();const n=sp.nextElementSibling;const m=n&&/ИНН\s*(\d{10,12})/.exec(n.textContent||'');if(m)innBy.set(cp,m[1])}});
    const lis=[...doc.querySelectorAll('li')].filter(li=>li.querySelector('a[href*="/documents/"]'));
    const cnt=/Показано:\s*(\d+)\s*из\s*(\d+)/.exec(doc.body.textContent||'');
    const out=[];
    for(const li of lis){
      const ds=li.querySelectorAll('a[href*="/documents/"] div');
      const title=(li.querySelector('.font-medium')||{}).textContent?.trim()||'';
      const cp=(li.querySelector('.text-xs.text-gray-500.truncate')||{}).textContent?.trim()||'';
      if(!title)continue;
      const attrs={};li.querySelectorAll('span > span.text-gray-400').forEach(s=>{const k=s.textContent.replace(/:\s*$/,'').trim().toLowerCase();attrs[k]=(s.parentElement.textContent||'').replace(s.textContent,'').trim()});
      const rest=(cp&&title.startsWith(cp)?title.slice(cp.length):title).trim();
      const m=/^Договор\s+(ИСХ|ВХ)\s*(?:№\s*)?(.*?)\s*от\s+(\d{4}-\d\d-\d\d)\s*$/i.exec(rest)||/^(.*?)\s+(ИСХ|ВХ)\s*(?:№\s*)?(.*?)\s*от\s+(\d{4}-\d\d-\d\d)\s*$/i.exec(rest);
      let num='',date=null,dir='';
      if(m){const g=m.length===4?[m[1],m[2],m[3]]:[m[2],m[3],m[4]];dir=g[0];num=g[1].trim();date=g[2]}
      const state=(li.querySelector('span.rounded.text-xs')||{}).textContent?.trim()||'';
      const a=li.querySelector('a[href*="/documents/"]');
      out.push({i:out.length,num,name:title,cp,state,date,generic:num?0:1,inn:innBy.get(cp)||'',type:'Договор',y:date?+date.slice(0,4):null,ctype:attrs['тип договора']||'',subj:attrs['предмет договора (кратко)']||'',dir:attrs['направление']||(dir==='ВХ'?'входящий':dir==='ИСХ'?'исходящий':''),role:attrs['роль общества']||'',warn:/Требует внимания/.test(li.innerHTML)?1:0,link:a?a.href:''});
    }
    if(!out.length)throw new Error('В файле не нашла список договоров. Сохраните страницу «Дерево» ds.nordfox.ru целиком (Ctrl+S → «Веб-страница, полностью»).');
    openModal(`<h3>СХЭД: список договоров со страницы</h3><p>Найдено договоров: <b>${num(out.length)}</b>${cnt?` (на странице всего документов: ${cnt[2]}, остальные — не договоры)`:''}. С ИНН: ${num(out.filter(x=>x.inn).length)}. Входящих ${num(out.filter(x=>x.dir==='входящий').length)}, исходящих ${num(out.filter(x=>x.dir==='исходящий').length)}.</p>
    <div class="row end"><button class="btn" id="sh-c">Отмена</button><button class="btn pri" id="sh-ok">Загрузить</button></div>`,m=>{
      m.querySelector('#sh-c').onclick=()=>{closeModal();if(opts&&opts.cancel)opts.cancel()};
      m.querySelector('#sh-ok').onclick=()=>{const before={...KPI};ST.uploads.sxed={ts:nowTs(),name:file.name,n:out.length,rows:out,shown:cnt?+cnt[1]:0,total:cnt?+cnt[2]:0};ST.uploads={...ST.uploads};logAct(`Загружено: СХЭД — ${out.length} договоров со страницы (${file.name})`);touch();buildAll();closeModal();if(opts&&opts.done){opts.done();if(opts.auto)return}toast(`Загружено ${num(out.length)} договоров. Сверка пересчитана.`,'ok',5000);uploadSummary('sxed',before)};
      if(opts&&opts.auto)setTimeout(()=>m.querySelector('#sh-ok').click(),30);
    });
  }catch(e){console.error(e);toast(e.message||'Не удалось прочитать страницу','bad',8000);document.body.classList.remove('quiet');if(opts&&opts.cancel)opts.cancel()}
}

/* универсальный список: поиск, фильтры, сортировка, страницы, Excel */
function listView(host,cfg){
  const S=LVS[cfg.id]=LVS[cfg.id]||{q:'',f:{},sort:cfg.sort||null,dir:cfg.dir||1,page:0};
  const sel=cfg.filters||[];
  host.innerHTML=`<div class="lvbar"><div class="fsearch lvq">${ic('search',16)}<input class="lvs" placeholder="${esc(cfg.ph||'Поиск по контрагенту, номеру…')}" value="${esc(S.q)}"></div>${sel.map(f=>`<select class="inp lvf" data-k="${f.k}"><option value="">${esc(f.l)}: все</option>${f.opts.map(([v,l])=>`<option value="${esc(v)}" ${String(S.f[f.k]??'')===String(v)?'selected':''}>${esc(l)}</option>`).join('')}</select>`).join('')}${cfg.noExport?'':`<button class="btn lvx">${ic('dl',15)} Excel</button>`}${cfg.bar||''}</div><div class="lvinfo muted sm"></div><div class="tscroll lvt"></div><div class="lvp"></div>`;
  const rows=()=>{
    const q=S.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
    let r=cfg.rows().filter(x=>{
      for(const f of sel){const v=S.f[f.k];if(v!==undefined&&v!==''&&!f.f(x,v))return false}
      if(q.length){const h=cfg.search(x).toLowerCase();if(!q.every(w=>h.includes(w)))return false}
      return true});
    if(S.sort){const c=cfg.cols.find(c=>c.k===S.sort);if(c&&c.v){r=r.map(x=>[c.v(x),x]).sort((a,b)=>{let p=a[0],q=b[0];if(p==null||p==='')p=S.dir>0?'￿':'';if(q==null||q==='')q=S.dir>0?'￿':'';return(p>q?1:p<q?-1:0)*S.dir}).map(x=>x[1])}}
    return r;
  };
  const paint=()=>{
    const all=rows();const size=cfg.size||50;if(S.page*size>=all.length)S.page=0;const pg=all.slice(S.page*size,S.page*size+size);
    $('.lvinfo',host).innerHTML=cfg.info?cfg.info(all):`<b>${num(all.length)}</b> ${plural(all.length,'запись','записи','записей')}`;
    $('.lvt',host).innerHTML=`<table class="tbl"><thead><tr>${cfg.cols.map(c=>`<th ${c.v?`data-s="${c.k}"`:''} class="${S.sort===c.k?'sorted':''} ${c.cls||''}">${c.l}${S.sort===c.k?(S.dir>0?' ▲':' ▼'):''}</th>`).join('')}</tr></thead><tbody>${pg.map((r,i)=>`<tr data-i="${i}" class="${cfg.rowCls?cfg.rowCls(r):''}">${cfg.cols.map(c=>`<td class="${c.cls||''}">${c.h(r)}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${cfg.cols.length}" class="empty">${cfg.empty||'Ничего не найдено.'}</td></tr>`}</tbody></table>`;
    $('.lvp',host).innerHTML=pagerHTML(all.length,S.page,size);bindPager($('.lvp',host),p=>{S.page=p;paint()});
    $$('th[data-s]',host).forEach(t=>t.onclick=()=>{const k=t.dataset.s;if(S.sort===k)S.dir*=-1;else{S.sort=k;S.dir=1}paint()});
    $$('tbody tr[data-i]',host).forEach(t=>t.onclick=e=>{if(e.target.closest('input,select,button,a,[data-opd]'))return;if(cfg.onRow)cfg.onRow(pg[+t.dataset.i],t)});
    if(cfg.after)cfg.after(host,pg,paint);
    host._rows=all;
  };
  $('.lvs',host).oninput=debounce(e=>{S.q=e.target.value;S.page=0;paint()},200);
  $$('.lvf',host).forEach(s=>s.onchange=()=>{S.f[s.dataset.k]=s.value;S.page=0;paint()});
  const x=$('.lvx',host);if(x)x.onclick=()=>{const all=rows();exportXLSX((cfg.file||'Список')+'_'+today()+'.xlsx',{[cfg.sheet||'Список']:[cfg.cols.filter(c=>!c.noX).map(c=>stripHtml(c.l)),...all.map(r=>cfg.cols.filter(c=>!c.noX).map(c=>c.x?c.x(r):stripHtml(c.h(r))))]}).then(()=>toast('Файл сформирован'))};
  paint();return{paint,rows};
}

const safeName=s=>String(s||'').replace(/[\\\/:*?"<>|]+/g,'_').replace(/\s+/g,' ').trim().replace(/[. ]+$/,'').slice(0,120);
const COPYRX=/\s\(\d+\)(\.[a-z0-9]+)$/i;
/* папки с договорами в архивах: в одной папке лежат договор и все его приложения (спецификации, допсоглашения, протоколы) */
let _fi=null;
const dirOf=p=>String(p).replace(/\/[^\/]*$/,'');
function folderIndex(){
  if(_fi)return _fi;
  const byDir=new Map();
  DOCS.forEach((d,i)=>{const p=String(d[9]||'');if(!/Договоры и документы к ним/.test(p))return;const k=dirOf(p);let a=byDir.get(k);if(!a)byDir.set(k,a=[]);a.push(i)});
  const list=[];
  for(const [dir,ids] of byDir){
    const base=dir.split('/').pop();const m=base.match(/^(.*?)\s+[—–-]\s+№\s*(.*?)(?:\s+от\s+(\d\d\.\d\d\.\d{4}))?(?:\s*\(.*\))?$/);
    if(!m)continue;list.push({dir,ids,cp:m[1],num:nn(m[2]),ck:cpk(m[1]),tk:toks(m[1])});
  }
  return _fi={byDir,list};
}
function folderDirs(c){
  const F=folderIndex();const dirs=new Set((c.docs||[]).map(i=>dirOf(DOCS[i][9])));
  const n=nn(c.num);
  if(n)for(const f of F.list){if(f.num!==n)continue;if(tokmatch(tkOf(c),f.tk)||cpmatchK(ckOf(c),f.ck))dirs.add(f.dir)}
  return [...dirs].filter(d=>F.byDir.has(d));
}
/* файлы одного договора: основные документы из архивов + приложения к входящим */
function contractFiles(c,opt={}){
  const items=[];const seen=new Set();
  let idx=(c.docs||[]).slice();
  if(c.k==='o'&&c.sx==='part'&&!opt.all)idx=idx.filter(i=>!String(DOCS[i][1]).startsWith('Договор')); // в СХЭД договор уже есть — нужны только приложения
  const paths=new Set(idx.map(i=>DOCS[i][9]));
  const folder=(c.y??'без года')+'/'+safeName(`${c.cp} — № ${c.num||'без номера'}${c.date?' от '+fmtD(c.date):''}`);
  for(const i of idx){
    const d=DOCS[i];if(seen.has(i))continue;seen.add(i);
    if(opt.skipCopies!==false&&COPYRX.test(d[9])&&paths.has(d[9].replace(COPYRX,'$1')))continue;
    items.push({path:folder+'/'+safeName(d[9].split('/').pop()),rel:d[9],src:d[11],alts:[d[10]],kind:d[1]});
  }
  // приложения, лежащие в архиве рядом с договором (спецификации, допсоглашения, протоколы и др.)
  try{
    const have=new Set(items.map(x=>x.rel));
    for(const dir of folderDirs(c)){
      const ids=folderIndex().byDir.get(dir);const ps=new Set(ids.map(i=>DOCS[i][9]));
      for(const i of ids){
        const d=DOCS[i];if(seen.has(i)||have.has(d[9]))continue;
        if(String(d[1]).startsWith('Договор')&&String(d[1])!=='Договор (не поставка)'&&!(c.docs||[]).includes(i))continue; // чужой договор в той же папке
        if(String(d[1]).startsWith('Договор'))continue;
        if(opt.skipCopies!==false&&COPYRX.test(d[9])&&ps.has(d[9].replace(COPYRX,'$1')))continue;
        seen.add(i);have.add(d[9]);
        items.push({path:folder+'/'+safeName(d[9].split('/').pop()),rel:d[9],src:d[11],alts:[d[10]],kind:d[1]});
      }
    }
  }catch(e){console.error(e)}
  // приложения к входящим договорам этого контрагента и номера
  try{
    for(const g of allAtt()){
      if(nn(g.num)!==nn(c.num)||!cpmatchK(cpk(g.cp),cpk(c.cp)))continue;
      if(g.sver&&g.sver!=='Нет в СХЭД')continue;
      for(const a of g.atts){if(!a.part||!a.path||items.some(x=>x.rel===a.path))continue;items.push({path:folder+'/'+safeName(a.path.split('/').pop()),rel:a.path,src:'Приложения_к_входящим_договорам_часть'+a.part,alts:[a.file].filter(Boolean),kind:'Приложение'})}
    }
  }catch(e){}
  return{folder,items};
}
function packSet(O){
  const out=[];
  for(const c of CON){
    if(O.mode==='open'){
      if(c.k!=='o'||!isOpen(c))continue;
      if(O.mgr&&mgrOf(c)!==O.mgr)continue;
    }else{
      if(c.k==='o'){if(!inScope(c)||(c.sx!=='arch'&&c.sx!=='part'&&!(O.no&&c.sx==='no')))continue}
      else{if(!O.extra||!(c.docs&&c.docs.length))continue}
    }
    const f=contractFiles(c,{...O,all:O.mode==='open'});
    out.push({c,files:f.items,folder:f.folder});
  }
  return out;
}

async function makePack(L,fileName,top,label){

  for(const x of L)for(const f of x.files){const p=(top?safeName(PK_BY[V.pack.O.by][1](x.c))+'/':'')+f.path;items.push({...f,path:p});csv.push([x.folder,x.c.cp,x.c.num,fmtD(x.c.date),mgrLabel(x.c),todoText(x.c),f.path.split('/').pop()])}
  const csvText='﻿'+csv.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');
  let bar;

  }catch(e){closeModal();if(e&&e.name==='AbortError')return;console.error(e);toast('Не удалось собрать пакет: '+(e.message||e),'bad',8000)}
}

/* ---------- дедупликация ---------- */
function inFind(q){
  const R=reg(),items=R.items[q.g]||[],rq=mkRec('q',q.g,q);const ex=[],like=[],cps=[];
  for(const it of items){
    const r=mkRec('q',q.g,{cp:it.cp,inn:it.inn,num:it.num,date:it.date,y:it.y});const sc=sameCpR(rq,r);
    if(q.g==='spec'){if(sc)cps.push(it);continue}
    if(!sc){if(rq.k&&r.k&&r.k===rq.k)like.push({it,why:'тот же номер, но другой контрагент'});continue}
    if(rq.k){
      if(r.k===rq.k){if(!rq.date||!r.date||rq.date===r.date)ex.push(it);else like.push({it,why:'тот же номер и контрагент, другая дата — возможно, новая редакция'})}
      else if(rq.date&&r.date===rq.date)like.push({it,why:'тот же контрагент и дата, но другой номер — возможна опечатка'});
    }else if(rq.date&&r.date===rq.date&&(!rq.kind||!r.k))ex.push(it);
  }
  return{ex,like,cps};
}
function inWhere(it){ // где конкретно лежит: строки для показа
  const out=[];
  if(it.con){const c=CONMAP.get(it.con);if(c){
    if(c.docs&&c.docs.length)out.push('Архивы: '+(DOCS[c.docs[0]]?DOCS[c.docs[0]][9]:'')+(c.docs.length>1?` (+ ещё ${c.docs.length-1})`:''));
    if(c.sxw)out.push('Откуда в архивах: '+c.sxw);
    if(c.m1c&&c.m1c.length){const r=C1.find(x=>x.i===c.m1c[0]);if(r)out.push('1С: '+(r.name||r.num)+(r.state?' ('+r.state+')':''))}
  }}
  for(const r of it.recs||[]){
    if(r.src==='ar'&&typeof r.ref==='number'&&DOCS[r.ref])out.push('Архивы: '+DOCS[r.ref][9]);
    else if(r.extra&&['sx','c1','sb'].includes(r.src))out.push(SRCN[r.src]+': '+r.extra);
  }
  return [...new Set(out)].slice(0,4);
}
function inVerdict(M,nm){
  const main=M.parts[0],ms=nm[0];const mp=M.parts.find(p=>IN_ISMAIN(p.type))||M.parts[0];
  const cpP=inCp(M);const out=[];
  const grpOf=t=>docGroup(t)||'oth';

    const g=grpOf(p.type),ref=n.ref;
    const q=IN_FAMILY(p.type)&&!IN_ISMAIN(p.type)?{g:'spec',kind:p.type,cp:inFull(cpP),inn:cpP&&cpP.inn,num:p.num,date:p.date}:
      {g,kind:p.type,cp:inFull(cpP),inn:cpP&&cpP.inn,num:p.num,date:p.date};
    if(!p.num&&!p.date&&!cpP)return{part:p,n,g,v:'unk',txt:'Номер, дата и контрагент не заполнены — проверять не по чему. Заполните поля выше (или вставьте текст документа).',p:null,best:null,like:[],lines:[]};
    const f=inFind(q);let v='new',best=null,txt='',lines=[];
    if(g==='spec'||(IN_FAMILY(p.type)&&!IN_ISMAIN(p.type))){
      /* спецификации и допсоглашения: сверка по контрагенту + документ-основание */
      const par=inFind({g:'dog',kind:'Договор',cp:inFull(cpP),inn:cpP&&cpP.inn,num:ref.num,date:ref.date});
      const pb=par.ex[0]||null;

      else pv='Договор-основание не найден ни в одном источнике — возможно, его надо добавить в Опись.';

      else{v='known';txt='Запись есть ('+(['op','c1','sb'].filter(s=>pp[s]===1||pp[s]===2).map(s=>SRCN[s]).join(', '))+'), файла в СХЭД нет — загружайте.'}
      lines=inWhere(best);
      const dirs=new Set();if(best.con){const c=CONMAP.get(best.con);if(c)(c.docs||[]).forEach(i=>DOCS[i]&&DOCS[i][5]&&dirs.add(DOCS[i][5]))}else(best.recs||[]).forEach(r=>r.src==='ar'&&r.dir&&dirs.add(r.dir));

/* ===== Новый тип документа: схема по образцам (атрибуты, значения, промпт) ===== */
const SC_MON=/(января|февраля|марта|апреля|мая|июня|июля|августа|сентября|октября|ноября|декабря)/i;
const scNorm=s=>String(s||'').toLowerCase().replace(/ё/g,'е').replace(/[«»"'“”]/g,'').replace(/\s+/g,' ').replace(/[\s:;.,]+$/,'').trim();
const scCap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
const scIsDate=v=>/^\d{1,2}\.\d{2}\.\d{2,4}(\s*г\.?)?$/.test(v)||(/^[«"“]?\d{1,2}[»"”]?\s+/.test(v)&&SC_MON.test(v)&&/\d{4}/.test(v));
const scIsOrg=v=>/(^|\s)(ООО|АО|ПАО|ЗАО|ИП|НАО)(\s|$)|«/.test(v);
const scIsPerson=v=>/^[А-ЯЁ][а-яё]+(-[А-ЯЁ][а-яё]+)?\s+[А-ЯЁ]\.\s?([А-ЯЁ]\.)?$/.test(v)||/^[А-ЯЁ][а-яё]+\s+[А-ЯЁ][а-яё]+\s+[А-ЯЁ][а-яё]+$/.test(v);
function scKind(vals){
  const V=vals.map(x=>String(x).trim()).filter(Boolean);if(!V.length)return 'Свободный текст';
  const share=f=>V.filter(f).length/V.length;
  if(share(scIsDate)>=.7)return 'Дата (ДД.ММ.ГГГГ)';
  if(share(v=>/^(\d{10}|\d{12})$/.test(v))>=.7)return 'ИНН (10 или 12 цифр)';
  if(share(v=>/^\d[\d\s]*[,.]\d{2}(\s*(руб\S*|₽|р\.))?$/.test(v))>=.7)return 'Сумма (число с копейками)';
  if(share(v=>/^\d+([,.]\d+)?\s*%$/.test(v))>=.7)return 'Процент';
  if(share(scIsPerson)>=.6)return 'ФИО';
  if(share(scIsOrg)>=.6)return 'Организация';
  const d=new Set(V.map(scNorm));
  if(V.length>=3&&d.size<=8&&d.size*2<=V.length)return 'Список значений';
  if(share(v=>/^[\wА-Яа-яЁё\-\/.№]{1,40}$/.test(v)&&/\d/.test(v))>=.7)return 'Номер / идентификатор';
  return 'Свободный текст';
}
function scPairs(pages){
  const out=[];
  pages.forEach((t,pi)=>{
    t.split('\n').forEach((ln,li)=>{
      ln=ln.trim();if(!ln||ln.length>260)return;
      let m=ln.match(/^([А-ЯЁA-Z][А-Яа-яЁёA-Za-z0-9 ()\/.\-№,]{2,55}?)\s*[:：]\s*(\S.{0,200})$/);
      if(m&&m[1].split(/\s+/).length<=7&&!/^\d+$/.test(m[1])){out.push([m[1].trim(),m[2].trim(),pi+1,li]);return}
      const parts=ln.split(/\s{3,}/);
      if(parts.length===2&&parts[0].length<50&&parts[1].length<140&&!/\d{4,}/.test(parts[0])&&/^[А-ЯЁA-Z]/.test(parts[0])&&parts[0].split(/\s+/).length<=6)out.push([parts[0].trim(),parts[1].trim(),pi+1,li]);
    });
  });
  return out;
}
function scTitle(pages){
  const L=(pages[0]||'').split('\n').map(s=>s.trim()).filter(Boolean).slice(0,3);
  let t=L[0]||'';if(t.length<12&&L[1])t+=' '+L[1];
  return t.replace(/\s*(№|N°?)\s*\S+.*$/,'').replace(/\s+от\s+\d.*$/i,'').replace(/\d{1,2}\.\d{2}\.\d{2,4}.*$/,'').trim().slice(0,120);
}
function scHeads(pages){
  const set=new Set();
  pages.forEach(t=>t.split('\n').forEach(ln=>{ln=ln.trim();
    if(/^(\d{1,2}\.\s*)?[А-ЯЁ][А-ЯЁ \-,]{5,70}$/.test(ln)||/^\d{1,2}\.\s+[А-ЯЁ][а-яё ,\-]{3,60}$/.test(ln))set.add(scNorm(ln.replace(/^\d{1,2}\.\s*/,'')))}));
  return [...set];
}
function scPhrases(pages){
  const set=new Set();
  pages.forEach(t=>t.split('\n').forEach(ln=>{ln=scNorm(ln.replace(/\d+/g,'#'));if(ln.length>=15&&ln.length<=110&&!/#.*#.*#/.test(ln))set.add(ln)}));
  return [...set];
}
function scSample(name,pages){
  const M=inAnalyze(pages);const flat=pages.join(' ');
  return{name,pages:pages.length,M,title:scTitle(pages),pairs:scPairs(pages),heads:scHeads(pages),phr:scPhrases(pages),len:flat.length,
    cp:inCp(M),ts:inTs(M),th:inThird(M),dir:inDir(M)};
}
const SC_CORE=[
  ['Номер документа','id',s=>s.M.num,{star:1,dd:1}],
  ['Дата документа','date',s=>inD(s.M.date),{star:1,dd:1}],
  ['Направление','dir',s=>s.dir==='out'?'Исходящий':s.dir==='in'?'Входящий':'',{star:1}],
  ['Контрагент','org',s=>s.cp?inFullQ(s.cp):'',{star:1}],
  ['ИНН контрагента','inn',s=>s.cp?s.cp.inn:'',{star:1,dd:1}],
  ['Роль контрагента','role',s=>s.cp?s.cp.role:'',{}],
  ['Роль ТЕХНОСТАЙЛ','role',s=>s.ts?s.ts.role:'',{}],
  ['Третья сторона','org',s=>s.th?inFullQ(s.th):'',{star:1,opt:1}],
  ['ИНН третьей стороны','inn',s=>s.th?s.th.inn:'',{star:1,opt:1}],
  ['Роль третьей стороны','role',s=>s.th?s.th.role:'',{opt:1}],
  ['Основной договор: номер','id',s=>s.M.parent.num,{star:1,opt:1}],
  ['Основной договор: дата','date',s=>inD(s.M.parent.date),{opt:1}],
  ['Сумма документа','money',s=>s.M.amount,{opt:1}],
  ['Срок действия','text',s=>s.M.term,{opt:1}],
  ['Вид подписи','sign',s=>s.M.sign?(/ЭЦП/.test(s.M.sign)?'ЭЦП':s.M.sign):'',{opt:1}]
];
function scAnalyze(S){
  const N=S.files.length,A={n:N,fields:[]};
  if(!N)return A;
  /* подвиды по заголовку */
  const tc=new Map();S.files.forEach(s=>{const k=scNorm(s.title.replace(/\d+/g,'')),e=tc.get(k)||{title:s.title,n:0,ex:s.name};e.n++;tc.set(k,e)});
  A.sub=[...tc.values()].sort((a,b)=>b.n-a.n);
  A.title=A.sub[0]?A.sub[0].title:'';
  /* общая структура */
  const cnt=(key)=>{const m=new Map();S.files.forEach(s=>new Set(s[key]).forEach(x=>m.set(x,(m.get(x)||0)+1)));return m};
  const minDocs=N>=3?Math.ceil(N*.5):N;
  A.heads=[...cnt('heads')].filter(([,c])=>c>=Math.max(2,minDocs)||N<2).sort((a,b)=>b[1]-a[1]).slice(0,25);
  A.phrases=N>=3?[...cnt('phr')].filter(([,c])=>c>=Math.ceil(N*.6)).sort((a,b)=>b[1]-a[1]).slice(0,10):[];
  /* стандартные поля */
  for(const [name,kind,get,fl] of SC_CORE){
    const vals=S.files.map(s=>{try{return String(get(s)||'').trim()}catch(e){return ''}});
    const filled=vals.filter(Boolean).length;
    if(fl.opt&&filled===0)continue;
    A.fields.push(scField(S,{name,core:1,kind,vals,filled,star:!!fl.star,dd:!!fl.dd,where:kind==='sign'?'штамп ЭДО или подписи в конце документа':kind==='inn'||kind==='org'||kind==='role'?'преамбула и раздел «Реквизиты сторон»':'шапка документа (первая страница)'}));
  }
  /* поля по подписям «Подпись: значение» */
  const by=new Map();
  S.files.forEach((s,i)=>{const seen=new Set();for(const [l,v,p] of s.pairs){const k=scNorm(l);if(!k||seen.has(k))continue;seen.add(k);const e=by.get(k)||{label:l,docs:new Map(),pages:[],forms:new Map()};e.docs.set(i,v);e.pages.push(p);e.forms.set(l,(e.forms.get(l)||0)+1);by.set(k,e)}});
  const need=N>=3?Math.max(2,Math.ceil(N*.3)):1;
  const coreNames=new Set(SC_CORE.map(c=>scNorm(c[0])).concat(['инн','номер','дата']));
  const lab=[...by.entries()].filter(([k,e])=>e.docs.size>=need&&!coreNames.has(k)).sort((a,b)=>b[1].docs.size-a[1].docs.size).slice(0,22);

function scInstr(f,A){
  let t=`Где искать: ${f.where}.`;
  t+=` Тип данных: ${f.type}.`;
  if(SC_ERR[f.name])t+=' '+SC_ERR[f.name];
  else{
    t+=` Бери значение из строки «${f.labels[0]||f.name}: …».`;
    if(f.type==='Дата (ДД.ММ.ГГГГ)')t+=' Формат ДД.ММ.ГГГГ.';
    if(f.type.startsWith('Сумма'))t+=' Число с копейками, без символа валюты.';
  }
  if(f.enum.length)t+=' Допустимые значения: '+f.enum.map(e=>'«'+e[0]+'»').join(', ')+'. Если в документе другое значение — запиши его как есть и не подгоняй под список.';
  else if(f.ex.length)t+=' Примеры из образцов: '+f.ex.map(e=>'«'+e+'»').join('; ')+'.';
  t+=' Если значения в документе нет — «Не указано».';
  return t;
}
function scPrompt(S,A){
  const nm=S.name||A.title||'документ';

  const L=[];
  L.push(`Ты — модуль извлечения атрибутов в системе СХЭД. Документ: «${nm}».`);
  L.push('');
  L.push('ОБЩИЕ ПРАВИЛА');
  L.push('1. Извлекай только то, что явно указано в документе. Ничего не домысливай и не вычисляй.');
  L.push('2. Если значения нет — пиши «Не указано» (не пустую строку, не null, не N/A).');
  L.push('3. Даты — ДД.ММ.ГГГГ. Суммы — число с копейками без символа валюты. Названия организаций — «ООО «Название»».');
  L.push('4. «Входящий» / «Исходящий» определяется только по роли ТЕХНОСТАЙЛ (см. поле «Направление»).');
  L.push('5. Если два места в документе противоречат друг другу — бери значение из шапки/преамбулы и добавь пометку в поле «Комментарий».');
  if(A.sub&&A.sub.length>1){L.push('');L.push('ПОДВИДЫ (определи по заголовку): '+A.sub.map(s=>'«'+s.title+'»').join('; ')+'.')}
  if(A.phrases&&A.phrases.length){L.push('');L.push('ПРИЗНАКИ ТИПА (постоянные фразы в образцах): '+A.phrases.slice(0,6).map(p=>'«'+p[0]+'»').join('; ')+'.')}
  L.push('');L.push('ПОЛЯ');
  F.forEach((f,i)=>{
    L.push(`${i+1}. ${f.name}${f.star?' ★ КЛЮЧЕВОЙ':''}${f.dd?' 🔵 ДЕДУПЛИКАЦИЯ':''}`);
    L.push('   '+(f.extra?(f.instr||'Извлеки значение по названию поля.')+' Если нет — «Не указано».':(f.instr||scInstr(f,A))));
  });

  return L.join('\n');
}

async function stDetect(file){
  const ext=(file.name.split('.').pop()||'').toLowerCase();

  if(ext==='mxl'){

async function nodeToPdf(node,fileName){
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');

  const pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight(),m=20;const iw=pw-2*m,ih=ph-2*m;
  let ratio=iw/canvas.width;
  if(canvas.height*ratio<=ih*1.25)ratio=Math.min(ratio,ih/canvas.height); // чуть длиннее листа — вписываем на одну страницу
  const pageH=Math.floor(ih/ratio);
  for(let y=0,p=0;y<canvas.height;y+=pageH,p++){
    const h=Math.min(pageH,canvas.height-y);const sl=document.createElement('canvas');sl.width=canvas.width;sl.height=h;sl.getContext('2d').drawImage(canvas,0,y,canvas.width,h,0,0,canvas.width,h);

  }

}

    m.querySelector('#cl-add').onclick=()=>{cols.push({id:'c'+uid(),n:'Новая колонка',t:'text',w:160});draw(m)};

function trImport(done){
  openModal(`<h3>Импорт трекера из Excel</h3><p class="muted sm">Загрузите ваш файл — колонки станут колонками трекера, строки — задачами. Колонки, где повторяются несколько значений (Статус, Приоритет…), автоматически станут списками.</p><div id="ti-b"></div><label class="sw"><input type="checkbox" id="ti-rep"><span>заменить текущие задачи (иначе — добавить к ним)</span></label>`,m=>{
    m.querySelector('#ti-b').appendChild(dropzone('Excel или CSV с трекером','.xlsx,.xls,.csv',async f=>{
      try{const t=await readTable(f);let name=t.wb.SheetNames[0];if(t.wb.SheetNames.length>1)name=await new Promise(res=>{m.querySelector('#ti-b').innerHTML=`<p>Выберите лист:</p><div class="col">${t.wb.SheetNames.map(n=>`<button class="btn" data-n="${esc(n)}">${esc(n)}</button>`).join('')}</div>`;m.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>res(b.dataset.n))});
        const rows=sheetRows(t.wb,name);let h=0,best=0;for(let i=0;i<Math.min(10,rows.length);i++){const n=(rows[i]||[]).filter(x=>x!=null&&String(x).trim()).length;if(n>best){best=n;h=i}}
        const H=rows[h].map((x,j)=>String(x??'').trim()||('Колонка '+(j+1)));const data=rows.slice(h+1).filter(r=>r&&r.some(x=>x!=null&&String(x).trim()));
        const cols=H.map((n,j)=>{const vals=data.map(r=>r[j]).filter(v=>v!=null&&String(v).trim()!=='');const uniq=[...new Set(vals.map(String))];const isDate=vals.length&&vals.filter(v=>v instanceof Date||(typeof v==='number'&&v>30000&&v<60000)||/^\d{2}\.\d{2}\.\d{4}$/.test(String(v))).length/vals.length>.7;const long=vals.some(v=>String(v).length>60);const named=/статус|приоритет|состоян|тип\b|этап|категор/i.test(n);const sel=!isDate&&uniq.length>0&&uniq.every(u=>u.length<=30)&&((uniq.length<=10&&vals.length>=4)||(named&&uniq.length<=15));return{id:'c'+j+'_'+uid(),n,t:isDate?'date':sel?'select':long?'long':'text',opts:sel?uniq:undefined,w:long?300:150}});
        const keep=cols.map((c,j)=>data.some(r=>r[j]!=null&&String(r[j]).trim()));
        const C=cols.filter((c,j)=>keep[j]);const J=cols.map((c,j)=>j).filter(j=>keep[j]);
        const replace=m.querySelector('#ti-rep').checked;
        if(replace||!ST.tracker.order.length||await confirmBox('Колонки будут заменены колонками из вашего файла, текущие задачи сохранятся и добавятся в конец. Продолжить?','Продолжить')){
          if(replace){for(const id of ST.tracker.order){ST.tracker.rows[id]={...ST.tracker.rows[id],del:1,ts:nowTs()}}ST.tracker.order=[]}
          ST.tracker.cols=C;ST.tracker.ts=nowTs();
          const ids=[];data.forEach(r=>{const id='t'+uid();const o={id,ts:nowTs()};C.forEach((c,k)=>{let v=r[J[k]];if(v instanceof Date)v=parseDate(v);else if(c.t==='date')v=parseDate(v)||String(v??'');o[c.id]=v==null?'':String(v)});ST.tracker.rows[id]=o;ids.push(id)});
          ST.tracker.order=[...ids,...ST.tracker.order];ST.tracker.ord_ts=nowTs();logAct(`Импортирован трекер: ${data.length} задач`);touch();closeModal();toast(`Импортировано задач: ${data.length}`);done();
        }
      }catch(e){console.error(e);toast(e.message||'Не удалось прочитать файл','bad',6000)}
    }));
  });
}

V.ideas=function(el){
