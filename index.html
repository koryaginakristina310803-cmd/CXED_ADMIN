  el.innerHTML=`<div class="pghead"><div><h1>Идеи и предложения</h1><p class="muted">Что ещё можно добавить в приложение. Нажмите «В трекер», чтобы идея попала в ваш список доработок, или скройте то, что не нужно.</p></div></div>
  <div class="ideas">${[...IDEAS.filter(i=>IMPL[i.id]),...IDEAS.filter(i=>!IMPL[i.id])].filter(i=>st(i.id)!=='no'||IMPL[i.id]).map(i=>{const s=i.stat?i.stat():'';const im=IMPL[i.id];return `<div class="card idea ${im?'impl':st(i.id)==='added'?'added':''}"><div class="ih"><h3>${i.t}</h3>${im?tag('сделано','ok'):st(i.id)==='added'?tag('в трекере','ok'):''}</div><p>${i.d}</p>${s?`<p class="istat">${esc(s)}</p>`:''}<div class="row">${im?`<button class="btn pri" data-go="${im}">Открыть</button>`:`<button class="btn ${st(i.id)==='added'?'':'pri'}" data-add="${i.id}" ${st(i.id)==='added'?'disabled':''}>${st(i.id)==='added'?'Добавлено':'В трекер'}</button><button class="btn" data-no="${i.id}">Скрыть</button>`}</div></div>`}).join('')}</div>
  ${IDEAS.some(i=>!IMPL[i.id]&&st(i.id)==='no')?`<p class="muted sm"><a id="id-show">Показать скрытые (${IDEAS.filter(i=>!IMPL[i.id]&&st(i.id)==='no').length})</a></p>`:''}
  <div class="card"><h3>Нужна другая функция?</h3><p class="muted">Добавьте её в «Трекер доработок» — я смогу посмотреть список и взять в работу. Любые свои идеи записывайте туда же.</p><button class="btn" data-go="#tracker">Открыть трекер</button></div>`;
  $$('[data-add]',el).forEach(b=>b.onclick=()=>{const i=IDEAS.find(x=>x.id===b.dataset.add);const cols=trCols();const id='t'+uid();const o={id,ts:nowTs()};

    if(tc)o[tc.id]=i.t;if(dc&&dc!==tc)o[dc.id]=i.d;if(sc)o[sc.id]=(sc.opts||[]).includes('Идея')?'Идея':(sc.opts||[])[0]||'';

};

/* отметить выполненные идеи в трекере (один раз) */
function migrateIdeas(){
  if(VIEW)return;
  try{
    const cols=trCols();const stc=cols.find(c=>c.id==='status')||cols.find(c=>/статус|состоян/i.test(c.n));if(!stc)return;
    const done=(stc.opts||[]).find(o=>/готов|выполн|сделан|закрыт/i.test(o))||'Готово';
    let ch=0,fl=0;
    for(const i of IDEAS){
      if(!IMPL[i.id]||ST.ideas[i.id]?.impl)continue;
      for(const r of trRows()){
        if(String(bf(r,'title')||'').trim().toLowerCase()!==i.t.toLowerCase())continue;
        ST.tracker.rows[r.id]={...r,[stc.id]:done,ts:nowTs()};ch++;
      }
      ST.ideas[i.id]={...(ST.ideas[i.id]||{}),s:ST.ideas[i.id]?.s||'added',impl:today(),ts:nowTs()};fl=1;
    }
    if(ch){logAct(`Идеи реализованы, в трекере отмечено «${done}»: ${ch}`);}
    if(ch||fl)touch();
  }catch(e){console.error(e)}
}

  const f=$('#lf');

async function unlock(pass,remember){
  const{iter,salt}=parseHead(DATABIN);
  const key=await deriveKey(pass,salt,iter);
  let data;try{data=await decryptBlob(DATABIN,key)}catch(e){throw new Error('Неверный пароль')}
  if(remember){const raw=new Uint8Array(await crypto.subtle.exportKey('raw',key));LS.set(KEYN,{salt:b64(salt),key:b64(raw)})}
  await start(data,key,salt,iter);
}
async function tryRemembered(){
  const r=LS.get(KEYN,null);if(!r||!DATABIN)return false;
  try{const{iter,salt}=parseHead(DATABIN);if(b64(salt)!==r.salt)return false;
    const key=await crypto.subtle.importKey('raw',unb64(r.key),'AES-GCM',true,['encrypt','decrypt']);
    const data=await decryptBlob(DATABIN,key);await start(data,key,salt,iter);return true}catch(e){LS.del(KEYN);return false}
}
async function start(data,key,salt,iter){
  DATA=data;KEY=key;SALT=salt;ITER=iter;
  if(data.view){ // режим просмотра: без сохранения и синхронизации
    VIEW=data.view;ST=blankState();ST.marks=data.marks||{};ST.orig=data.orig||{};ST.seen=data.seen||{};ST.settings={...ST.settings,...(data.settings||{})};
    buildAll();shell();applyTheme();ARC.init();route();return;
  }
  const saved=await IDB.get('state');ST={...blankState(),...(saved||{})};ST.settings={...blankState().settings,...ST.settings};
  buildAll();migrateIdeas();shell();applyTheme();ARC.init();route();
  if(SYNC.cfg())SYNC.sync(false).then(()=>{buildAll();onStateMerged()});
  window.addEventListener('focus',()=>{if(SYNC.cfg()&&nowTs()-SYNC.lastOk>60000)SYNC.sync(false)});
}
async function boot(){
  applyTheme();
  try{await IDB.open()}catch(e){console.warn('IndexedDB недоступен',e)}
  document.getElementById('app').innerHTML='<div class="login"><div class="lcard"><div class="spin"></div><p class="muted">Загрузка…</p></div></div>';
  DATABIN=await loadBin();
  if(await tryRemembered())return;
  loginScreen();
}

/* ===== Почему у договора нет менеджера ===== */
function whyNoMgr(c){
  if(c.mgrBad)return 'В Описи в ячейке менеджера стоит дата, а не фамилия.';
  if(c.mgrOpis&&c.mgr===c.mgrOpis)return 'В Описи указано «'+c.mgrOpis+'» — такого менеджера в списке нет.';
  if(!MG1C)return 'В Описи менеджер не указан. В выгрузке 1С нет колонки «Менеджер» (или выгрузка не загружена) — проверить по 1С нельзя.';
  if(c.mgrNote)return 'В Описи менеджер не указан; в 1С записано только «'+c.mgrNote+'» в скобках.';
  if(c.mgrWhy)return 'В Описи менеджер не указан; '+c.mgrWhy+'.';
  return 'В Описи менеджер не указан и в 1С по этому договору менеджера тоже нет.';
}
/* ===== Подозрительные значения в колонке «Менеджер» ===== */
function mgSus(){
  const L=CON.filter(c=>inScope(c));const raw=c=>String(c.mgrBad||c.mgrOpis||'').trim();
  const cnt={};for(const c of L){const v=raw(c);if(v)cnt[v]=(cnt[v]||0)+1}
  const multi=v=>/[\/(),;]|\s[иИ]\s/.test(v)||/\s{2,}/.test(v);
  const clean=v=>!BADMGR.test(v)&&!multi(v)&&!/\d/.test(v)&&v.split(/\s+/).length<=2;
  const std=Object.keys(cnt).filter(v=>cnt[v]>=3&&clean(v));
  const lev=(a,b)=>{a=a.toLowerCase();b=b.toLowerCase();const d=[];for(let i=0;i<=a.length;i++){d[i]=[i];}for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]};
  const near=tok=>std.filter(s=>{const f=s.split(/\s+/)[0];return f.toLowerCase()===tok.toLowerCase()||(tok.length>=4&&lev(f,tok)<=2)});
  const out=[];
  for(const v of Object.keys(cnt)){
    let why='',kind='warn';
    if(BADMGR.test(v)){why='Вместо фамилии стоит дата.';kind='bad'}
    else if(multi(v)){why='В одной ячейке несколько менеджеров или лишние знаки.';kind='bad'}
    else if(/\d/.test(v)){why='В имени есть цифры.';kind='bad'}
    else if(v.split(/\s+/).length>2){why='Слишком длинно для фамилии.';kind='warn'}
    else if(cnt[v]<3){why='Встречается меньше 3 раз — проверьте, что это действующий менеджер или нет опечатки.';kind='info'}
    if(!why||std.includes(v))continue;
    const toks=v.split(/[\s\/(),;]+|\s[иИ]\s/).filter(t=>t&&t.length>=3&&!/\d/.test(t));
    const sg=[...new Set(toks.flatMap(near).filter(s=>s!==v))];
    const sug=BADMGR.test(v)?'—':sg.length===1?sg[0]:sg.length>1?'Один из: '+sg.join(' / '):'—';
    out.push({v,n:cnt[v],why,kind,sug,list:L.filter(c=>raw(c)===v)});
  }
  const ord={bad:0,warn:1,info:2};
  return out.sort((a,b)=>ord[a.kind]-ord[b.kind]||b.n-a.n);
}

/* ===== Проверка файла менеджера по выгрузке 1С ===== */
let CHKR=null;
async function chkFile(file){
  try{
    toast('Читаю файл…','info',1500);
    const t=await readTable(file);
    if(!t.wb){toast('Нужен файл Excel (.xlsx)','warn');return}
    const found=new Map();let sheets=0;
    for(const sn of t.wb.SheetNames){
      const rows=sheetRows(t.wb,sn);let hi=-1,map=null;
      for(let r=0;r<Math.min(rows.length,15);r++){
        const hdr=(rows[r]||[]).map(x=>x==null?'':String(x).trim());
        const m=guessCols(hdr);
        const jn=hdr.findIndex(h=>/(№|номер).*договор/i.test(h));if(jn>=0)m.num=jn;
        if(m.date==null){const j=hdr.findIndex(h=>/^дата/i.test(h));if(j>=0)m.date=j}
        if(m.num!=null&&m.cp!=null&&hdr.some(h=>/контрагент/i.test(h))){hi=r;map=m;break}
      }
      if(hi<0)continue;sheets++;
      for(let r=hi+1;r<rows.length;r++){
        const x=rows[r];if(!x)continue;
        const num=String(x[map.num]??'').trim(),cp=String(x[map.cp]??'').trim();
        if(!cp||(!num&&!x[map.date]))continue;
        if(/^(итого|всего)/i.test(cp))continue;
        const date=map.date!=null?parseDate(x[map.date]):'';
        const inn=(map.inn!=null?String(x[map.inn]??'').match(/\d{10,12}/)?.[0]:null)||(cp.match(/(?<!\d)(\d{10}|\d{12})(?!\d)/)||[])[0]||'';
        const key=nn(num)+'|'+cpk(cp)+'|'+date;
        if(!found.has(key))found.set(key,{num,cp,date,inn,sheet:sn});
      }
    }
    if(!found.size){toast('В файле не нашли таблицу с колонками «Контрагент» и «№ договора». Это файл, скачанный из «Выгрузок»?','warn',7000);return}
    const idx=buildIndex(C1);
    const byKey=new Map();for(const c of CON)if(c.k==='o')byKey.set(nn(c.num)+'|'+cpk(c.cp),c);
    const R={name:file.name,sheets,now:[],still:[],check:[]};
    for(const x of found.values()){
      const r=matchOne(x,idx,toks(x.cp),cpk(x.cp),nn(x.num));
      const c=byKey.get(nn(x.num)+'|'+cpk(x.cp));
      const item={...x,code:r.code,m:r.m,mgr:c?(c.mgr||'—'):'—'};
      if(r.code==='ok')R.now.push(item);else if(C1_NEW.includes(r.code))R.still.push(item);else R.check.push(item);
    }
    CHKR=R;chkShow();
  }catch(e){console.error(e);toast(e.message||'Не удалось прочитать файл','bad',6000)}
}
function chkShow(){
  const R=CHKR;const st=expSrcState('c1');const n=R.now.length+R.still.length+R.check.length;
  const list=(a,tone,title)=>a.length?`<div class="callout ${tone}" style="margin-top:8px"><b>${title} — ${a.length}</b><p class="sm">${a.slice(0,8).map(i=>esc(i.cp+' № '+i.num+(i.date?' от '+fmtD(i.date):''))).join('<br>')}${a.length>8?'<br>…и ещё '+(a.length-8)+' (все — в Excel)':''}</p></div>`:'';
  openModal(`<h3>Проверка файла менеджера</h3>
  <p><b>${esc(R.name)}</b><br><span class="muted sm">Договоров в файле: ${num(n)}${R.sheets>1?' · листов с таблицей: '+R.sheets:''}</span></p>
  <div class="callout ${st.st==='ok'?'ok':'warn'}"><b>Сравнение с выгрузкой 1С</b><p class="sm">1С: ${st.note}. ${st.st==='ok'?'':'Если менеджер уже внёс договоры в 1С — сначала загрузите свежую выгрузку 1С на странице «Старт», иначе они покажутся незаведёнными.'}</p></div>

/* ===== Что изменилось с прошлой недели ===== */
function weekBlock(){
  const t=today();const d0=new Date(t+'T00:00:00');d0.setDate(d0.getDate()-7);
  const iso=d0.getFullYear()+'-'+pad(d0.getMonth()+1)+'-'+pad(d0.getDate());
  const snaps=ST.snaps||{};const ds=Object.keys(snaps).sort();
  const old=ds.filter(d=>d<=iso),before=ds.filter(d=>d<t);
  const bd=old.length?old[old.length-1]:(before.length?before[0]:null);
  const K=KPI;
  if(!bd)return `<section class="card" style="margin:0 0 14px"><h3>Что изменилось за неделю</h3><p class="muted sm">Пока сравнивать не с чем: приложение запоминает состояние при каждом открытии. Через несколько дней здесь появится, сколько договоров закрыто и что стало лучше или хуже. Сейчас сведено полностью: <b>${num(K.full)}</b> из ${num(K.total)}.</p></section>`;
  const b=snaps[bd];const days=daysFrom(bd);
  const dl=(a,c,goodUp)=>{if(c==null)return '';const d=a-c;if(!d)return 'без изменений';const ok=goodUp?d>0:d<0;return `<span style="color:var(--${ok?'ok':'bad'});font-weight:700">${d>0?'+':''}${d}</span>`};
  const first=ds[0];
  const seen=Object.entries(ST.seen||{}).filter(([k])=>{const c=CONMAP.get(k);return c&&inScope(c)});
  const closed=seen.filter(([k,s])=>s.r&&s.r>=iso).length;
  const fresh=seen.filter(([k,s])=>s.d&&s.d>=iso&&s.d>first&&!s.r).length;
  const ts0=d0.getTime();
  const marked=Object.entries(ST.marks||{}).filter(([k,m])=>(m.s==='done'||m.s==='skip')&&(m.ts||0)>=ts0&&CONMAP.has(k)).length;
  const mv=Object.keys(K.byMgr||{}).filter(m=>m!=='Не указан'&&b.m&&b.m[m]!=null).map(m=>({m,d:K.byMgr[m].open-b.m[m]})).filter(x=>x.d);
  const better=mv.filter(x=>x.d<0).sort((a,c)=>a.d-c.d).slice(0,3),worse=mv.filter(x=>x.d>0).sort((a,c)=>c.d-a.d).slice(0,3);
  const line=(a,c)=>a.length?`<div style="flex:1;min-width:200px"><b>${c}</b><div class="sm muted">${a.map(x=>esc(x.m)+' '+(x.d>0?'+':'')+x.d).join(' · ')}</div></div>`:'';
  return `<section class="card" style="margin:0 0 14px"><div class="row between"><h3>Что изменилось с ${fmtD(bd)}</h3><span class="muted sm">${days>0?days+' '+plural(days,'день','дня','дней')+' назад':'сегодня'}</span></div>
  <div class="kpis tiles"><div class="kpi ok"><span class="kl">Сведено полностью</span><span class="kv">${num(K.full)}</span><span class="ks">${dl(K.full,b.f,true)}</span></div>
  <div class="kpi info"><span class="kl">Осталось в работе</span><span class="kv">${num(K.open)}</span><span class="ks">${dl(K.open,b.o,false)}</span></div>
  <div class="kpi bad"><span class="kl">Нет в 1С</span><span class="kv">${num(K.c1bad)}</span><span class="ks">${dl(K.c1bad,b.c1,false)}</span></div>
  ${HIDE()?'':`<div class="kpi warn"><span class="kl">Нет в СХЭД и в архивах</span><span class="kv">${num(K.sxbad)}</span><span class="ks">${dl(K.sxbad,b.sx,false)}</span></div>`}</div>
  <p class="sm" style="margin:8px 0">За это время: <b>${closed}</b> ${plural(closed,'вопрос закрыт','вопроса закрыто','вопросов закрыто')}, <b>${fresh}</b> ${plural(fresh,'новый появился','новых появилось','новых появилось')}, отмечено вами «Готово» / «Не нужно»: <b>${marked}</b>.</p>
  ${better.length||worse.length?`<div class="row" style="gap:18px;flex-wrap:wrap">${line(better,'Стало лучше у менеджеров')}${line(worse,'Стало хуже у менеджеров')}</div>`:''}</section>`;

let REM_HIDE=false;
function remList(){

/* --- сравнение старой и новой выгрузки --- */
function cmpCurRecs(k){
  if(k==='c1')return C1.map(r=>[r.num,r.cp,r.date,r.state||'']);
  if(k==='sxed')return SXREC.map(r=>[r.num,r.cp,r.date,r.state||'']);
  if(k==='sbis')return SBIS.map(r=>[r.num,r.cp,r.date,r.state||'']);
  if(k==='opis')return CON.filter(c=>c.k==='o').map(c=>[c.num,c.cp,c.date,c.mgrOpis!==undefined?c.mgrOpis:(c.mgr||'')]);
  return null;
}
function capturePrev(k,parts){
  if(!['c1','sxed','sbis','opis'].includes(k))return;if(parts&&!parts.dog)return;
  const rec=cmpCurRecs(k);if(!rec||!rec.length||rec.length>40000)return;
  const u=ST.uploads[k];ST.cmpPrev=ST.cmpPrev||{};
  ST.cmpPrev[k]={rec:rec.map(r=>[String(r[0]??''),String(r[1]??'').slice(0,70),r[2]||'',String(r[3]??'').slice(0,40)]),ts:u?u.ts:null,name:u?u.name:'данные из поставки',built:u?'':String(DATA.built||'').slice(0,10),at:nowTs()};
}
const CMP_NAMES={c1:'1С',sxed:'СХЭД',sbis:'СБИС',opis:'Опись'};
function cmpDiff(k){
  const P=(ST.cmpPrev||{})[k];if(!P)return null;
  const cur=cmpCurRecs(k);if(!cur)return null;
  const key=r=>nn(r[0])+'|'+cpk(r[1]);
  const pm=new Map(),cm=new Map();
  for(const r of P.rec){const x=key(r);if(!pm.has(x))pm.set(x,r)}
  for(const r of cur){const x=key(r);if(!cm.has(x))cm.set(x,r.map(v=>v==null?'':v))}
  const added=[],removed=[],changed=[];
  for(const [x,r] of cm){const p=pm.get(x);if(!p)added.push(r);else{const d=[];if((p[2]||'')!==(r[2]||''))d.push('дата: '+fmtD(p[2])+' → '+fmtD(r[2]));if(String(p[3]||'')!==String(r[3]||''))d.push((k==='opis'?'менеджер: ':'состояние: ')+(p[3]||'—')+' → '+(r[3]||'—'));if(d.length)changed.push([r,d.join('; ')])}}
  for(const [x,r] of pm)if(!cm.has(x))removed.push(r);
  const opisKeys=k==='opis'?null:new Set(CON.filter(c=>c.k==='o').map(c=>nn(c.num)+'|'+cpk(c.cp)));
  const matched=opisKeys?added.filter(r=>opisKeys.has(key(r))).length:null;
  return{P,was:P.rec.length,now:cur.length,added,removed,changed,matched};
}
function cmpChangesHTML(){
  const ks=['c1','sxed','opis','sbis'].filter(k=>ST.cmpPrev&&ST.cmpPrev[k]);
  if(!ks.length)return `<section class="card"><h3>Что изменилось в выгрузках</h3><p class="muted sm">Здесь появится сравнение, когда вы загрузите новую выгрузку поверх прежней: что добавилось, что пропало и что изменилось. Загрузите свежую выгрузку 1С на «Старте» — и сразу увидите, какие договоры менеджеры уже внесли.</p></section>`;
  return `<section class="card"><h3>Что изменилось в выгрузках</h3><p class="muted sm hl">Сравнение последней загруженной выгрузки с предыдущей.</p><div class="chglist">${ks.map(k=>{
    const D=cmpDiff(k);if(!D)return '';const when=D.P.ts?'загрузка от '+new Date(D.P.ts).toLocaleDateString('ru-RU'):'данные из поставки'+(D.P.built?' на '+fmtD(D.P.built):'');
    const same=!D.added.length&&!D.removed.length&&!D.changed.length;
    return `<div class="chg"><div class="row between" style="gap:10px;flex-wrap:wrap"><div><b>${CMP_NAMES[k]}</b><div class="muted sm">было ${num(D.was)} (${when}) → стало ${num(D.now)}</div></div>${same?'<span class="pill ok">без изменений</span>':`<button class="btn sm" data-chg="${k}">${ic('dl',14)} Скачать список</button>`}</div>
    ${same?'':`<div class="chgn"><span class="pill ok">+ ${num(D.added.length)} добавилось</span><span class="pill bad">− ${num(D.removed.length)} пропало</span><span class="pill warn">✎ ${num(D.changed.length)} изменилось</span>${D.matched!=null?`<span class="pill info">из добавленных есть в Описи: ${num(D.matched)}</span>`:''}</div>`}</div>`}).join('')}</div></section>`;
}
async function cmpDiffExcel(k){
  const D=cmpDiff(k);if(!D)return;const N=CMP_NAMES[k];
  const head=['№','Контрагент','№ договора','Дата',k==='opis'?'Менеджер':'Состояние'];
  const mk=a=>a.map((r,i)=>[i+1,r[1],r[0],fmtD(r[2]),r[3]||'']);
  const sh={};
  sh['Сводка']={rows:[['Что изменилось: '+N],['Сравнение с предыдущей выгрузкой ('+(D.P.ts?new Date(D.P.ts).toLocaleDateString('ru-RU'):'данные из поставки')+') · на '+fmtD(today())],[],['Что','Договоров'],['Было',D.was],['Стало',D.now],['Добавилось',D.added.length],['Пропало',D.removed.length],['Изменилось',D.changed.length]].concat(D.matched!=null?[['Из добавленных есть в Описи',D.matched]]:[]),hdr:3,widths:[36,14],filter:false};
  if(D.added.length)sh['Добавилось']={rows:[['Добавилось ('+D.added.length+')'],[],[],head,...mk(D.added)],hdr:3,widths:[5,40,24,13,34],tab:XL_TAB.ok};
  if(D.removed.length)sh['Пропало']={rows:[['Пропало ('+D.removed.length+')'],['Эти записи были в прежней выгрузке и пропали из новой.'],[],head,...mk(D.removed)],hdr:3,widths:[5,40,24,13,34],tab:XL_TAB.bad};
  if(D.changed.length)sh['Изменилось']={rows:[['Изменилось ('+D.changed.length+')'],[],[],[...head,'Что изменилось'],...D.changed.map(([r,t],i)=>[i+1,r[1],r[0],fmtD(r[2]),r[3]||'',t])],hdr:3,widths:[5,40,24,13,30,50],tab:XL_TAB.warn};
  await exportXLSX('Что_изменилось_'+N+'_'+today()+'.xlsx',sh,{title:'Как читать — что изменилось в выгрузке '+N,readme:[['Что это','Сравнение новой выгрузки с предыдущей: что добавилось, пропало и изменилось.'],['Зелёный','Добавилось.','ok'],['Красный','Пропало.','bad'],['Жёлтый','Изменилось.','warn']]});
  logAct('Excel «Что изменилось: '+N+'»');toast('Файл сформирован');
}
/* --- пакет «сделать всё сразу» --- */
function packPlan(){
  const P=[
    {g:'1_Главбуху',t:'Нет в 1С: что догрузить',run:()=>c1Excel(),ok:()=>c1Debt().rows.length>0},
    {g:'2_Менеджерам',t:'Задолженность каждого менеджера (внутри ZIP — по файлу на менеджера)',run:()=>expAs('mgr',()=>debtAll()),ok:()=>expDebtCount().r>0},
    {g:'2_Менеджерам',t:'Все договоры (Опись и 1С)',run:()=>allExcel('mgr'),ok:()=>true},
    {g:'3_Для_себя',t:'Что загрузить в СХЭД',run:()=>sxdExcel(),ok:()=>CON.filter(c=>inScope(c)&&(c.sx==='no'||c.sx==='arch')).length>0},
    {g:'3_Для_себя',t:'Менеджеры: Опись и 1С — что расходится',run:()=>mgCmpExcel(),ok:()=>!!mgcRows()},
    {g:'3_Для_себя',t:'Менеджеры: подозрительные значения в Описи',run:()=>mgSusExcel(),ok:()=>mgSus().length>0},
    {g:'3_Для_себя',t:'Все договоры — все источники',run:()=>allExcel('all'),ok:()=>true}
  ];
  return P.map(p=>{let ok=false;try{ok=p.ok()}catch(e){}return{...p,use:ok}});
}
function packModal(){
  const plan=packPlan();const L=remList();
  const warn=L.length?`<div class="callout warn"><b>Есть что проверить перед отправкой</b><p class="sm">${L.map(x=>esc(x.l)+' — '+x.t).join('<br>')}</p><p class="sm muted">Пакет можно собрать и так, но он будет по данным из приложения. Лучше сначала загрузить свежие выгрузки на «Старте».</p></div>`:`<div class="callout ok"><b>Данные свежие</b><p class="sm">Можно собирать и отправлять.</p></div>`;
  openModal(`<h3>Подготовить пакет</h3><p class="muted">Одним ZIP-файлом: всё, что нужно отправить главбуху и менеджерам, и ваши рабочие списки. Файлы разложены по папкам.</p>
  ${warn}<h4 style="margin:12px 0 4px">Что будет внутри</h4>
  <table class="tbl sm"><tbody>${plan.map(p=>`<tr><td style="width:130px" class="muted">${esc(p.g.replace(/^\d_/,'').replace(/_/g,' '))}</td><td>${esc(p.t)}</td><td class="r">${p.use?tag('будет','ok'):tag('пропущу — пусто','mute')}</td></tr>`).join('')}</tbody></table>
  <p class="muted sm" style="margin-top:8px">Файлы для менеджеров и главбуха содержат только Опись и 1С. СХЭД и архивы — только в папке «Для себя».</p>
  <div class="row end" style="margin-top:12px"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn pri" id="pk-go">${ic('dl',15)} Собрать пакет</button></div>`,m=>{m.querySelector('#pk-go').onclick=()=>{closeModal();packBuild().catch(e=>{console.error(e);toast(e.message||'Не удалось собрать пакет','bad',7000)})}});
}
async function packBuild(){
  const plan=packPlan().filter(p=>p.use);const caught=[];
  const oX=exportXLSX,oD=download,oT=toast;
  const chunks=[];const z=new ZipOut({write:async u=>{chunks.push(u)},close:async()=>{}});
  const notes=[];
  try{
    exportXLSX=(name,sheets,opts)=>{caught.push({name,sheets,opts});return Promise.resolve()};
    download=(name,blob)=>{caught.push({name,blob})};
    toast=()=>{};
    for(const p of plan){
      const before=caught.length;
      try{await p.run()}catch(e){notes.push('Не удалось собрать: '+p.t+' ('+(e.message||e)+')');continue}
      const got=caught.slice(before);
      if(!got.length){notes.push('Пропущено (пусто): '+p.t);continue}
      for(const g of got){
        const data=g.blob||await xlsxBuild(g.sheets,g.opts);
        await z.add(p.g+'/'+g.name,data);
      }
    }
  }finally{exportXLSX=oX;download=oD;toast=oT}
  const L=remList();
  const rd=['ПАКЕТ СВЕРКИ — '+fmtD(today()),'СХЭД · Учёт, ТЕХНОСТАЙЛ','',
    'Папки:','  1_Главбуху — что нужно догрузить в 1С.','  2_Менеджерам — файлы для отправки менеджерам (только Опись и 1С).','  3_Для_себя — ваши рабочие списки (есть СХЭД и архивы, менеджерам не отправлять).','',
    'Данные, по которым собран пакет:',...['opis','c1','sxed'].map(k=>'  '+({opis:'Опись',c1:'1С',sxed:'СХЭД'})[k]+': '+String(expSrcState(k).note).replace(/<[^>]+>/g,'').replace(/&[a-z]+;/g,' ')),'',
    L.length?'ВНИМАНИЕ: '+L.map(x=>x.l+' — '+x.t).join('; ')+'. Перед отправкой лучше загрузить свежие выгрузки.':'Данные свежие — можно отправлять.',
    ...(notes.length?['','Заметки:',...notes.map(n=>'  '+n)]:[])].join('\r\n');
  await z.add('00_Прочти_меня.txt','﻿'+rd);
  await z.finish();
  download('Пакет_сверки_'+today()+'.zip',new Blob(chunks,{type:'application/zip'}));
  logAct('Пакет сверки: файлов '+plan.length);
  toast('Пакет готов — проверьте «Прочти меня» внутри','ok',6000);
}

V.compare=function(el){
  const K=KPI,rows=cmpSrcRows();

  const next=K.total&&!K.open?'Всё сведено — ничего делать не нужно.':worst&&worst.c.g.bad?`Начните с самого важного: <b>${num(worst.c.g.bad)}</b> договоров, которых нет в ${worst.s.name}.`:'Остались договоры, где данные не совпадают — их нужно проверить.';
  el.innerHTML=`<div class="pghead"><div><h1>Сверка</h1><p class="muted">Опись договоров сравнивается с 1С, СХЭД и СБИС. Нажмите на любую цифру — откроется список этих договоров.</p></div><div class="row nopr"><button class="btn" onclick="window.print()">${ic('print',16)} Печать</button><button class="btn pri" id="cmp-pack">${ic('dl',16)} Подготовить пакет</button></div></div>
  ${remBar(true)}
  <section class="card cmphero"><div class="ringw">${ring(pct,112,'var(--ok)')}</div><div><h2>Сведено полностью: ${num(K.full)} из ${num(K.total)}</h2><p>${next}</p><div class="cmplegend"><span><i class="ok"></i>Совпало — всё хорошо</span><span><i class="warn"></i>Проверить — данные отличаются</span><span><i class="bad"></i>Нет — нужно действие</span><span><i class="mute"></i>Не сверено</span></div></div></section>
  ${rows.map(cmpRowHTML).join('')}
  <section class="card"><h3>Найти договор и сравнить источники</h3><p class="muted sm hl">Введите название контрагента, номер договора или ИНН — увидите, как договор записан в Описи, 1С, СХЭД и архиве, и что именно не совпадает.</p><div class="fsearch cmpq">${ic('search',17)}<input id="cmp-q" placeholder="Например: Альфа, А-1 или ИНН" autocomplete="off"></div><div id="cmp-res" class="cmpres"></div></section>
  ${cmpChangesHTML()}
  <section class="card"><h3>Дальше</h3><div class="row" style="gap:10px;flex-wrap:wrap"><button class="btn" data-go="#exports/chk">${ic('check',15)} Проверить файл менеджера</button><button class="btn" data-go="#managers/_check">${ic('users',15)} Менеджеры: что проверить</button><button class="btn" data-go="#exports">${ic('dl',15)} Все выгрузки</button></div></section>`;
  el.querySelector('#cmp-pack').onclick=packModal;
  cmpSearch(el);
  el.querySelectorAll('[data-chg]').forEach(b=>b.onclick=()=>cmpDiffExcel(b.dataset.chg).catch(e=>toast(e.message||'Ошибка','bad')));
};
